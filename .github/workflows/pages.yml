name: Build and deploy public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git recency needs history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate structured files
        run: python -m yss validate
      - name: Check evidence (cited paths, symbols, git recency)
        run: python -m yss check
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build public target (redacted)
        env:
          # Semicolon-separated secrets; the build fails if any appear in the output.
          YSS_FORBIDDEN_STRINGS: ${{ secrets.YSS_FORBIDDEN_STRINGS }}
          YSS_FLAG_STRINGS: ${{ secrets.YSS_FLAG_STRINGS }}
        run: python -m yss build --target public --strict   # stale evidence or flagged strings fail the deploy (verdict V.4)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
