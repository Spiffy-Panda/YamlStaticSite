# Collection configuration - schema: collection (python -m yss schema collection --yaml)
# One folder = one isolated doc set. Docs here get ids demo-musing/<file>, pages live under /demo-musing/.
title: Demo musing
summary: A small collection that exercises the contract - local docs and pages, a per-collection vocabulary, a mounted playable, a hook provider and a generated doc.
emblem: "🧪"
order: 1
status: active
tags: [example]
hero: true                                     # the card contract (adr-017): this one leads the panel
links:                                         # hrefs are relative to /demo-musing/
  - {label: Overview, href: "", kind: page}
  - {label: The playable, href: "play/index.html", kind: play}
theme:
  accent: "#7a3e9d"
  css: [assets/theme.css]
vocabularies:
  risk_status: [open, watching, resolved]      # this musing tracks risks its own way
limits:
  summary: 400
evidence:
  git_recency: true                            # this collection's own evidence policy (site.yaml is the fallback)
dynamic:
  sources:
    notes:
      provider: hooks:notes                    # defined in hooks.py providers
      targets: [public, private]
      description: Files in the play folder, listed at build time.
mounts:
  - path: play                                 # copied to /demo-musing/play/ in both builds
    at: play/
    targets: [private, public]                 # mounts default to private; a public playable opts in here (adr-015)
    include: ["*.html"]                        # gh-3: publish only the playable page itself, nothing beside it
register:                                      # the contradiction register this collection runs
  doc: register                                # docs/register.yaml
  out: live-rules                              # the generated docs/live-rules.yaml
  series:
    - prefix: DMP
      label: Demo musing plan handles
      # A strike is written differently in different collections - in one it retires a handle, in
      # another it strikes superseded text inside a claim that is still live. Declared per series
      # so one collection's patterns can never be pointed at another's file.
      strike_forms: ["~~{handle}", "{handle} - RETIRED"]
agent_notes: Anything unique to this musing goes in hooks.py; shared behaviour goes upstream into yss.
