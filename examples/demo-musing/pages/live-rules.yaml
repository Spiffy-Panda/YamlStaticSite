# The generated live-rules list: what binds right now. This is the page a working agent is pointed
# at; the register is the one for auditing history. Both are private, explicitly.
id: live-rules
title: Live rules
summary: What still binds in this musing, generated from the register. Retired handles appear as bare numbers with no text.
visibility: private
nav: {label: Live rules, order: 7}
docs: [live-rules]
sections:
  - id: about
    type: markdown
    markdown: |
      Generated by `python -m yss live-rules demo-musing` and committed, because a file you must run
      a generator to read is a file a fresh agent will not read. Never hand-edit either the doc or
      this page's data: every edit is lost on the next run. Nothing runs the generator for you -
      `python -m yss check --run-commands` is what reports a stale list.

  - id: in-force
    type: prefab
    heading: Rules in force
    intro: Verbatim from the register, which is verbatim from the item each handle names. No second copy of any rule exists.
    prefab: table
    args:
      rows: {from: live-rules.data.in_force}
      columns:
        - {key: subject, label: Handle}
        - {key: says, label: Says, md: true}
        - {key: lives_in, label: Lives in}
      empty: Nothing binds right now.

  - id: settled
    type: prefab
    heading: Settled
    intro: Delivered, answered or recorded. Settled is not re-openable - these were decided and the decision stands.
    prefab: table
    args:
      rows: {from: live-rules.data.settled}
      columns:
        - {key: subject, label: Handle}
        - {key: says, label: Says, md: true}
        - {key: state, label: How}
      empty: Nothing has settled yet.

  - id: tensions
    type: prefab
    heading: Open tensions
    intro: Only pairs that are open and whose subjects are all still live. Both sides quoted verbatim.
    prefab: table
    args:
      rows: {from: live-rules.data.open_tensions}
      columns:
        - {key: id, label: Pair}
        - {key: kind, label: Kind}
        - {key: resolves, label: What would settle it, md: true}
      empty: No open tension names a live handle.

  - id: retired
    type: prefab
    heading: Retired handles
    intro: |
      Numbers only, no text. A retired number is listed so it reads as *spent* rather than missing -
      the series is append-only and a number is never reused - without teaching a reader what it
      said. That withholding is the whole point of this page.
    prefab: table
    args:
      rows: {from: live-rules.data.retired}
      columns:
        - {key: series, label: Series}
        - {key: numbers, label: Spent}
      empty: Nothing has been retired yet, so this list currently withholds nothing.
