# Landing page of the demo collection. Route becomes /demo-musing/ automatically.
id: index
title: Demo musing
summary: A collection's landing page - its plan, its generated inventory doc, runtime data from a hook provider, and the mounted playable.
nav: {label: Overview, order: 1}
docs: [plan, inventory]
sections:
  - id: about
    type: markdown
    markdown: |
      This page lives in `examples/demo-musing/pages/`. Its bindings say `plan`, not
      `demo-musing/plan`: inside a collection, local ids win. The theme accent and the emblem come
      from `collection.yaml`; the inventory doc below is generated by `hooks.py`.

  - id: tasks
    type: prefab
    heading: Plan
    prefab: task-list
    args:
      milestones: {from: plan.milestones}

  - id: risks
    type: prefab
    heading: Risks (local vocabulary)
    intro: "This collection's risk_status is `open | watching | resolved`, set in collection.yaml."
    prefab: table
    args:
      rows: {from: plan.risks}
      columns: [{key: title, label: Risk}, {key: status, label: Status}, {key: mitigation, label: Mitigation, md: true}]

  - id: inventory
    type: prefab
    heading: Generated doc
    intro: Produced by `load_docs()` in hooks.py from the files in play/.
    prefab: table
    args:
      rows: {from: inventory.data}

  - id: notes
    type: dynamic
    heading: Hook provider
    intro: A dynamic source declared in collection.yaml and served by `providers["notes"]` in hooks.py.
    source: notes
    view: table
    path: files

  - id: play
    type: embed
    heading: Playable
    kind: iframe
    src: play/index.html
    height: 240
    caption: Mounted from the collection's play/ folder. Mounts are private unless collection.yaml lists the public target; this one opts in.
