# Page - schema: page. Presents docs/later.yaml, the live worksheet.
id: later
route: /later/
title: Later
summary: The decisions still waiting on Panda, as a worksheet with pros and cons per option. Answer, build the instruction, hand it to an agent.
visibility: public          # worksheets stay on the public site (P.2, 2026-09-02)
nav: {label: Later, order: 43}
docs: [later, plan]
sections:
  - id: worksheet
    type: prefab
    prefab: worksheet
    args:
      title: {from: later.title}
      intro: {from: later.intro}
      warn: {from: later.warn}
      questions: {from: later.questions}
      prompt: {from: later.prompt}
      decided_by: true
      extra: true

  - id: waiting
    type: prefab
    heading: Plan questions still open
    intro: Every question in [[plan]] that nobody has answered yet, whether or not a worksheet question above covers it.
    prefab: table
    args:
      rows:
        from: plan.open_questions
        where: {status: open}
      columns:
        - {key: id, label: Id}
        - {key: question, label: Question, md: true}
        - {key: owner, label: Owner}
      empty: Every question in the plan has been answered.

  - id: previous
    type: markdown
    heading: Previous worksheets
    markdown: |
      - [[next]] - applied 2026-09-03; kept as the record.
      - [[open]] - applied 2026-09-02; kept as the record.
      - [[pending]] - applied 2026-09-02; kept as the record.
      - [[verdicts]] - applied 2026-09-02; kept as the record.
