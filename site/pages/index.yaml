# Page - schema: page (python -m yss schema page --yaml)
id: index
route: /
title: YamlStaticSite
summary: A toolchain that turns agent-first structured YAML into a human-first static site. This site is built from its own docs.
visibility: public
nav: {label: Home, order: 0, group: content}
sections:
  - id: what
    type: markdown
    markdown: |
      **The idea.** Agents keep the project's plan, design, code map and decisions in typed YAML
      files under `docs/`. Humans read a generated site that frames that data with prose, cards and
      boards. One source tree produces a redacted **public** site for GitHub Pages and a full
      **private** site for local use, and the docs prove they are current: paths, symbols and
      commands they cite are checked, and stale claims show up as badges (see [[design#c-evidence]]).

      Every page here is assembled from three kinds of files:

      1. **Structured docs** (`docs/*.yaml`) hold the facts, validated by schema.
      2. **Pages** (`site/pages/*.yaml`) decide what to show, in what order, with what framing.
      3. **Prefabs** (`yss/prefabs/*.yaml`, `site/prefabs/*.yaml`) are the reusable UI pieces the pages fill from lists in the docs.

  - id: waiting
    type: markdown
    heading: Waiting on you
    jinja: true
    markdown: |
      Everything below is read live from the plan and the worksheets; nothing here is typed by hand.
      These are the plan tasks whose owner is `panda` and whose status is not `done` - the calls and
      the hands-on work no agent can take off you.

      {% set rows = [] %}{% for m in docs.plan.milestones if m.status != 'done' %}{% for t in m.tasks or [] if t.owner == 'panda' and t.status not in ('done', 'dropped') %}{% set _ = rows.append('- **' ~ t.title ~ '** — `' ~ t.status ~ '` · [' ~ m.title ~ '](' ~ url('/plan/') ~ '#' ~ t.id ~ ')') %}{% endfor %}{% endfor %}{{ rows | join('\n') }}

      A task marked `blocked` is waiting on another one, not on a decision; the decisions live in the
      worksheets below.

  - id: worksheets
    type: prefab
    heading: Worksheets still open
    intro: |
      A worksheet is a list of calls only you can make. Open one, read the recommended default and
      the pros and cons under each option, then press **Build the instruction** and hand the text to
      an agent in a fresh session. Nothing is saved by the page - the instruction is the product, and
      the resulting doc edit is the record. A worksheet drops off this list when its status becomes
      `archived`.
    prefab: card-grid
    args:
      items:
        from: $docs
        where: {kind: worksheet, status: active}
        sort: id
        map:
          badge: status
          body: summary
          href: "{{ doc_url(id) }}"
          meta: "{{ questions | length }} calls to make"
      columns: 2
      empty: No worksheet is waiting on a verdict.

  - id: worksheet-records
    type: prefab
    heading: Worksheets already applied
    intro: |
      The record of every call that has been made. Each of these was answered, applied, and then
      written back onto its own questions: what addressed each one sits under it, and the choices as
      they were offered are kept in a foldout beneath. Nothing here is waiting on anybody, which is
      why these pages are reached from here rather than from the bar at the top.
    prefab: card-grid
    args:
      items:
        from: $docs
        where: {kind: worksheet, status: archived}
        sort: id
        map:
          body: summary
          href: "{{ doc_url(id) }}"
          meta: "{{ questions | length }} calls, all applied"
      columns: 3
      empty: No worksheet has been applied yet.

  - id: musings-blockers
    type: prefab
    heading: What is blocking the Musings repository
    intro: |
      Adopting yss in the Musings repository ([[plan#m12-musings]]) is the largest open milestone,
      and it is held up by two route problems found in the issue sweep, both now tasks below.
      A collection takes its id from its folder name
      ([issue 2](https://github.com/Spiffy-Panda/YamlStaticSite/issues/2)), so a musing whose folder
      and published slug differ cannot keep its URL; and every collection mounts directly under the
      site root ([issue 4](https://github.com/Spiffy-Panda/YamlStaticSite/issues/4)), so nothing can
      sit under a `/musings/` prefix. Migrating the first musing before both land would change live
      URLs, which is why [[plan#m12-first]] now depends on them. Wanted alongside, but not blocking:
      `yss new collection` ([issue 1](https://github.com/Spiffy-Panda/YamlStaticSite/issues/1)),
      which would scaffold the collection each migration hand-builds today.
    prefab: task-list
    args:
      milestones: {from: plan.milestones, where: {id: m12-musings}}
      show_verify: true

  - id: docs
    type: prefab
    heading: Structured docs in this repo
    intro: Each card is one YAML file. The link opens the page that presents it; a stale or warn badge means a claim in it no longer matches the code.
    prefab: doc-index
    args:
      docs: {from: $docs, where: {_collection: ""}, sort: kind}
      columns: 3

  - id: collections
    type: prefab
    heading: Collections
    intro: |
      A collection is a folder with its own docs, pages, prototypes and hooks - the shape of a
      musing. Each card is drawn from that folder's `collection.yaml`: emblem, blurb, and the links
      it declares, which reach both its pages and its prototypes. A collection that asks for the
      hero slot leads the panel. Nothing here is written by hand, so a new collection appears by
      existing (see [[decisions#adr-017]]).
    prefab: collection-index
    args:
      collections: {from: $collections}
      columns: 3
      hero: true

  - id: active
    type: prefab
    heading: What is active right now
    intro: Pulled live from `plan.yaml` - milestones whose status is `active`.
    prefab: card-grid
    args:
      items:
        from: plan.milestones
        where: {status: active}
        sort: priority
        map:
          badge: status
          body: summary
          href: "{{ url('/plan/') }}#{{ id }}"
          meta: "{{ (tasks | selectattr('status', 'equalto', 'done') | list | length) ~ ' of ' ~ (tasks | length) ~ ' tasks done' }}"
      columns: 2
      empty: Nothing is active.

  - id: how
    type: markdown
    heading: How a page comes together
    markdown: |
      ```text
      docs/plan.yaml ──validate + check──▶ filtered for target ──┐
      site/pages/plan.yaml  (sections + bindings) ──────────────┼──▶ render prefabs ──▶ dist/<target>/plan/index.html
      yss/prefabs/*.yaml    (templates + css) ──────────────────┘                        dist/<target>/data/docs/plan.json
      ```

      The same filtered data is exported as JSON next to the HTML, so anything that can read a
      file can read the site. Runtime data (test runs, git state) is fetched from
      `dynamic/*.json` and rendered by a small script; without JavaScript you still get the page.

  - id: buildinfo
    type: dynamic
    heading: This build
    intro: A dynamic section. The numbers come from `dynamic/buildinfo.json`, collected when the site was built.
    source: buildinfo
    view: kv
    empty: Build information was not collected for this target.

  - id: local
    type: dynamic
    heading: Repository state (private)
    intro: This section only exists in the private build; the public build drops it before rendering.
    visibility: private
    source: gitlog
    view: table
    path: commits
    columns: [hash, date, author, subject]
    empty: Not a git repository yet.
