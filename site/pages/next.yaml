# Page - schema: page. Presents docs/next.yaml, applied 2026-09-03 and kept as the record.
id: next
route: /next/
title: Next decisions (record)
summary: A worksheet that has been applied, kept as the record of what was asked and what it turned into. Nothing here is still to answer; the live worksheet is Later.
visibility: public          # worksheets stay on the public site (P.2, 2026-09-02)
nav: {label: Next, order: 44, group: decide}
docs: [next, plan]
sections:
  - id: worksheet
    type: prefab
    prefab: worksheet
    args:
      title: {from: next.title}
      intro: {from: next.intro}
      questions: {from: next.questions}
      prompt: {from: next.prompt}
      decided_by: true
      extra: true

  - id: waiting
    type: prefab
    heading: Plan milestones as they stand now
    intro: What the milestones in [[plan]] look like after this worksheet was applied - the pilot milestone is no longer among them.
    prefab: table
    args:
      rows:
        from: plan.milestones
        map: {milestone: id}
      columns: [{key: milestone, label: Milestone}, {key: status, label: Status}, {key: title, label: Title}]

  - id: previous
    type: markdown
    heading: Other worksheets
    markdown: |
      - [[later]] - the live one; answer that instead.
      - [[open]] - applied 2026-09-02; the record.
      - [[pending]] - applied 2026-09-02; the record.
      - [[verdicts]] - applied 2026-09-02; the record.
