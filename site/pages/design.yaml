# Page - schema: page. Presents docs/design.yaml.
id: design
route: /design/
title: Design
summary: Architecture of the toolchain - principles, components, interfaces and flows - from design.yaml. Read this before changing yss/.
nav: {label: Design, order: 20, group: content}
docs: [design]
sections:
  - id: overview
    type: markdown
    heading: Overview
    from: design.overview

  - id: subjects
    type: prefab
    heading: Principles, components and constraints
    intro: |
      One section per subject, not per type. The four headings and paragraphs are the `groups:`
      declared in design.yaml itself, and each holds everything that belongs to that subject: the
      principles it is built on, the components that implement it, and the constraints it has to
      live within. That is the point - a reader asking "how does presentation work?" gets one
      answer instead of three passes over the same page.

      The binding reads `design.$items`, the whole doc's items at once, so `group_by: group` can
      span type arrays; every item carries `_type`, which is both the filter above and the small
      grey word above each card title.
    prefab: group-sections
    args:
      groups:
        from: design.$items
        where: {_type: [principles, components, constraints]}
        group_by: group
        map:
          kicker: "{% if _type == 'principles' %}principle{% elif _type == 'components' %}component{% else %}constraint{% endif %}"
          # A constraint's whole `text` is its title, and some of it is literal angle brackets
          # (`/<repo>/`). `card` escapes the title itself, so this template must not escape it
          # first - the other map values below either name safe fields or land in a markdown slot.
          title: "{% autoescape false %}{{ name or title or text }}{% endautoescape %}"
          badge: "{{ kind or status or source or '' }}"
          body: "{{ rationale or responsibility or '' }}"
          subtitle: "{{ 'depends on ' ~ (depends_on | join(', ')) if depends_on else '' }}"
          meta: "{{ (code or []) | join(' · ') }}"
      item_args: {columns: 2}

  - id: interfaces
    type: prefab
    heading: Interfaces
    prefab: table
    args:
      rows: {from: design.interfaces}
      columns:
        - {key: name, label: Interface}
        - {key: kind, label: Kind}
        - {key: signature, label: Signature}
        - {key: description, label: Description, md: true}

  - id: flows
    type: prefab
    heading: Flows
    prefab: steps
    args:
      flows: {from: design.flows}

  - id: alternatives
    type: prefab
    heading: Alternatives considered
    prefab: table
    args:
      rows: {from: design.alternatives}
      columns:
        - {key: option, label: Option}
        - {key: rejected_because, label: Rejected because, md: true}
