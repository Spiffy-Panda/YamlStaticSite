# Page - schema: page. Presents docs/decisions.yaml.
id: decisions
route: /decisions/
title: Decisions
summary: The decision log, newest last. Each entry is an anchor (for example #adr-004) so other pages can cite it.
nav: {label: Decisions, order: 40}
docs: [decisions]
sections:
  - id: intro
    type: markdown
    markdown: |
      Accepted decisions are not edited; a change is a new entry that names what it supersedes.
      Agents append to `docs/decisions.yaml`.
  - id: log
    type: prefab
    prefab: decision-list
    args:
      entries: {from: decisions.entries, sort: date}
      collapsed: false
