# Page - schema: page. Presents docs/pending.yaml, applied 2026-09-02 and kept as the record.
id: pending
route: /pending/
title: Pending
summary: Applied 2026-09-02 and kept as the record. The live worksheet is on the Open page.
visibility: public          # worksheets stay on the public site (P.2, 2026-09-02)
nav: {label: Pending, order: 47}
docs: [pending, plan]
sections:
  - id: worksheet
    type: prefab
    prefab: worksheet
    args:
      title: {from: pending.title}
      intro: {from: pending.intro}
      warn: {from: pending.warn}
      questions: {from: pending.questions}
      prompt: {from: pending.prompt}
      decided_by: true
      extra: true

  - id: waiting
    type: prefab
    heading: Plan milestones as they stand now
    intro: What the milestones in [[plan]] look like after this worksheet was applied.
    prefab: table
    args:
      rows:
        from: plan.milestones
        map: {milestone: id}
      columns: [{key: milestone, label: Milestone}, {key: status, label: Status}, {key: title, label: Title}]

  - id: previous
    type: markdown
    heading: Other worksheets
    markdown: |
      - [[open]] - the live one; answer that instead.
      - [[verdicts]] - applied 2026-09-02; kept as the record.
