# Page - schema: page. Presents docs/plan.yaml.
id: plan
route: /plan/
title: Plan
summary: Goals, milestones and tasks for the toolchain, read straight from plan.yaml. For anyone deciding what to work on next.
nav: {label: Plan, order: 10, group: content}
docs: [plan]
sections:
  - id: goals
    type: prefab
    heading: Goals
    prefab: bullet-list
    args:
      items: {from: plan.goals}

  - id: non-goals
    type: prefab
    heading: Non-goals
    intro: Things deliberately out of scope, so nobody re-litigates them by accident.
    prefab: bullet-list
    args:
      items: {from: plan.non_goals}

  - id: board
    type: prefab
    heading: Milestone board
    intro: |
      One column per status. Cards link to the detailed task list below. The owner line names
      whoever still has an unfinished task in that milestone - a milestone has no owner of its own,
      it is owned by whoever its open work belongs to.
    prefab: status-board
    args:
      groups:
        from: plan.milestones
        sort: priority
        # `id` is remapped last, and deliberately: the board and the task list below present the
        # same milestones, so both cards would otherwise claim the anchor `m7-hardening` and a
        # `[[plan#m7-hardening]]` link would land on whichever the browser met first (gh-12).
        # The detail entry keeps the plain id; the board card gets a `board-` one. `href` is
        # computed before this line and so still points at the detail entry.
        map:
          badge: status
          body: summary
          href: "#{{ id }}"
          meta: "{% set who = (tasks or []) | selectattr('owner') | rejectattr('status', 'equalto', 'done') | map(attribute='owner') | unique | list %}{{ 'P' ~ priority if priority else '' }}{{ ' · target ' ~ target_date if target_date else '' }}{{ ' · @' ~ who | join(', @') if who else '' }}"
          id: "board-{{ id }}"
        group_by: status
      order: [active, blocked, planned, done, dropped]

  - id: tasks
    type: prefab
    heading: Milestones and tasks
    intro: Active and blocked milestones are expanded. Each task shows how to verify it.
    prefab: task-list
    args:
      milestones: {from: plan.milestones, sort: [status, priority]}
      show_verify: true

  - id: risks
    type: prefab
    heading: Risks
    prefab: table
    args:
      rows: {from: plan.risks}
      columns:
        - {key: title, label: Risk, md: true}
        - {key: likelihood, label: Likelihood}
        - {key: impact, label: Impact}
        - {key: mitigation, label: Mitigation, md: true}
        - {key: status, label: Status}
      empty: No risks recorded.

  - id: questions
    type: prefab
    heading: Open questions
    intro: "Answer these in `plan.yaml` (set `status: answered` and fill `answer`); do not answer them in chat only."
    prefab: table
    args:
      rows: {from: plan.open_questions, where: {status: open}}
      columns:
        - {key: question, label: Question, md: true}
        - {key: context, label: Context, md: true}
        - {key: owner, label: Owner}
      empty: No open questions.

  - id: answered
    type: prefab
    heading: Answered questions
    intro: |
      Questions that have been decided, kept on the page because the worksheets that decided them
      link straight to these rows. A reference into a question that this page filtered away renders
      as a dead link, which the build now reports (see [[decisions#adr-023]]).
    prefab: table
    args:
      rows: {from: plan.open_questions, where: {status: {not: open}}, sort: id}
      columns:
        - {key: question, label: Question, md: true}
        - {key: answer, label: Answer, md: true}
        - {key: status, label: Status}
      empty: Nothing has been answered yet.
