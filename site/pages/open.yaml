# Page - schema: page. Presents docs/open.yaml, applied 2026-09-02 and kept as the record.
id: open
route: /open/
title: Open decisions (record)
summary: A worksheet that has been applied, kept as the record of what was asked and what it turned into. Nothing here is still to answer; the live worksheet is Next.
visibility: public          # worksheets stay on the public site (P.2, 2026-09-02)
nav: {label: Open (record), order: 45}
docs: [open, plan]
sections:
  - id: worksheet
    type: prefab
    prefab: worksheet
    args:
      title: {from: open.title}
      intro: {from: open.intro}
      questions: {from: open.questions}
      prompt: {from: open.prompt}
      decided_by: true
      extra: true

  - id: waiting
    type: prefab
    heading: Plan questions still open
    intro: Every question in [[plan]] that nobody has answered yet. None of them belong to this worksheet - its own are all applied above; the live ones are on [[later]].
    prefab: table
    args:
      rows:
        from: plan.open_questions
        where: {status: open}
      columns:
        - {key: id, label: Id}
        - {key: question, label: Question, md: true}
        - {key: owner, label: Owner}
      empty: Every question in the plan has been answered.

  - id: previous
    type: markdown
    heading: Other worksheets
    markdown: |
      - [[later]] - the live one; answer that instead.
      - [[next]] - applied 2026-09-03; the record.
      - [[pending]] - applied 2026-09-02; the record.
      - [[verdicts]] - applied 2026-09-02; the record.
