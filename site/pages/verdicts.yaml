# Page - schema: page. Presents docs/verdicts.yaml as a worksheet.
id: verdicts
route: /verdicts/
title: Pilot verdicts (record)
summary: A worksheet that has been applied, kept as the record of what was asked and what it turned into. Nothing here is still to answer; the live worksheet is Next.
visibility: public          # worksheets stay on the public site (P.2, 2026-09-02)
nav: {label: Verdicts (record), order: 48}
docs: [verdicts, plan]
sections:
  - id: worksheet
    type: prefab
    prefab: worksheet
    args:
      title: {from: verdicts.title}
      intro: {from: verdicts.intro}
      warn: {from: verdicts.warn}
      questions: {from: verdicts.questions}
      prompt: {from: verdicts.prompt}
      decided_by: true
      extra: true

  - id: questions
    type: prefab
    heading: Open questions on record
    intro: The same questions as they stand in [[plan]]. They were flipped to answered when this worksheet was applied; what each verdict turned into is written under it above.
    prefab: table
    args:
      rows: {from: plan.open_questions}
      columns:
        - {key: id, label: Id}
        - {key: question, label: Question, md: true}
        - {key: options, label: Options}
        - {key: status, label: Status}
