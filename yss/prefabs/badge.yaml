name: badge
description: Small status pill. The colour tone is derived from the text (done, active, blocked, planned, dropped, ...) unless `tone` is given.
category: badge
params:
  text: {type: string, required: true, description: "Badge text, usually a status value."}
  tone: {type: string, description: "Override the derived tone: ok, warn, bad, muted, accent."}
template: |
  <span class="badge {% if tone %}tone-{{ tone }}{% else %}tone-{{ text | slug }}{% endif %}">{{ text }}</span>
css: |
  .badge { display: inline-block; font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    padding: .1rem .55rem; border-radius: 999px; border: 1px solid var(--tone, var(--line)); color: var(--tone, var(--fg-2));
    white-space: nowrap; line-height: 1.5; vertical-align: middle; }
  .tone-ok { --tone: var(--ok); } .tone-warn { --tone: var(--warn); } .tone-bad { --tone: var(--bad); }
  .tone-muted { --tone: var(--muted); } .tone-accent { --tone: var(--accent); }
examples:
  - args: {text: active}
  - args: {text: "needs review", tone: warn}
