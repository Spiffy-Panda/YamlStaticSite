name: card
description: A single card - title, optional badge, subtitle, markdown body, meta lines and tags. Feed it from a list with `map` to rename doc fields onto these params.
category: item
params:
  title: {type: string, required: true}
  subtitle: {type: string}
  body: {type: markdown, description: Markdown body text.}
  badge: {type: string, description: Status text; also sets the card's tone.}
  href: {type: string, description: Makes the title a link.}
  meta: {type: any, description: "A string, or a list of strings / {label, value} mappings, shown as small lines under the body."}
  tags: {type: list}
  id: {type: string, description: Anchor id so other pages can link to this card.}
template: |
  <article class="card {% if badge %}tone-{{ badge | slug }}{% endif %}"{% if id %} id="{{ id }}"{% endif %}>
    <div class="card-head">
      <h3 class="card-title">{% if href %}<a href="{{ href }}">{{ title }}</a>{% else %}{{ title }}{% endif %}</h3>
      {% if badge %}{{ prefab('badge', text=badge) }}{% endif %}
    </div>
    {% if subtitle %}<div class="card-subtitle">{{ subtitle }}</div>{% endif %}
    {% if body %}<div class="card-body prose">{{ body | md }}</div>{% endif %}
    {% if meta %}
    <ul class="card-meta">
      {% if meta is string %}<li>{{ meta }}</li>{% else %}
      {% for m in meta %}{% if m %}<li>{% if m is mapping %}<span class="meta-label">{{ m.label }}</span> {{ m.value }}{% else %}{{ m }}{% endif %}</li>{% endif %}{% endfor %}
      {% endif %}
    </ul>
    {% endif %}
    {% if tags %}{{ prefab('tag-list', tags=tags) }}{% endif %}
  </article>
css: |
  .card { background: var(--bg-2); border: 1px solid var(--line); border-left: 4px solid var(--tone, var(--line)); border-radius: var(--radius);
    padding: .8rem 1rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
  .card-title { margin: 0; font-size: 1.05rem; line-height: 1.3; }
  .card-title a { text-decoration: none; }
  .card-subtitle { color: var(--fg-2); font-size: .9rem; }
  .card-body { font-size: .93rem; }
  .card-body p { margin: .25rem 0; }
  .card-meta { list-style: none; margin: 0; padding: 0; font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: .25rem .9rem; }
  .meta-label { font-weight: 600; }
examples:
  - args: {title: Build pipeline, badge: active, body: "Validates, renders and **scans** the output.", meta: [{label: owner, value: agent}], tags: [python]}
