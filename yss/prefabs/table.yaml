name: table
description: Table from a list of mappings. Columns default to the keys of the first row; give `columns` to pick and label them. Lists are joined with commas; short status-like strings get a tone.
category: data
params:
  rows: {type: list, required: true}
  columns: {type: list, description: "Strings (keys) or {key, label, md: true} mappings."}
  empty: {type: string, default: No rows.}
  caption: {type: string}
template: |
  {% macro cell(v, md) %}
    {%- if v is none or v is undefined %}{% elif v is string %}{% if md %}{{ v | md_inline }}{% else %}{{ v }}{% endif %}
    {%- elif v is mapping %}<code>{{ v | tojson }}</code>
    {%- elif v is sequence %}{{ v | join(', ') }}
    {%- else %}{{ v }}{% endif -%}
  {% endmacro %}
  {% if rows %}
  {% set cols = [] %}
  {% for c in (columns or rows[0].keys()) %}{% set _ = cols.append(c if c is mapping else {'key': c, 'label': c}) %}{% endfor %}
  <table class="table prefab-table">
    {% if caption %}<caption>{{ caption }}</caption>{% endif %}
    <thead><tr>{% for c in cols %}<th>{{ c.label or c.key }}</th>{% endfor %}</tr></thead>
    <tbody>
    {% for row in rows %}
      <tr>
      {% for c in cols %}
        {% set v = row.get(c.key) if row is mapping else row %}
        <td class="{% if v is string and v | length < 16 %}tone-{{ v | slug }} cell-tone{% endif %}">{{ cell(v, c.md) }}</td>
      {% endfor %}
      </tr>
    {% endfor %}
    </tbody>
  </table>
  {% else %}<p class="empty">{{ empty }}</p>{% endif %}
css: |
  .prefab-table caption { text-align: left; color: var(--fg-2); font-size: .85rem; padding-bottom: .3rem; }
  .prefab-table td.cell-tone { color: var(--tone, inherit); font-weight: 500; }
examples:
  - args:
      rows: [{id: r1, title: "Leak of **private** data", likelihood: high, status: open}, {id: r2, title: Schema churn, likelihood: medium, status: mitigated}]
      columns: [id, {key: title, label: Risk, md: true}, likelihood, status]
