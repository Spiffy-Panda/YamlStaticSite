$schema: https://json-schema.org/draft/2020-12/schema
$id: yss:doc.envelope
title: Structured document envelope
description: |
  Fields shared by every structured doc under docs/. The `kind` field selects the body schema
  (doc.<kind>.schema.yaml); the body schema is merged with this envelope at load time, so unknown
  top-level keys are rejected unless they start with "x-".
  Annotations: `x-vocab` enums and `x-limit` lengths come from site.yaml / collection.yaml
  (vocabularies, limits); `x-ref` fields must point at existing ids; `x-evidence` fields are
  checked by `yss check`. Any object may carry `evidence:` claims.
  Visibility rules: any object (doc, list item, nested mapping) with `visibility: private` is removed
  from public builds; any `private_notes` key is stripped from public builds. `doc.worksheet` adds a
  third, derived value - `visibility: on_resolution`, private while the sheet is still asking and a
  redacted projection of itself once answered (gh-37); it is declared there, not here, because it is
  meaningless on a doc with no questions and on a single list item.
type: object
required: [kind, title]
properties:
  kind:
    type: string
    description: Document kind; selects the body schema (plan, design, codemap, decisions, glossary, changelog, generic, or a project-defined kind).
  id:
    $ref: "#/$defs/slug"
    description: Stable id used in page bindings (`<id>.<field>`). Defaults to the file stem; collections prefix it with `<collection>/`.
  mnemonic:
    oneOf:
      - {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"}
      - type: array
        minItems: 1
        items: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"}
    description: >-
      The handle series this doc participates in: `mnemonic: PLN` makes its items citable as `PLN.7`
      from anywhere, including files yss does not read. Any short slug; `.` and `/` are excluded
      because they are already the handle and doc-id separators.

      One value or a list, and **a series belongs to the site rather than to a doc** (adr-053): a doc
      may declare several, and two docs may declare the same one. The invariant that carries the
      weight is that a *handle* is unique across the site. A declaration buys two things only - a
      scope for the in-scope reference form, which is the **first** mnemonic listed, and a prefix the
      mention sweep will trust. Declaring one mints nothing on its own; each item still declares its
      own `handle`, and a handle whose prefix no doc anywhere declares is an error.
  title:
    type: string
    x-limit: title
  summary:
    type: string
    x-limit: summary
    description: One paragraph of plain text. Shown in doc indexes and page headers.
  visibility:
    type: string
    enum: [public, private, on_resolution]
    default: public
    description: >-
      `public` and `private` are authored and read literally. `on_resolution` is derived and legal
      only on a `doc.worksheet` (gh-37), where the sheet is private while it is still asking and
      publishes a redacted projection of itself once answered; `yss validate` rejects it on any
      other kind, and a build treats it as private there rather than trusting it. It is spelled out
      here rather than widening `$defs/visibility` because per-item visibility stays two-valued: a
      half-published sheet has holes in its numbering and links pointing at questions the public
      reader cannot see.
  status:
    type: string
    x-vocab: lifecycle
    description: "Lifecycle only (active, stable, deprecated, archived by default). Whether a doc is current is an evidence result, not a status."
  owners:
    type: array
    items: {type: string}
    description: Handles or role names, not legal names.
  updated:
    type: string
    format: date
    description: ISO date (YYYY-MM-DD) of the last meaningful edit. Git recency compares cited code against it.
  tags:
    type: array
    items: {type: string}
  links:
    type: array
    items: {$ref: "#/$defs/link"}
  related:
    type: array
    items: {$ref: "#/$defs/slug"}
    x-ref: doc
    description: Ids of related docs (validated to exist; collection-local ids allowed).
  evidence:
    type: array
    items: {$ref: "#/$defs/evidence_item"}
    description: Claims that prove this doc still matches the repo; checked by `yss check`.
  private_notes:
    description: Free-form notes stripped from public builds (string, list or mapping).
    type: [string, object, array]
  agent_notes:
    type: string
    x-limit: markdown
    description: Guidance for agents editing this doc (conventions, what not to touch, how to verify).
  groups:
    type: array
    items: {$ref: "#/$defs/group"}
    description: |
      Optional *subject* axis for this doc, orthogonal to the type arrays. A doc's items are grouped
      by schema type (principles, components, constraints, milestones, risks...), which is rarely the
      axis a reader navigates by. Declare subjects here once - each with the heading and the
      paragraph that introduce it - and let items opt in with `group: <id>`. A page binding with
      `group_by: group` then gets the whole authored group on every bucket, not a bare key, so one
      heading and one blurb written here reach every page that groups by them. Declaration order is
      display order. Groups are ordinary list items: their ids are indexed, so `[[doc#group-id]]`
      links to them and `visibility: private` hides one from public builds.
patternProperties:
  "^x-": {}
$defs:
  slug:
    type: string
    pattern: "^[a-z0-9][a-z0-9_.\\-/]*$"
  visibility:
    type: string
    enum: [public, private]
    default: public
    description: >-
      Authored and read literally: `private` removes this object from public builds. A doc kind may
      widen this for itself - `doc.worksheet` adds the derived `on_resolution` (gh-37) - but the
      per-item value stays two-valued everywhere.
  link:
    type: object
    required: [href]
    properties:
      label: {type: string}
      href: {type: string}
      kind: {type: string, x-vocab: link_kind, description: "One shared link vocabulary with the collection card contract (adr-020); `play` is a prototype link."}
    additionalProperties: false
  evidence_item:
    description: |
      One checkable claim. Exactly one of path, glob, symbol, command.

      A `path` claim reads in one of four ways, most specific first: `at` (parse the file as YAML
      and judge the values at that anchor), `not_contains` (the negative substring test),
      `contains` (the positive one), or bare existence. Prefer `at` over `contains` whenever the
      target is YAML and the claim is about a *value*: a whole-file substring test cannot tell an
      item's `status: open` apart from the document's own top-level `status:`, which is how a
      claim written to track a defect passed while the defect was still open (gh-32).
    type: object
    properties:
      path: {type: string, description: "Repo-relative file or folder (globs allowed); also tried relative to the collection root."}
      contains: {type: string, description: "With path: text the file must contain."}
      not_contains: {type: string, description: "With path: text every matched file must NOT contain. Proves a removal - a dropped flag, a deleted workaround - which no positive claim can."}
      at: {type: string, description: "With path (a YAML file): an anchor into the parsed document. Grammar is `key`, `key.key`, `key[i]` and `key[*]`, e.g. `components[*].status`. The values it resolves to are judged by `equals`, `in` or `absent`; with none of those the claim just asserts the anchor resolves to something."}
      equals: {type: [string, number, boolean], description: "With at: every value at the anchor must equal this."}
      in: {type: array, description: "With at: every value at the anchor must be one of these."}
      absent: {type: boolean, description: "With at: the anchor must resolve to no values at all."}
      glob: {type: string, description: "Glob pattern that must match at least `min` files."}
      min: {type: integer, minimum: 0, default: 1}
      symbol: {type: string, description: "module:attribute that must import, e.g. yss.build:build"}
      command: {type: string, description: "Shell command; run only with `yss check --run-commands`."}
      expect: {type: integer, default: 0, description: "Expected exit code for command."}
      timeout: {type: integer}
      note: {type: string, x-limit: line}
    oneOf:
      - {required: [path]}
      - {required: [glob]}
      - {required: [symbol]}
      - {required: [command]}
    dependentRequired:
      at: [path]
      not_contains: [path]
      contains: [path]
      equals: [at]
      in: [at]
      absent: [at]
    additionalProperties: false
  group:
    description: |
      One authored subject group: the heading a reader navigates by and the prose that says what the
      items under it are collectively about. Facts about the grouping live here, in the doc, not in a
      page, so the doc stays self-describing and two pages presenting it cannot disagree.
    type: object
    allOf: [{$ref: "#/$defs/item_base"}]
    required: [id, title]
    properties:
      id: {$ref: "#/$defs/slug"}
      title: {type: string, x-limit: title, description: The heading shown above the group's items.}
      blurb:
        type: string
        x-limit: markdown
        description: Markdown. One paragraph telling a reader what the items in this group are collectively about.
    unevaluatedProperties: false
  option:
    description: |
      One alternative an item is open between. An item at `status: open` is by definition a decision
      not yet made, and the alternatives are the most useful thing about it; with nowhere to put
      them they degrade to prose, which no page can table, count or link. `doc.design`'s
      `alternatives[]` is the closed case - it requires `rejected_because` and is not attached to
      any item.

      An option may carry its own `evidence:` (gh-35), which is how "we already tried this" or
      "this file does not exist yet" becomes a checked claim instead of an assertion. Claims found
      here are collected under the *enclosing item's* id, pointing at the option that made them.

      Narrowed from `doc.worksheet`'s
      `questions[].options[]` rather than invented separately, so the two shapes stay recognisable
      as the same thing (gh-27). Dropped from the worksheet's version: `value`, which exists for
      form submission, and `recommended`/`prompt`, which exist to steer a human towards an answer -
      a design item is *documenting* a live choice, not asking for one.

      Deliberately not on `item_base`. `doc.plan`'s `open_questions[].options` is an array of
      strings and `doc.worksheet`'s is an object requiring `value`; a JSON Schema `allOf` composes
      by intersection, so an `item_base` declaration would apply to those too and fail every
      worksheet and every plan question in the repository. This is the same trap the note on
      `status` describes. A kind that wants this shape references it here.
    type: object
    required: [text]
    properties:
      text: {type: string, x-limit: line, description: "The alternative itself, stated as a choice somebody could take."}
      why: {type: string, x-limit: summary, description: "What choosing this lets you say, or costs you."}
      pros: {type: array, items: {type: string, x-limit: line}}
      cons: {type: array, items: {type: string, x-limit: line}}
      evidence: {type: array, items: {$ref: "#/$defs/evidence_item"}, description: "Claims `yss check` proves about this alternative; reported under the enclosing item's id (gh-35)."}
      notes: {type: string, x-limit: markdown, description: Markdown notes about this alternative shown to humans.}
    additionalProperties: false
  item_base:
    description: Fields any list item may carry in addition to its own.
    type: object
    properties:
      visibility: {$ref: "#/$defs/visibility"}
      private_notes: {type: [string, object, array]}
      tags: {type: array, items: {type: string}}
      links: {type: array, items: {$ref: "#/$defs/link"}}
      notes: {type: string, x-limit: markdown, description: Markdown notes shown to humans.}
      evidence: {type: array, items: {$ref: "#/$defs/evidence_item"}}
      handle:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*\.[A-Za-z]{0,3}(0|[1-9][0-9]*)$'
        description: >-
          This item's persistent handle, `<the doc's mnemonic>.<n>` - or `<mnemonic>.<tag><n>`,
          where an optional run of up to three letters splits one mnemonic into sub-series, so a doc
          whose items are questions and decisions writes `VFB.Q5` and `VFB.D4` rather than claiming
          two mnemonics. Ordinals count within a *series*, so `VFB.D4` leaves no gap at 4 in
          `VFB.Q`. It is a second key on the same index
          the item's `id` is in, so `[[PLN.7]]` and `[[plan#m14-audit]]` resolve to the same item and
          `[[.7]]` is the in-scope form. Declared, never derived: a handle computed from list
          position breaks the first time a list is sorted, and one read out of a slug is a
          coincidence. Append-only - never renumbered, never reused, and struck in place rather than
          rewritten when it is retired. A handle's ordinal identifies the item and says nothing about
          when it was written, because a backfilled series was numbered in file order.
      group:
        $ref: "#/$defs/slug"
        x-ref: item
        description: >-
          Id of an entry in this doc's `groups:` - the subject this item belongs to. Optional and
          safe to add to any kind: it is a free slug validated as an ordinary item reference, so a
          typo fails validation, and unlike `status` it carries no vocabulary that a kind-specific
          declaration could intersect with (see the note on `status` below). Items with no `group`
          are unaffected, and a doc with no `groups:` behaves exactly as it did before.
      status:
        type: string
        description: >-
          Generic per-item status for kinds that don't already define their own status vocabulary
          (e.g. design components, principles, constraints, interfaces, flows, alternatives use the
          `claim_status` vocabulary: live, decided, open, superseded). Left unconstrained here on
          purpose: a JSON Schema `allOf` composes by intersection, so giving this field its own `enum`
          would also apply to items that already carry a kind-specific status (plan milestones/tasks:
          work_status; risks: risk_status; questions: question_status; codemap modules: work_status;
          decision entries: record_status) and make their existing values fail. Kinds
          that want enum-checked values declare `status` themselves with the vocabulary that fits.
