$schema: https://json-schema.org/draft/2020-12/schema
$id: yss:doc.decisions
title: Decision log
description: |
  Architecture decision records. Append new entries; never rewrite an accepted one, supersede it.
  Status comes from the `record_status` vocabulary (proposed, accepted, rejected, superseded).
type: object
required: [kind, title, entries]
additionalProperties: false
properties:
  kind: {const: decisions}
  entries:
    type: array
    items:
      type: object
      allOf: [{$ref: "#/$defs/item_base"}]
      required: [id, title, status, decision]
      properties:
        id: {$ref: "#/$defs/slug"}
        date: {type: string, format: date}
        title: {type: string, x-limit: title}
        status: {type: string, x-vocab: record_status}
        context: {type: string, x-limit: markdown, description: Markdown. The forces at play.}
        decision: {type: string, x-limit: markdown, description: Markdown. What was decided.}
        consequences: {type: array, items: {type: string, x-limit: line}}
        alternatives: {type: array, items: {type: string, x-limit: line}}
        supersedes: {$ref: "#/$defs/slug", x-ref: item}
        superseded_by: {$ref: "#/$defs/slug", x-ref: item}
      unevaluatedProperties: false
