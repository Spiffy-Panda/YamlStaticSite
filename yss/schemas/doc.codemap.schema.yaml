$schema: https://json-schema.org/draft/2020-12/schema
$id: yss:doc.codemap
title: Code map document
description: |
  Where things live: roots, modules with exports and dependencies, entry points and conventions.
  Paths are repo-relative and are evidence: `yss check` fails when a cited path is gone.
type: object
required: [kind, title, modules]
additionalProperties: false
properties:
  kind: {const: codemap}
  roots:
    type: array
    items:
      type: object
      allOf: [{$ref: "#/$defs/item_base"}]
      required: [path, purpose]
      properties:
        path: {type: string, x-evidence: path}
        purpose: {type: string, x-limit: line}
      unevaluatedProperties: false
  modules:
    type: array
    items:
      type: object
      allOf: [{$ref: "#/$defs/item_base"}]
      required: [id, path, purpose]
      properties:
        id: {$ref: "#/$defs/slug"}
        path: {type: string, x-evidence: path}
        purpose: {type: string, x-limit: summary}
        language: {type: string}
        status: {type: string, x-vocab: work_status}
        exports:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: {type: string}
              kind: {type: string, enum: [function, class, command, constant, type, template, schema]}
              signature: {type: string}
              description: {type: string, x-limit: line}
            additionalProperties: false
        depends_on: {type: array, items: {$ref: "#/$defs/slug"}, x-ref: item}
        tests: {type: array, items: {type: string}, x-evidence: path}
      unevaluatedProperties: false
  entrypoints:
    type: array
    items:
      type: object
      allOf: [{$ref: "#/$defs/item_base"}]
      required: [id, command]
      properties:
        id: {$ref: "#/$defs/slug"}
        name: {type: string, x-limit: title}
        command: {type: string}
        module: {$ref: "#/$defs/slug", x-ref: item}
        description: {type: string, x-limit: line}
      unevaluatedProperties: false
  conventions:
    type: array
    items:
      type: object
      allOf: [{$ref: "#/$defs/item_base"}]
      required: [id, rule]
      properties:
        id: {$ref: "#/$defs/slug"}
        rule: {type: string, x-limit: summary}
        rationale: {type: string, x-limit: summary}
      unevaluatedProperties: false
