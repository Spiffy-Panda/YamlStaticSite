$schema: https://json-schema.org/draft/2020-12/schema
$id: yss:site
title: Site configuration (site.yaml)
description: |
  Root configuration. Every key is optional; defaults live in yss/config.py. Targets are named
  builds; `public` is redacted and served under base_url, `private` keeps everything.
  Vocabularies and limits are data that schema annotations (x-vocab, x-limit) resolve against.
type: object
additionalProperties: false
properties:
  site:
    type: object
    properties:
      name: {type: string}
      description: {type: string}
      repo: {type: string, description: Public repository URL (shown in the footer).}
    additionalProperties: false
  theme:
    type: object
    description: Site-wide presentation. A theme package is adopted by listing its stylesheet here, not by replacing the base one.
    properties:
      css:
        type: array
        items: {type: string}
        description: Stylesheets under the site's assets/, linked after the base stylesheet on every page. Use them to override custom properties.
    additionalProperties: false
  paths:
    type: object
    properties:
      docs: {type: string}
      pages: {type: string}
      prefabs: {type: string}
      layouts: {type: string}
      assets: {type: string}
      schemas: {type: string}
      out: {type: string}
    additionalProperties: false
  collections:
    type: array
    description: "Folder globs holding isolated doc sets, e.g. [{root: musings/*}]. Each match becomes a collection named after its folder."
    items:
      oneOf:
        - {type: string}
        - type: object
          required: [root]
          properties:
            root: {type: string, description: Folder or glob relative to the site root.}
            docs: {type: string, default: docs}
            pages: {type: string, default: pages}
            prefabs: {type: string, default: prefabs}
            schemas: {type: string, default: schemas}
            assets: {type: string, default: assets}
            config: {type: string, default: collection.yaml}
            hooks: {type: string, default: hooks.py}
            at:
              type: string
              default: ""
              description: |
                URL prefix every collection this glob matches routes under, e.g. "musings/" ->
                /musings/<id>/ instead of /<id>/. Empty (default) leaves routing unchanged. Set on
                the glob group (not per collection) so a repo with several sibling collections
                namespaces all of them in one place.
          additionalProperties: false
  targets:
    type: object
    additionalProperties:
      type: object
      properties:
        base_url: {type: string, description: "URL prefix, e.g. /RepoName/ for GitHub project pages."}
        redact: {type: boolean, description: Fail the build if forbidden strings appear in the output.}
        description: {type: string}
      additionalProperties: false
  nav:
    type: object
    description: |
      The top bar (adr-022). Without this key the defaults in yss/config.py apply. Note that this
      schema shipped without it, so `nav:` in site.yaml was rejected outright until gh-18 - adr-022
      documented a knob nobody could turn.
    properties:
      groups:
        type: array
        description: |
          Ordered nav groups. A page joins one by declaring `nav.group`; a page naming a group that
          is not listed falls into the first one. `collections` is a reserved id whose members are
          the site's collections, not pages (gh-18) - list it to label, reorder or fold away the
          collection pills, omit it and they are appended after the page groups as before. A page
          declaring `nav.group: collections` falls back to the first page group.
        items:
          type: object
          required: [id]
          properties:
            id: {type: string, description: "Group id: a value pages use in `nav.group`, or the reserved `collections`."}
            label: {type: string, description: What a reader sees. Empty means the group needs no heading.}
            menu: {type: boolean, description: "true puts the group behind a disclosure instead of spelling every item out."}
          additionalProperties: false
    additionalProperties: false
  vocabularies:
    type: object
    additionalProperties: {type: array, items: {type: string}}
    description: "Status vocabularies by name (lifecycle, work_status, record_status, risk_status, question_status, release_status, or your own)."
  limits:
    type: object
    additionalProperties: {type: integer}
    description: "Max lengths by name: title, summary, line, markdown (characters). 0 disables a limit."
  build:
    type: object
    description: Defaults for `yss build`. CLI flags override these; --strict / --no-strict override `strict`.
    properties:
      strict:
        type: boolean
        description: Fail the build on flagged strings and stale evidence. Default false; the CI public build sets it here rather than on the command line.
      attribution:
        type: boolean
        default: false
        description: >-
          Say where each rendered region came from (gh-29). Off by default. When on, every section
          carries a `title=""` naming the query that filled it, and a "show sources" toggle in the
          footer reveals the same sentence as a printed caption. The doc and its file are named on
          both targets; the filter half - where, sort, limit, group_by - is private-only, because a
          `where:` clause is authored in page YAML and one naming a person has never reached dist/.
    additionalProperties: false
  evidence:
    type: object
    description: Defaults for `yss check` and the build's evidence pass. A collection.yaml `evidence` block overrides these for its own docs; CLI flags override both.
    properties:
      git_recency: {type: boolean, description: Warn when cited code changed after a doc's `updated` date.}
      run_commands: {type: boolean, description: Run command evidence during `yss check` by default.}
      import_symbols: {type: boolean, default: true, description: "Let a `symbol:` claim the parser cannot resolve fall back to importing its module, which runs module-level code (adr-036). Off makes symbol evidence read-only: unresolvable claims report `skipped`."}
    additionalProperties: false
  markdown:
    type: object
    properties:
      renderer: {type: [string, "null"], description: "module:function(text) -> html to replace markdown-it-py site-wide."}
    additionalProperties: false
  hooks: {type: [string, "null"], description: Site-level hooks.py path (same contract as a collection's).}
  mounts:
    type: array
    items:
      type: object
      required: [path, at]
      properties:
        path: {type: string}
        at: {type: string}
        targets: {type: array, items: {type: string}}
        include:
          type: array
          items: {type: string}
          description: "Glob patterns relative to `path`; absent means every file (today's behaviour). `*.html` is top-level only, `**/*.html` is recursive."
        exclude:
          type: array
          items: {type: string}
          description: "Glob patterns removed after `include`; always wins over it. A trailing `/` drops a whole folder; `**` matches any depth."
      additionalProperties: false
  dynamic:
    type: object
    properties:
      sources:
        type: object
        additionalProperties:
          type: object
          properties:
            provider: {type: string, description: "module:function returning JSON-able data."}
            command: {type: string, description: Shell command printing JSON to stdout.}
            file: {type: string, description: Repo-relative JSON file to copy.}
            targets: {type: array, items: {type: string}}
            on_build: {type: boolean, default: true}
            timeout: {type: integer}
            ttl: {type: integer, description: Seconds before the private server re-collects on request.}
            description: {type: string}
          additionalProperties: true
    additionalProperties: false
  serve:
    type: object
    properties:
      host: {type: string}
      private_port: {type: integer}
      public_port: {type: integer}
      coop_coep: {type: boolean, description: Send COOP/COEP headers (needed by threaded wasm / Godot exports).}
      live_dynamic: {type: boolean}
      dynamic_ttl: {type: integer}
      watch: {type: array, items: {type: string}, description: Extra paths to watch for rebuilds.}
    additionalProperties: false
  redaction:
    type: object
    properties:
      local_file: {type: string}
      env_forbidden: {type: string}
      env_flag: {type: string}
      forbid_root_path: {type: boolean}
      scan_ignore:
        type: array
        items: {type: string}
        description: "Globs `yss scan` skips in the source tree, on top of .gitignore and the default skip list. Relative to the scanned root; `--ignore` adds more, `--no-gitignore` turns off the gitignore part. The public build's own output scan ignores nothing."
    additionalProperties: false
