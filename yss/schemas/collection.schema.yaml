$schema: https://json-schema.org/draft/2020-12/schema
$id: yss:collection
title: Collection configuration (collection.yaml)
description: |
  A collection is a folder with its own docs/, pages/, prefabs/, schemas/, assets/ and an optional
  hooks.py, discovered from `collections[].root` globs in site.yaml (e.g. musings/*). Doc ids are
  prefixed `<collection>/`, pages live under `/<collection>/`, and vocabularies, limits, dynamic
  sources and mounts can all be overridden here. Unique per-collection behaviour goes in hooks.py:
  configure(), load_docs(), load_pages(), markdown(), before_render(), after_build(), providers.
type: object
additionalProperties: false
properties:
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9_-]*$"
    description: |
      Overrides the folder name as this collection's id (and so its doc-id prefix and its last URL
      segment). Use it when a folder's name and its already-published URL slug have diverged - a
      case-only rename, or a folder renamed after the site was live. Must be unique across every
      collection (folder name or override); a clash fails the build naming both folders.
  title: {type: string, x-limit: title}
  summary: {type: string, x-limit: summary}
  emblem: {type: string, description: "Emoji or a path under the collection's assets/ (e.g. assets/emblem.svg)."}
  order: {type: integer}
  hero:
    type: boolean
    default: false
    description: Put this collection in the hero panel a parent page renders above the ordinary cards.
  links:
    type: array
    description: |
      The card contract - what a parent site shows for this collection besides emblem, title and
      summary. A relative href resolves under the collection's own route, so `pitch/` becomes
      /<collection>/pitch/ and `play/index.html` reaches its mount. A link into a mount that this
      target does not carry is dropped from the card rather than rendered as a dead one.
    items:
      type: object
      required: [label, href]
      properties:
        label: {type: string, x-limit: line}
        href:
          type: string
          x-evidence: route
          description: Relative to the collection route, or an absolute URL. A relative href must resolve to a real route (adr-021).
        kind:
          type: string
          x-vocab: link_kind
          default: page
          description: "The shared link vocabulary (adr-020); `play` renders as a prototype button, everything else as a text link."
      additionalProperties: false
  visibility: {type: string, enum: [public, private], default: public}
  status: {type: string, x-vocab: lifecycle}
  tags: {type: array, items: {type: string}}
  theme:
    type: object
    properties:
      css: {type: array, items: {type: string}, description: "Stylesheets under the collection's assets/, applied to every page in it."}
      accent:
        type: string
        pattern: '^(#[0-9A-Fa-f]{3,8}|[a-zA-Z]+|(rgb|rgba|hsl|hsla|oklch|oklab|lab|lch|color)\([^;{}()]*\))$'
        description: >-
          CSS colour for the --accent variable on this collection's pages. Emitted into the
          generated assets/collections.css as `.collection-<id> { --accent: ... }`, so it must be
          a colour value and nothing else - no semicolons, braces or trailing declarations (gh-24).
          A collection's own theme.css is linked after it and overrides it, media queries included.
      background:
        type: string
        pattern: '^(#[0-9A-Fa-f]{3,8}|[a-zA-Z]+|(rgb|rgba|hsl|hsla|oklch|oklab|lab|lch|color)\([^;{}()]*\))$'
        description: "CSS colour for the --bg variable on this collection's pages; same rules as `accent`."
    additionalProperties: false
  vocabularies:
    type: object
    additionalProperties: {type: array, items: {type: string}}
    description: Override or add status vocabularies for this collection only.
  limits:
    type: object
    additionalProperties: {type: integer}
  evidence:
    type: object
    description: Evidence policy for this collection's docs only; overrides site.yaml `evidence`. CLI flags override both.
    properties:
      git_recency: {type: boolean, description: Warn when cited code changed after a doc's `updated` date.}
      run_commands: {type: boolean, description: Run command evidence for this collection during `yss check`.}
    additionalProperties: false
  dynamic:
    type: object
    properties:
      sources:
        type: object
        additionalProperties:
          type: object
          properties:
            provider: {type: string, description: "module:function, or hooks:<name> for a provider defined in hooks.py"}
            command: {type: string}
            file: {type: string}
            targets: {type: array, items: {type: string}}
            on_build: {type: boolean}
            timeout: {type: integer}
            ttl: {type: integer}
            description: {type: string}
          additionalProperties: true
    additionalProperties: false
  mounts:
    type: array
    items:
      type: object
      required: [path, at]
      properties:
        path: {type: string, description: "Folder relative to the collection root (a built playable, exports, data)."}
        at: {type: string, description: "URL path under the collection, e.g. play/ -> /<collection>/play/"}
        targets: {type: array, items: {type: string}, description: "Defaults to [private]."}
        include:
          type: array
          items: {type: string}
          description: |
            Glob patterns, matched against each file's path relative to `path`. Absent (the
            default) means every file, matching today's whole-tree copy. `*.html` matches only the
            mount's top-level files; `**/*.html` matches recursively - the two are deliberately
            distinguishable. A file must match at least one pattern to be copied.
        exclude:
          type: array
          items: {type: string}
          description: |
            Glob patterns removed from whatever `include` selected (or from everything, when
            `include` is absent); exclude always wins over include. A pattern ending in `/` names a
            folder and drops it whole (`prototype/`, `_*/`); `**` matches any depth
            (`**/README.md` anywhere in the tree).
      additionalProperties: false
  agent_notes: {type: string}
patternProperties:
  "^x-": {}
