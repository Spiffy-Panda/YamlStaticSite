$schema: https://json-schema.org/draft/2020-12/schema
$id: yss:doc.design
title: Design document
description: |
  Architecture and design: overview, principles, components with interfaces, flows, constraints and
  rejected alternatives. The agent-first replacement for DESIGN.md / ARCHITECTURE.md.
  `components[].code` paths are evidence: `yss check` fails when they vanish.
type: object
required: [kind, title, components]
additionalProperties: false
properties:
  kind: {const: design}
  overview:
    type: string
    x-limit: markdown
    description: Markdown. The one-screen explanation a newcomer reads first.
  principles:
    type: array
    items:
      type: object
      allOf: [{$ref: "#/$defs/item_base"}]
      required: [id, title]
      properties:
        id: {$ref: "#/$defs/slug"}
        title: {type: string, x-limit: title}
        rationale: {type: string, x-limit: summary}
        status: {type: string, x-vocab: claim_status}
        options:
          type: array
          items: {$ref: "#/$defs/option"}
          description: >-
            The alternatives this item is open between. An item at `status: open` is by definition
            a decision not yet made, and the alternatives are the most useful thing about it; with
            nowhere to put them they degrade to prose, which no page can table, count or link.
            `alternatives[]` below is the closed case - it requires `rejected_because` and is not
            attached to any item.
      unevaluatedProperties: false
  components:
    type: array
    items:
      type: object
      allOf: [{$ref: "#/$defs/item_base"}]
      required: [id, name, responsibility]
      properties:
        id: {$ref: "#/$defs/slug"}
        name: {type: string, x-limit: title}
        kind: {type: string, enum: [module, service, schema, data, ui, process, external, library]}
        responsibility: {type: string, x-limit: line, description: One sentence. What it owns.}
        inputs: {type: array, items: {type: string}}
        outputs: {type: array, items: {type: string}}
        depends_on: {type: array, items: {$ref: "#/$defs/slug"}, x-ref: item}
        code: {type: array, items: {type: string}, x-evidence: path, description: Paths implementing this component (checked).}
        status: {type: string, x-vocab: claim_status}
        options:
          type: array
          items: {$ref: "#/$defs/option"}
          description: >-
            The alternatives this item is open between. An item at `status: open` is by definition
            a decision not yet made, and the alternatives are the most useful thing about it; with
            nowhere to put them they degrade to prose, which no page can table, count or link.
            `alternatives[]` below is the closed case - it requires `rejected_because` and is not
            attached to any item.
      unevaluatedProperties: false
  interfaces:
    type: array
    items:
      type: object
      allOf: [{$ref: "#/$defs/item_base"}]
      required: [id, name, kind]
      properties:
        id: {$ref: "#/$defs/slug"}
        name: {type: string, x-limit: title}
        kind: {type: string, enum: [cli, http, file, python, json, yaml, event]}
        signature: {type: string}
        description: {type: string, x-limit: summary}
        component: {$ref: "#/$defs/slug", x-ref: item}
        status: {type: string, x-vocab: claim_status}
        options:
          type: array
          items: {$ref: "#/$defs/option"}
          description: >-
            The alternatives this item is open between. An item at `status: open` is by definition
            a decision not yet made, and the alternatives are the most useful thing about it; with
            nowhere to put them they degrade to prose, which no page can table, count or link.
            `alternatives[]` below is the closed case - it requires `rejected_because` and is not
            attached to any item.
      unevaluatedProperties: false
  flows:
    type: array
    items:
      type: object
      allOf: [{$ref: "#/$defs/item_base"}]
      required: [id, title, steps]
      properties:
        id: {$ref: "#/$defs/slug"}
        title: {type: string, x-limit: title}
        trigger: {type: string, x-limit: line}
        steps:
          type: array
          items:
            type: object
            required: [action]
            properties:
              actor: {type: string}
              action: {type: string, x-limit: line}
              produces: {type: string, x-limit: line}
            additionalProperties: false
        status: {type: string, x-vocab: claim_status}
        options:
          type: array
          items: {$ref: "#/$defs/option"}
          description: >-
            The alternatives this item is open between. An item at `status: open` is by definition
            a decision not yet made, and the alternatives are the most useful thing about it; with
            nowhere to put them they degrade to prose, which no page can table, count or link.
            `alternatives[]` below is the closed case - it requires `rejected_because` and is not
            attached to any item.
      unevaluatedProperties: false
  constraints:
    type: array
    items:
      type: object
      allOf: [{$ref: "#/$defs/item_base"}]
      required: [id, text]
      properties:
        id: {$ref: "#/$defs/slug"}
        text: {type: string, x-limit: summary}
        source: {type: string, description: "Where the constraint comes from (platform, policy, user)."}
        status: {type: string, x-vocab: claim_status}
        options:
          type: array
          items: {$ref: "#/$defs/option"}
          description: >-
            The alternatives this item is open between. An item at `status: open` is by definition
            a decision not yet made, and the alternatives are the most useful thing about it; with
            nowhere to put them they degrade to prose, which no page can table, count or link.
            `alternatives[]` below is the closed case - it requires `rejected_because` and is not
            attached to any item.
      unevaluatedProperties: false
  alternatives:
    type: array
    items:
      type: object
      allOf: [{$ref: "#/$defs/item_base"}]
      required: [id, option, rejected_because]
      properties:
        id: {$ref: "#/$defs/slug"}
        option: {type: string, x-limit: line}
        rejected_because: {type: string, x-limit: summary}
        status: {type: string, x-vocab: claim_status}
        options:
          type: array
          items: {$ref: "#/$defs/option"}
          description: >-
            The alternatives this item is open between. An item at `status: open` is by definition
            a decision not yet made, and the alternatives are the most useful thing about it; with
            nowhere to put them they degrade to prose, which no page can table, count or link.
            `alternatives[]` below is the closed case - it requires `rejected_because` and is not
            attached to any item.
      unevaluatedProperties: false
