# yss site configuration for this repository (the toolchain piloting itself).
# Schema: yss/schemas/site.schema.yaml   Print it: python -m yss schema site --yaml
site:
  name: YamlStaticSite
  description: Agent-first structured docs, human-first static site. This site documents the toolchain that builds it.
  repo: https://github.com/Spiffy-Panda/YamlStaticSite

theme:
  css: [assets/theme-bamboo.css]     # the house palette; overrides tokens, never the base stylesheet

collections:
  - root: examples/*                  # each matching folder is a collection named after the folder

targets:
  public:
    base_url: /YamlStaticSite/        # GitHub project pages path; change if the repo is renamed
    redact: true                      # fail the build if forbidden strings leak into output
    description: Published to GitHub Pages.
  private:
    base_url: /
    redact: false
    description: Everything, including private sections and repo-local dynamic data.

build:
  strict: false                       # local builds warn; CI passes --strict for the public deploy (adr-014)

# limits and the status vocabularies use the yss defaults (python -m yss ls kinds); a collection.yaml
# can override any of them. link_kind is spelled out here because one list now serves both the doc
# envelope's `links` and a collection's card contract (adr-020).
vocabularies:
  link_kind: [repo, issue, pr, doc, page, play, external, file]

evidence:
  git_recency: true                   # warn when cited code changed after a doc's `updated` date
  run_commands: false                 # `yss check --run-commands` runs command claims on demand
                                      # a collection.yaml `evidence` block overrides both for its own docs

dynamic:
  sources:
    buildinfo:
      provider: yss.providers.buildinfo:collect
      description: Counts and versions from the last build.
    testruns:
      provider: yss.providers.testruns:collect
      tests_dir: tests
      targets: [private]              # test output stays local
      ttl: 60
      description: Unit test results (unittest discovery in tests/).
    gitlog:
      provider: yss.providers.gitlog:collect
      limit: 15
      targets: [private]              # author names are repo-local information
      ttl: 60
      description: Recent commits and working-tree state.
    evidence:
      provider: yss.providers.evidence:collect
      run_commands: true              # the Evidence page's private section runs command claims
      targets: [private]
      on_build: false                 # collected on request by the private server, not during build
      ttl: 120
      description: Evidence claims including command results.

serve:
  host: 127.0.0.1
  private_port: 8800
  public_port: 8801
  coop_coep: true                     # needed for threaded wasm / Godot exports in iframes
  live_dynamic: true
  dynamic_ttl: 30
  watch: [yss, examples]              # also rebuild when the toolchain or the demo collection changes

redaction:
  local_file: .yss/local.yaml         # gitignored; holds forbidden_strings / flag_strings
  forbid_root_path: true              # the absolute checkout path must never appear in output
