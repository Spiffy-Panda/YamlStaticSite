# Worksheet - schema: doc.worksheet. Applied 2026-09-03 and kept as the record; do not re-answer it.
# Agents: new questions go in docs/later.yaml, never here.
kind: worksheet
id: next
title: Next decisions
summary: The worksheet that archived the closed pilot milestone, merged the two link vocabularies into one, and made a card link to a collection page into checked evidence. Applied 2026-09-03; kept as the record.
status: archived
updated: 2026-09-03
owners: [agent]
related: [plan, decisions, open, later]
intro: |
  Applied on 2026-09-03. All three questions were answered by Panda and each one's outcome is
  written under it; the choices are kept in the foldouts so the rejected options stay readable.
  What it did: N.1 let an agent repoint the reference fields of an archived worksheet when their
  target is archived, which finally let the pilot milestone move to `docs/_archive/`; N.2 collapsed
  the doc envelope's link kinds and the collection card contract's link kinds into one `link_kind`
  vocabulary with `play` in it; N.3 made a relative card href checked evidence against the route
  table. The verdicts are [[decisions#adr-019]], [[decisions#adr-020]] and [[decisions#adr-021]].

  The live worksheet is now [[later]]; answer that one instead.

questions:
  - id: n-archive-pilot
    resolution:
      applied: 2026-09-03
      by: Panda
      chose: [allow-edit]
      recorded_in: [decisions/adr-019]
      summary: |
        Not the recommended option. Rather than teaching the checker to look away, an agent may now
        repoint `blocks` and `recorded_in` on an archived worksheet, and only when the item they
        name has itself been archived, leaving a dated reference note under the question. Every
        reference in every loaded doc therefore still resolves. `plan/m3-review` was dropped from
        P.9 on [[pending]] under that allowance, and `m3-pilot` moved to
        docs/_archive/plan-2026-09-done.yaml with its two tasks on the same day.
    call: N.1
    lead: The pilot milestone is done - may an agent edit archived worksheets to archive it?
    help: |
      m3-pilot closed on 2026-09-02 with both tasks done, and the rule says a done-and-committed
      milestone moves to `docs/_archive/`. It could not be moved: the archived worksheet
      [[pending]] still lists `plan/m3-review` under `blocks`, and that field is reference-checked,
      so removing the milestone fails validation. The instruction that closed it also forbade
      touching archived worksheets. [[codemap]] and two tests cite `plan#m3-pilot` as well, but
      those are easy to repoint.

      Since this was written, the three applied worksheets gained `resolution` blocks
      ([[decisions#adr-018]]) - an edit to archived worksheets, made on Panda's instruction, that
      adds what happened without changing what was asked. It does not answer this call: `blocks` is
      still reference-checked, and m3-pilot still cannot move.
    applies_to: "plan m3-pilot (archive move); docs/_archive/plan-2026-09-done.yaml; whichever rule you relax"
    compare: |
      Archived worksheets are a record of what was asked and answered, and their `blocks` lists are
      part of that record. Either the record is allowed to drift as the plan moves on, or the
      reference checker has to stop treating an archived worksheet's `blocks` as a live reference,
      or done milestones linger in the plan and the archive rule quietly stops meaning anything.
    options:
      - value: stop-checking
        text: Stop reference-checking `blocks` on archived worksheets
        recommended: true
        why: The record stays untouched and the plan can archive freely; a worksheet with status archived is history, not a live claim.
        prompt: "Skip x-ref validation of `blocks` on worksheets whose status is archived, then archive m3-pilot and repoint the codemap and test references."
        pros: [Archived worksheets are never edited, The archive rule keeps working, One narrow rule change]
        cons: [An archived worksheet can point at items that no longer exist, One more exception to explain]
      - value: allow-edit
        text: Let an agent update `blocks` on an archived worksheet when the item it names is archived
        why: References stay true everywhere; the edit is mechanical and only touches `blocks`.
        prompt: "Allow agents to update `blocks` on archived worksheets when the referenced item is archived; archive m3-pilot and fix the references."
        pros: [Every reference stays resolvable, No schema or checker change]
        cons: [The record of what was asked is no longer exactly what was asked, Opens the door to other archived-doc edits]
      - value: keep-in-plan
        text: Leave done milestones in the plan until nothing references them
        why: No rule changes; m3-pilot sits in the plan marked done.
        prompt: "Leave m3-pilot in docs/plan.yaml marked done; archive it only once nothing references it."
        pros: [No rule changes at all]
        cons: [The plan stops holding open work only, A done milestone can linger indefinitely]

  - id: n-link-kinds
    resolution:
      applied: 2026-09-03
      by: Panda
      chose: [merge]
      recorded_in: [decisions/adr-020]
      summary: |
        Merged. `link_kind` (repo, issue, pr, doc, page, play, external, file) is a vocabulary like
        every other one - shipped in yss/config.py, spelled out in site.yaml, overridable per
        collection - and both the doc envelope's `links.kind` and the card contract's `links.kind`
        now carry `x-vocab: link_kind` instead of an enum. This did change the doc envelope, so
        every kind gained `play`; nothing stopped validating, because the list only grew.
    call: N.2
    lead: Two link vocabularies now disagree - should they be one?
    help: |
      The doc envelope's `links` have used `kind: repo | issue | pr | doc | page | external | file`
      since adr-002. The card contract added by [[decisions#adr-017]] uses
      `page | play | doc | external | repo | file` - close, but not the same list, and `play` exists
      in only one of them. Anyone writing a link now has to know which kind of link they are writing.
    applies_to: "collection schema links.kind; doc envelope links.kind; decisions (new entry if the vocabularies merge)"
    options:
      - value: merge
        text: One shared link vocabulary, with `play` added to it
        recommended: true
        why: One list everywhere, resolved from config like every other vocabulary (adr-011).
        prompt: "Make link kinds a named vocabulary in site.yaml (repo, issue, pr, doc, page, play, external, file) and point both the envelope and the collection card contract at it with x-vocab."
        pros: [One list to learn, Overridable per collection like other vocabularies, "`play` becomes available to doc links too"]
        cons: [Touches the doc envelope, which every kind folds in, Existing docs must still validate]
      - value: keep-separate
        text: Keep them separate; a card link is not a doc link
        why: The card contract is about what a parent site renders, not about what a doc cites.
        prompt: "Leave the two link vocabularies separate; document the difference in the yss-publish skill."
        pros: [No envelope change, Each list stays as short as its job needs]
        cons: [Two similar lists to remember, "`play` unavailable to doc links"]

  - id: n-link-evidence
    resolution:
      applied: 2026-09-03
      by: Panda
      chose: [routes]
      recorded_in: [decisions/adr-021, plan/m7-card-link-routes]
      summary: |
        Routes only. `links.href` in collection.yaml carries `x-evidence: route`, so a relative card
        href is a claim that a real route exists. Mounts and external fetching were both left
        unticked and stay unchecked - a mount folder may be built by a hook and absent at check
        time, and fetching URLs would put the network inside `yss check`. The annotation records the
        contract; the checker cannot read it yet, because it walks docs and knows nothing of the
        route table, so [[plan#m7-card-link-routes]] carries the work.
    call: N.3
    lead: Should a card link be checked evidence?
    kind: check
    required: false
    help: |
      A card link's href is not verified today. A link to a page that was renamed, or to a mount
      whose folder was deleted, renders as a dead link on the landing page - exactly the kind of
      claim `yss check` exists to catch. Links into a mount the target does not carry are already
      dropped, so this is about links that are simply wrong. Tick what should be checked.
    applies_to: "collection schema links.href x-evidence; plan m7 task if work is needed"
    options:
      - value: routes
        text: A link to a collection page must resolve to a real route
        why: Catches a renamed or deleted page on the next build.
        pros: [Dead card links fail the check, No new authoring]
        cons: [Routes only exist after pages load, so the check runs late]
      - value: mounts
        text: A link into a mount must exist in the mounted folder
        why: Catches a deleted or renamed export.
        pros: [A missing playable is caught before publishing]
        cons: [The folder may be built by a hook and absent at check time]
      - value: external
        text: External hrefs are fetched
        why: Catches link rot off-site.
        pros: [Finds dead external links]
        cons: [Network access during check, Slow and flaky, Fails offline]

prompt:
  task: Apply the next decisions below to the yss docs and configuration
  background: |
    Repository YamlStaticSite. Docs are YAML under docs/ validated by `python -m yss validate` and
    `python -m yss check`. Plan in docs/plan.yaml, decisions in docs/decisions.yaml, defaults in
    site.yaml, per-collection config in <collection>/collection.yaml. Load the `yss` skill first.
  steps:
    - For each decision, update the named plan item, risk or open question; add a decision entry where a verdict sets a rule.
    - N.1 decides whether m3-pilot can be archived and which rule gives way; apply the move if the answer allows it.
    - N.2 and N.3 both touch the card contract from adr-017; a merge answer changes the doc envelope, so say so in the decision entry.
    - Archive this worksheet (status archived, applied note in the intro) and start a new one for anything still open.
    - Run validate, check, build --target all --no-dynamic and the tests; commit with the verdict block in the message body.
  do_not_touch:
    - .yss/local.yaml and anything under dist/.
    - Accepted decisions - supersede, never edit.
    - Archived worksheets (docs/verdicts.yaml, docs/pending.yaml, docs/open.yaml) unless N.1 says otherwise.
  flag_only:
    - Schema changes beyond what N.2 and N.3 approve.
    - Anything that would need changes in the Musings repository itself.
  rules:
    - Project knowledge goes in docs/*.yaml, never in new markdown files.
    - Validate and check after every edit; fix every reported file and path.
    - Mark anything not for the public site as visibility private or private_notes.
    - No absolute paths in anything that reaches dist/.
decided_by: true
extra: true
