agent_notes: |-
  The findings under `data.findings` are the record of one audit at one commit; do not edit them to
  reflect fixes. When a finding is fixed, mark the plan task done and let git recency stamp this doc
  `warn`; a later audit writes a new doc. Finding, scorecard and recommendation ids are indexed like
  any list item, so `[[audit#arch-serve-stale-config]]` resolves to the card; keep them unique across
  all of `data`. `rank` is the sort
  key for severity (1 critical to 5 info). `checked` is the main agent's fact-check note, added because
  the adversarial verifiers never ran. The scorecard's `score` is an integer for an audited dimension
  and the string `not audited` otherwise; the page renders both.
groups:
- id: arch
  title: Architecture and module boundaries
  blurb: |-
    The package is genuinely layered. Five modules (config, binding, visibility, symbols, hooks) import nothing from the package, attribution imports only binding, and every other edge points downward: data, then loading, then rendering, then orchestration, then the CLI and server. The one cycle in the tree is manufactured by placement, not design: the loading facade lives in build.py, so the providers reach back up to it with function-level imports. The per-collection extension contract holds in the code, not just in the docs; nothing in yss/ names the demo collection.

    The costs sit in cohesion and in rules with no owner. `Renderer` is one 900-line class with ambient per-page state that build.py also reaches into; `build()` is one 251-line function. The binding context is built in two places and the two copies have drifted, so `yss query` confidently returns empty for three virtual roots. The public-hides-private and mount-default rules are restated in three modules. And the dev server rebuilds against a `Config` and a hooks module loaded once at startup, so edits to site.yaml, collection.yaml or hooks.py print a rebuild message and change nothing.
- id: frontend
  title: Templates, prefabs, CSS and client runtime
  blurb: |-
    The presentation layer is disciplined where it matters most: one small base stylesheet built on twelve custom properties, two theme files that override tokens and nothing else, a client runtime that never puts fetched data through `innerHTML`, and a Reference page plus a unit test that both render every prefab example, so a broken example fails the strict public build before it ships. Static-first is honoured where the decision log says it is: menus are `<details>`, code-map deep links are real anchors, attribution is a `title` attribute with a hidden caption.

    The defects are concrete rather than structural. Below 720 pixels the primary navigation is `display: none` and only JavaScript can reveal it. Three components draw white on `--accent`, which measures 1.8 to 2.1 to 1 on the two shipped dark palettes. The `--muted` token colours 12 to 13 pixel text everywhere while the palette contract holds it to a 3 to 1 floor. The card markup is written three times, which the m13-emit milestone will pay for. None of it leaks data or breaks a build; all of it is cheap to fix.
- id: quality
  title: Code quality and maintainability
  blurb: |-
    The package is 5,783 lines across 22 files with 300 functions whose median length is 10 lines; only seven exceed 60. Type hints cover 84 percent of functions, there are no mutable default arguments, no cross-module use of underscore names, and every module owns one exception type. The 45 gh and adr citations in comments each resolve to a regression test or a decision entry, which makes them navigable rather than decorative. The hard logic (attribution, binding, visibility, symbols) is pure and constructor-injected, so it is tested without a filesystem.

    The weaknesses cluster in the orchestration layer, which is why they read as maintenance drag rather than risk: warnings are free-form strings so strict gating keeps parallel lists to remember their kind; reserved metadata keys and status ladders are bare literals with no single definition; the extension surface a musing author touches (providers, hooks) is the least typed and least documented code in the tree; and seven dead names survive. This is the shape of a codebase grown feature by feature through thirty issue sweeps without a consolidation pass.
