    recommendation: |-
      Keep the decision; bound the cost. Gate the import fallback behind the same policy switch as commands (`evidence.run_commands`, or a new `evidence.import_symbols`), report `skipped` with a reason when it is off, and restore `sys.path` after the import attempt. Record the residual behaviour as a consequence line on adr-024.
