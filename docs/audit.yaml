      `prefab()` names the prefab and param on a missing required arg or a type mismatch, distinguishes bool from integer, and coerces numbers to strings for string params; the `fail()` global lets a template reject its own arguments with a readable message. card keeps its closed `tone` set as a `_known_tones` param default rather than a template literal (adr-011), and the `level` param threaded through card-grid and group-sections keeps the heading outline correct when cards sit under a group heading.
  - title: Single sources of truth where drift had actually bitten
    location: yss/config.py:192-204, yss/symbols.py:311-326, yss/hooks.py:33-48
    note: |-
      `Collection.route_path` is the one answer for asset emit, mount prefix, card links and emblem hrefs (adr-027), and the build's asset copy and `_mount` both go through it (build.py:462, 520). `symbols.index_for` is shared by the evidence checker, the renderer's `symbol_range` global and the symbols provider, is cached by mtime, and never imports. These are the places the issue history shows were fixed by consolidation rather than by patching each caller.
  - title: Tests almost never reach through private members
    location: tests/test_gh23.py, tests/test_gh28.py, tests/test_gh29.py
    note: |-
      Across 29 test files only four calls touch an underscore member (`renderer._nav_groups`, `renderer._collection_nav`, `renderer._refs`, `Renderer._bind`); everything else drives `load_all`, `build`, `Renderer.render_page`, `resolve_binding` and the CLI. That keeps the refactors recommended above (extracting nav and collection views from Renderer, staging `build()`) low-risk, because the suite tests behaviour at the module boundary rather than the internal shape.
  - title: Dynamic rendering is a small, uniform envelope with graceful failure paths
    location: yss/assets/yss.js:106-147, yss/render.py:676-700, yss/prefabs/module-list.yaml:81-95
    note: |-
      Every dynamic view reads the same `{source, collected_at, ok, data|error}` envelope, an unavailable source in this target renders the page-authored `empty` text without a fetch, fetch failures print the HTTP status beside that text, and the source-reader upgrade in module-list lets the click through to the real link on any miss (no index, not pinned, 404). The runtime is 173 lines with no dependencies.
  - title: The extension API is small, dict-based and needs no yss import
    location: examples/demo-musing/hooks.py:1-47, yss/hooks.py:1-14, yss/config.py:218-233
    note: |-
      The reference hooks.py implements `configure`, `load_docs`, a provider and `after_build` in 47 lines using only `pathlib` and plain dicts; the collection it receives is `Collection.summary()` (a JSON-able dict) plus `root`, so a hook author never touches Config internals. Loading is by file path with the repo root on sys.path, and every hook is optional with `call(..., default=...)`, which is what k-per-musing asks for.
  - title: Comments explain boundaries and are navigable to their evidence
    location: |-
      yss/build.py:213-217, yss/build.py:376-378, yss/binding.py:74-85, yss/render.py:277-286, yss/attribution.py:60-67
    note: |-
      The 45 gh/adr citations each resolve to a tests/test_ghNN.py or a decisions.yaml entry, so a reader can go from a puzzling `(?<![-\w])` in LINK_RE to the exact test that pins it. The docstrings that matter most say what would go wrong otherwise: why `_source_stamp` copies rather than mutates (the JSON export would leak `_src`), why `_resolve_doc_ref` takes an `exact` flag (a generated id pushed through the scope-relative resolver is silently rewritten), why `binding_specs` scans YAML instead of hooking `_bind` (four of six section types never reach it).
  - title: Redaction is layered with containment, and the current public output is verifiably clean
    location: |-
      yss/build.py:398-408 (filter before render), :608-612 (scan after every writer, rmtree on hit); yss/visibility.py:57 (mask); adr-034 (leak scan wins over strict failures); tests/test_gh21.py:85-101
    note: |-
      Private objects are removed before rendering, the scan runs last so it sees hook artefacts, mounts, dynamic JSON and the manifest, and a hit deletes the tree and prints only masked patterns. Every data/docs/*.json under dist/public was walked: no private_notes key, no private item, no occurrence of the checkout path or either flagged name; the 27 textual hits for the word private_notes are the convention being described in codemap, decisions and the schema files.
  - title: The checkout path is forbidden automatically and the code is disciplined about repo-relative paths
    location: |-
      yss/config.py:447-449; yss/loader.py:340-344 (_rel never returns an absolute path); yss/providers/symbols.py:_relative and yss/symbols.py SymbolError docstring; docs/codemap.yaml cv-no-abs-paths; tests/test_yss.py:216-221
    note: |-
      Both spellings of the root are appended to the forbidden list for any redacting target with no configuration needed, and the modules that could emit paths (loader, symbols provider, symbol errors, mount escape checks) each convert to repo-relative form and say why in a docstring citing adr-004.
  - title: Attribution splits the public half from the private half on purpose
    location: |-
      yss/render.py:122-123 (attribution_detail = target != 'public'); yss/attribution.py:29 (FILTER_KEYS), :138 (detail=False omits filter clauses), :246 (src is the doc's repo-relative _source); adr-033 consequences
    note: |-
      The title attribute and hidden caption on the public build name only the doc and its repo-relative path, both already published in data/docs.json; where/sort/limit/group_by clauses, which are page-authored and could name a person, are rendered on the private target only. The data-src attribute carries the same repo-relative path and nothing else.
  - title: CI and secret handling follow least privilege
    location: .github/workflows/pages.yml:3-11, :35-39; yss/ghpages.py:59-71; yss/scaffold.py:322-325; .gitignore
    note: |-
      The workflow runs only on push to main and manual dispatch with contents: read, pages: write, id-token: write; the two redaction secrets are scoped to the single build step and the build runs --strict. pages-setup passes secret values to gh over stdin rather than argv and logs them masked; init writes a .gitignore that excludes .yss/local.yaml and dist/ so the local forbidden list cannot be committed by accident.
  - title: Every path that touches the filesystem checks its boundary, and YAML loading is safe everywhere
    location: |-
      yss/build.py:118-124 (_safe_clear refuses to delete the site root or a parent), :177-201 (mount source inside the site root and destination inside the output, adr-032); yss/render.py:732-741 (include must resolve inside the root); yss/loader.py:41-53, yss/config.py:139, :431 (SafeLoader only)
    note: |-
      A misconfigured out path cannot wipe the checkout, a mount cannot copy from outside the site or write outside dist, an include section cannot read outside the root, and no YAML loader anywhere can construct Python objects.
  corrections:
  - finding: '[[#arch-renderer-god-object]]'
    correction: build.py reads `renderer.ctx['collections']` at two sites (532, 593), not three.
  - finding: '[[#quality-sentinel-and-status-literals]]'
    correction: The `_source` literal appears 30 times across 7 files at this commit, not 23; the point stands.
  - finding: '[[#arch-codemap-depends-on-drift]]'
    correction: |-
      Two more lists were wrong than the finder listed: scaffold and server both omit `config`. All seven were corrected when this audit was published.
  - finding: '[[#security-scan-misses-json-encoded-strings]]'
    correction: |-
      fact verifier: Line numbers: pages.json is written at build.py:522-523 and the envelope at dynamic.py:96. Mounted and copied .json files land verbatim and are scanned raw, so the claim holds for every JSON the build itself serialises. str(OSError) already repr-doubles backslashes, so that message is missed in HTML as well as JSON; the cleanest native-single-backslash route is a traceback in a failing command source's stderr (dynamic.py:64). CLAUDE.md's prescribed local command is --no-dynamic, which skips the dynamic route; the yss-publish skill's pre-publish step (build --target public) is where it applies.
  - finding: '[[#security-scan-misses-json-encoded-strings]]'
    correction: |-
      intent verifier: Cite adr-004 and cv-no-abs-paths as the decisions whose enforcement claim this breaks, and symbols.py:41-44 plus test_yss.py:405 as places relying on the unscanned route. Exposure is bounded for the pilot (Linux CI, ASCII forbidden strings) but not for the Musings adoption the plan targets.
  - finding: '[[#security-scan-misses-json-encoded-strings]]'
    correction: |-
      Severity moved from medium to low by the impact verifier: Mechanism reproduced, but no route yields a wrong result for this project today: the deployed tree is built only by ubuntu CI where the path is posix and json.dumps does not escape slashes; the three local redaction entries are ASCII with no entity characters; on Windows the forbidden name entry is a token of the checkout path and still hits the doubled-backslash JSON line, so no false-clean local build exists; CLAUDE.md's prescribed check is --no-dynamic (cli.py:60,387; build.py:573-577), and the two public-enabled providers deliberately never emit absolute paths. What remains is a documentation-versus-behaviour gap: site.yaml forbid_root_path and adr-004 overstate the guarantee for escaped forms.
  - finding: '[[#security-scan-misses-json-encoded-strings]]'
    correction: |-
      impact verifier: Downgrade to low and reframe: the deploy gate is unaffected; keep the json.loads and html.unescape pass plus a test as a hardening task, not a security milestone.
  - finding: '[[#security-dynamic-ignores-collection-visibility]]'
    correction: |-
      fact verifier: The documented promise lives in .claude/skills/yss-publish/SKILL.md:49 and :80 (a private collection is absent from public builds), not in adr-010 or adr-015. The closest existing test, tests/test_features.py:233-243, configures exactly this case (a private collection with a hooks provider and no targets line) but passes run_dynamic=False, so the path is skipped rather than unchecked. The same unfiltered source set feeds the live preview server (server.py:73-77), so yss serve's public preview collects it too. The leak scan still covers dist/public/dynamic/*.json for forbidden strings, so what escapes is structure plus whatever the private provider returns.
  - finding: '[[#security-dynamic-ignores-collection-visibility]]'
    correction: |-
      intent verifier: Partly tracked: plan m14-provider-loaded covers the buildinfo sub-claim and, implemented as written, would close the symbols sub-claim; m14-visibility-owner never names dynamic_sources or write_all. The primary claim, a private collection's own sources written to dist/public/dynamic/ and its hooks.py run for the public target, is tracked nowhere. Cite adr-004 and adr-006 alongside adr-015. The enabling condition is the undocumented all-targets default at config.py:417; document it or flip it to private-only like mounts (the pilot's site.yaml buildinfo relies on the default and would need targets added).
  - finding: '[[#security-dynamic-ignores-collection-visibility]]'
    correction: |-
      impact verifier: Exposure is wider than stated: build.py:595 puts the hidden collection's id into build.json, linked from every public page footer (yss/templates/default.html:85). The recommended test must assert on dist/public/dynamic/<cid>.*.json and on build.json's dynamic keys.
  - finding: '[[#security-scan-skips-binary-and-unlisted-suffixes]]'
    correction: |-
      fact verifier: The asset copy block starts at build.py:543-544 and includes the package's own assets. The pilot is unaffected by its assets/ folders because they happen to contain only text suffixes today, not because of the demo mount's include; a .png emblem or .woff2 font dropped into any assets/ folder would be copied verbatim and never scanned.
  - finding: '[[#security-scan-skips-binary-and-unlisted-suffixes]]'
    correction: |-
      intent verifier: Cheapest honest fix is the wording (adr-015 and adr-032 consequences, README, skill, cv-no-abs-paths enforced_by) plus the five text suffixes. A bytes scan of binaries is a separate call that m6-godot should force before any Godot mount carries the public target; the performance brief treats reading binaries as a cost, so that half belongs on a worksheet.
  - finding: '[[#security-scan-skips-binary-and-unlisted-suffixes]]'
    correction: |-
      Severity moved from low to medium by the impact verifier: Scenario exists. The guarantee is overclaimed in more places than cited: README.md:82-84, adr-015 :258, adr-032's consequence, yss-publish SKILL.md:104-105, design.yaml:82 (p-private-by-marking), codemap cv-no-abs-paths (enforced_by: scan) and the site.yaml comment at :88 all assert whole-output coverage; only codemap.yaml:335 and the docstring at visibility.py:241-242 are accurate. TEXT_SUFFIXES is unchanged since 0.1.0 with no ADR and no test pinning the skip. No impact in the pilot today (no binaries anywhere, demo mount opts into *.html, m6-bandwidth keeps Godot exports off the public target). For the stated goal it is real: the skill (SKILL.md:155) tells agents to put prototypes under site/assets/prototypes/, which reaches the public site with neither adr-015 opt-in nor a scan; adr-032 records that the Musings consumer already mounts eight legacy output folders on the public target; images and PDF exports routinely carry creator or path metadata that both the build scan and yss scan pass. The forbidden list is precisely the maintainer's name and checkout path.
  - finding: '[[#security-scan-skips-binary-and-unlisted-suffixes]]'
    correction: |-
      impact verifier: Low understates it: the backstop is the project's core promise, at least seven canonical locations assert coverage the code disclaims, the skill's recommended prototype path bypasses both the private-by-default rule and the scan, and the flagship consumer already publishes unscanned legacy output. No leak in the pilot today keeps it below high. Add site.yaml:88, design.yaml:82 and SKILL.md:155 to the wording fix.
  - finding: '[[#security-private-ids-survive-as-identifiers]]'
    correction: |-
      fact verifier: What leaks is the authored reference string, not the resolved global id (a collection-relative `[[plan#m1]]` shows 'plan#m1'); the pages.json docs field is at build.py:526. The code-span fallback is documented at render.py:472, so the fix is a design change rather than a bug fix; binding.py's private-in-this-target hint is the pattern to reuse.
  - finding: '[[#security-private-ids-survive-as-identifiers]]'
    correction: |-
      intent verifier: The governing decision is adr-004; adr-017 is the precedent (drop, do not advertise) and binding.py:149-153 the loud-failure precedent. Extend to item-level privacy: `[[plan#x]]` where only item x is private keeps its doc in docs_t, so _item_title returns None and the item slug is emitted as link text with a live href (render.py:464-469, :495-500), reported by the dead_refs gate as a dead reference rather than a privacy problem.
  - finding: '[[#security-private-ids-survive-as-identifiers]]'
    correction: |-
      impact verifier: In a validated build the render.py:489-492 branch is reachable only by the private-doc case, so it can carry a privacy warning outright. The same class exists for private list items in a public doc: the item slug is shown (render.py:496), gated by dead_refs under strict only when the doc has a page, and ungated when it does not.
  - finding: '[[#security-evidence-exception-text-unsanitized]]'
    correction: |-
      fact verifier: Drop the doc's _evidence and build.py:503 from the channel list: inject() writes only status and counts, so data/docs/*.json carries no exception text. The live channels are data/evidence.json, the public evidence page, and dynamic/<name>.json. The path-bearing ImportError shape arises only when the imported module's own import fails; ModuleNotFoundError and SyntaxError carry no absolute path. Because the detail also lands in HTML, a Windows public build still fails loudly on the HTML hit; the JSON evasion is silent only for dynamic envelopes, which have no HTML twin.
  - finding: '[[#security-evidence-exception-text-unsanitized]]'
    correction: |-
      intent verifier: Note adr-036 as the decision that did not account for this. The Windows JSON evasion is never on a deploy path (ubuntu CI only, no local dist push); in a Windows-local public build the same detail lands unescaped in the evidence page HTML, the scan hits and the tree is deleted. Command output cannot reach the build: run_commands=False at build.py:423 and the evidence provider is private-only, on_build false.
  - finding: '[[#security-evidence-exception-text-unsanitized]]'
    correction: |-
      Severity moved from low to info by the impact verifier: Mechanism real, impact small. Deployed output: no scenario, because `python -m yss check` runs before the CI build and exits 1 on any stale claim (cli.py:133), a failed import fallback is always stale (evidence.py:273), --strict fails on stale, and the Linux scan sees the runner path verbatim in HTML and JSON. Local Windows public build: the public evidence page carries the unescaped path in HTML, the scan fires and the output is deleted. The genuinely uncaught local case is narrow: a JSON-only channel (a dynamic error) where json.dumps doubles the backslashes, or an ImportError naming a module under the user profile but outside root. Both leave a username inside gitignored dist/public on the maintainer's own machine.
  - finding: '[[#security-evidence-exception-text-unsanitized]]'
    correction: |-
      impact verifier: Downgrade to info for this project. Drop build.py:503 (data/docs/*.json carries no detail) and SyntaxError as a carrier; name ImportError and OSError instead. The recommended scrubber would not cover the one case that evades locally (a path under the user profile outside root); the underlying weakness is the scan's blindness to JSON-escaped or repr'd backslash forms, a visibility.py concern rather than an adr-036 cost.
  - finding: '[[#security-gitlog-relies-on-config-not-guard]]'
    correction: |-
      fact verifier: The why_it_matters sentence about the maintainer's git author name being the flagged string is not true of this repository: the recent commits carry one author string, the GitHub handle, which matches neither flagged name. The hazard is a config-only guard with no present leak; keep low. Also: config.py:417 uses `or`, so an explicit empty targets list also enables all targets; and a section's visibility: private never keeps the JSON file out of a public build.
  - finding: '[[#security-gitlog-relies-on-config-not-guard]]'
    correction: |-
      intent verifier: Deliberate in part (adr-006) but the guard asymmetry with adr-024's collect_source is unrecorded and the 'private-only by default' claim has no implementation behind it. Whichever fix is chosen should also record why dynamic sources default to all targets when mounts default to private, or align config.py:417 with adr-015.
  - finding: '[[#security-gitlog-relies-on-config-not-guard]]'
    correction: |-
      impact verifier: Recast: for this project the defect is a false documented default, not a leak. The fix can be the symbols-style guard or correcting the docstring and both skill copies, plus a test asserting gitlog is absent from dist/public; the leak scenario only becomes real for a private repository publishing a public site.
  - finding: '[[#security-repo-is-the-code-execution-boundary]]'
    correction: |-
      fact verifier: Four details. (1) 'claims run only with --run-commands' is too narrow: the flag is a None-default override; site.yaml or collection.yaml evidence.run_commands decides, and this repo's evidence dynamic source sets run_commands: true for the private target, so command claims execute on `yss dynamic --target private` and on every stale GET of dynamic/evidence.json from the private dev server; the build itself never runs them. (2) The markdown.renderer import is render.py:70-82. (3) hooks.py loads only in commands that reach load_all (validate, build, check, refs, ls, query, serve), not scan, schema, new, init, pages-setup or skills. (4) A fifth code path: the Jinja2 environment at render.py:140-145 is a plain Environment, not a SandboxedEnvironment; prefab templates and page map expressions are repo code too, which reinforces the thesis. Fork PRs never run the workflow at all.
  - finding: '[[#security-dev-server-loopback-only-no-auth]]'
    correction: |-
      fact verifier: Directory listing is not confined to the private port: the same handler serves dist/public on the public port. ?refresh=1 coalesces concurrent refreshes into one in-flight collection (server.py:83-86) and the wait is capped by the source's timeout (default 600 s). The private error page carries a full traceback only on the unexpected-exception branch (:184-187); the BuildError and load-failure branches write the message only. _write_error_page spans :147-155.
  refuted: []
private_notes:
  second_pass:
    how: |-
      One dimension at a time: one finder agent with the brief below, then three verifiers per finding (fact, intent, impact; a finding survives two of three; info-level findings need only the fact lens), then append the confirmed findings to data.findings with group set to the dimension key, add the dimension's group blurb, fill its scorecard row and a corrections row per verifier correction. Rules for every agent: read only; repo-relative paths only; check docs/decisions.yaml and docs/design.yaml before calling a deliberate choice a defect; plan tasks m7-on-accent-rest and m13-emit depend on a design item on purpose. Regenerate nothing by hand that a script can emit; keep finding ids unique across all of data.
    order:
    - security
    - tests
    - errors
    - schema
    - packaging
    - drift
    - perf
    briefs:
      errors:
        title: Error handling and robustness
        brief: |-
          Dimension: ERROR HANDLING, FAILURE MODES AND ROBUSTNESS.
          Trace the failure paths: exceptions raised/caught in yss/cli.py, build.py, loader.py, evidence.py, dynamic.py, server.py, hooks.py. Assess: broad 'except Exception' swallowing, error messages that lose file/path context (the project promises file-and-path in every error), exit codes vs the documented contract (0/1/2 in design interfaces i-cli), atomicity of build output (dist/ deleted on forbidden hit, advisory lock in build.py per adr-029: is it actually safe on Windows? stale lock recovery?), partial writes, subprocess handling (timeouts, encoding on Windows, shell=True), thread safety in server.py (background dynamic refresh, rebuild while serving), resource cleanup (file handles, sockets), behaviour when a hooks.py raises, when a provider hangs, when git is absent, when a schema file is malformed. Also check loader behaviour on duplicate ids, missing docs referenced by pages, and how warnings vs errors are distinguished and surfaced.
      tests:
        title: Test strategy and coverage
        brief: |-
          Dimension: TEST STRATEGY, STRUCTURE AND COVERAGE.
          Read tests/*.py (all files). Assess: the one-file-per-GitHub-issue naming (test_ghNN.py) and what it does to discoverability and duplication; shared fixtures/helpers vs copy-paste (grep for repeated tmp-site scaffolding); isolation (do tests write into the real repo, dist/, .yss/, or rely on the repo's own docs?); speed (the whole suite takes 573 s on Windows: find the slow tests by reading: subprocess builds? git calls? full builds of the pilot repo per test? the testruns provider running unittest inside unittest? skills install into temp dirs?); flakiness risks (network, clock, git author, port binding in server tests, Windows path/CRLF); what modules or behaviours have NO tests (map tests to yss/ modules; codemap.yaml lists 'tests:' per module: verify those claims); assertion quality (asserting on exact strings vs behaviour); whether tests cover the public-redaction guarantee end to end; whether CI runs the same suite. Do NOT run the suite. Prefer static reading; you may run 'python -m unittest tests.test_gh01 -v' style single small modules ONLY if they are clearly fast and do not write into the repo.
      security:
        title: Security and privacy guarantees
        brief: |-
          Dimension: SECURITY AND PRIVACY.
          The product promise: the public build must never contain private data, the maintainer's legal name, or the absolute checkout path. Trace the redaction pipeline end to end: yss/visibility.py filter_for_target and scan_tree, yss/build.py (where the scan runs, what file types it covers, what happens on a hit, whether exported JSON, dynamic JSON, mounted assets, copied collection assets and the manifest are all covered), yss/config.py redaction lists (.yss/local.yaml, env vars YSS_FORBIDDEN_STRINGS), .github/workflows/pages.yml secrets usage. Look for gaps: private items in nested structures the filter misses, private_notes inside prefab args or page sections, dynamic sources with targets public leaking repo-local data, symbolsource/gitlog targets, mounts, evidence output including absolute paths or command output, error messages embedded in output, the new _src/_doc attribution keys and data-src attributes (do they leak private doc ids or paths into public HTML?). Then the code-execution surface: hooks.py loaded and executed in-process (yss/hooks.py), 'command' evidence claims and 'command' dynamic sources (shell=True?), yaml.safe_load vs load, Jinja2 autoescape settings in yss/render.py and prefab templates using |safe or autoescape false, the dev server (yss/server.py) path traversal, host binding, directory listing, COOP/COEP. Rate the actual exposure honestly: a local dev server bound to 127.0.0.1 is not a public attack surface, but say so explicitly.
      schema:
        title: Data model, schemas and validation
        brief: |-
          Dimension: DATA MODEL, SCHEMAS AND VALIDATION DESIGN.
          Read yss/schemas/*.yaml and yss/loader.py (SchemaRegistry, envelope merging, x-vocab / x-limit / x-ref / x-evidence annotation discovery, resolved(), validate(), check_refs) and yss/config.py DEFAULTS. Assess: correctness of merging the envelope into each kind (allOf vs property merge, unevaluatedProperties, additionalProperties interactions: the envelope comment says a status enum on item_base would intersect wrongly: is that handled consistently?), whether annotation resolution is cached and invalidated properly per collection, quality and locality of validation error messages (file, path, allowed values), the reference resolver (collection-local first, /doc root, `[[doc#item]]` in text: false positives inside code spans?), id uniqueness across collections and hooks-loaded docs, the 'generic' escape hatch, schema drift between yss/schemas and what pages/prefabs assume (page.schema.yaml section keys vs render.py handlers), duplication between schemas (item_base repeated?), and whether site.schema.yaml and collection.schema.yaml stay in sync with config.py DEFAULTS. Also check the doc.envelope 'links' kind vocab vs collection card links (adr-020), and the new reserved _src/_doc keys.
      packaging:
        title: Packaging, CI/CD and developer experience
        brief: |-
          Dimension: PACKAGING, CI/CD, REPO HYGIENE AND DEVELOPER EXPERIENCE.
          Read pyproject.toml, requirements.txt, .gitignore, .gitattributes, .github/workflows/pages.yml, .claude/launch.json, README.md, CLAUDE.md, yss/__init__.py, yss/__main__.py, yss/cli.py, yss/scaffold.py (yss init), yss/skillpack.py, yss/ghpages.py. Assess: dependency declaration duplication (requirements.txt vs pyproject: are they in sync? are versions pinned anywhere? no lockfile), package-data completeness (does the wheel ship everything 'yss init' and the renderer need: schemas, prefabs, templates, assets, skills: check the globs against the actual tree including subfolders), the version triple (pyproject / yss/__init__.py / changelog: convention cv-release says a test enforces it: find that test), the observed 'pip show yss' 0.2.0 vs 0.3.0 mismatch (stale editable install metadata? yss.egg-info present in the tree), CRLF: git warns 'CRLF will be replaced by LF' on several files: what does .gitattributes say and are line endings consistent?, CI: no Windows job although development is on Windows (constraint k-windows), no test matrix, secrets passed as env, cancel-in-progress, fetch-depth 0 for git recency, missing steps (lint? type check? the suite is 573 s), no linter/formatter/type-checker configured at all (no ruff/mypy/pre-commit): is that a gap?, CLI ergonomics (argparse structure, --help quality, consistency of flags across subcommands, exit codes), 'yss init' scaffold on a fresh repo, and README accuracy vs the CLI (compare the README command table against cli.py subparsers).
      drift:
        title: Docs-as-code consistency and drift
        brief: |-
          Dimension: DOCUMENTATION-AS-CODE CONSISTENCY AND DRIFT.
          This repo documents itself with its own tool and claims the docs are checked evidence. Verify that claim harder than 'yss check' does. Compare: docs/codemap.yaml modules and exports against the real modules (every module in yss/ listed? every listed export exists with roughly that signature? private names like _check_export, _nav_groups, _collection_nav, _emblem_url, _page_state, _dead_links listed as exports: is exposing private helpers in the code map a smell or a deliberate deep-link choice per adr-024?), codemap 'tests:' claims against what the tests actually cover, docs/design.yaml components 'code:' and 'depends_on' against real imports, design interfaces (i-cli subcommand list vs cli.py; i-hooks function list vs hooks.py; i-binding ops order vs binding.py; i-data-json exported files vs build.py), conventions cv-* 'enforced_by' claims (is each really enforced by validate/check/build/scan/test? find the enforcing code or test; 'none' ones: could they be enforced?), docs/decisions.yaml adr consequences vs code (spot check 6-8 ADRs), docs/glossary.yaml terms vs actual vocabulary, docs/changelog.yaml latest release vs pyproject version and git tags ('git tag' is read-only), README and CLAUDE.md command lists vs cli.py, the five skills in yss/skills/ vs .claude/skills/ (identical? the codemap says a test keeps them so) and skills' CLI claims vs cli.py. Report every concrete mismatch as a finding with both sides quoted.
      perf:
        title: Performance and scalability
        brief: |-
          Dimension: PERFORMANCE AND SCALABILITY.
          Read yss/loader.py, evidence.py, build.py, render.py, binding.py, symbols.py, dynamic.py, server.py, providers/*. Assess with evidence (count call sites, look for loops): repeated schema resolution/validation per doc (is SchemaRegistry.resolved cached? keyed on what?), jsonschema validator construction per call vs once, deep copies of docs per target/page, git subprocess calls per doc or per claim in evidence git-recency (how many 'git log' invocations for N docs? is there a single 'git log --name-only' pass?), symbols parsing cached by mtime (verify), evidence path checks that walk the tree, the output scan reading every file (fine) vs reading binaries, the server's polling watcher (interval, what it stats), dynamic sources collected synchronously during build (testruns runs the whole unittest suite inside the build? the suite is 573 s: is on_build true for it? check site.yaml and dynamic.py), rebuild-on-change granularity (full rebuild of both targets on any change?), and how all of this scales to the stated goal of hosting a multi-musing repository with many collections (adr-010). Where you can, measure cheaply and read-only: e.g. 'python -c' timing of Config.load + load_all, or count of git invocations by reading code. Do not run build or the tests.
