    observation: |-
      adr-024 moved symbol proof to AST parsing but kept import as the fallback ('a name that only exists at runtime ... still checks out'). `_check_symbol` inserts `cfg.root` into `sys.path` and calls `importlib.import_module(module_name)` for any `symbol:` claim the parser cannot resolve; `build()` runs `evidence_check` by default (`check_evidence=True`), so a claim authored in any doc, including a hook-generated one, can execute module-level code in the build process and in CI. `hooks.load_hooks` mutates `sys.path` the same way. Neither insertion is undone.
