  - title: Constraint k-per-musing holds in the code, not just the docs
    location: |-
      examples/demo-musing/hooks.py, examples/demo-musing/collection.yaml, yss/loader.py:363-375, yss/dynamic.py:37-45, yss/build.py:387-394, yss/build.py:513-520
    note: |-
      A grep of yss/ for demo-musing, hooked, inventory, cannon finds nothing outside generic comments and schema examples. The demo collection exercises every extension point (configure, load_docs, a hooks provider, after_build, per-collection vocabulary, limits, evidence policy, dynamic source, mount with include) purely through collection.yaml and hooks.py, and each is reached through one named seam in core (`_collection_items`, `dynamic.collect`, `build()` hook calls).
  - title: Prefab examples are exercised twice, and a broken one fails the public build
    location: |-
      tests/test_yss.py:238-244, site/prefabs/prefab-gallery.yaml:25-31, site/pages/reference.yaml:8-14, tests/test_gh11.py:235-238
    note: |-
      `test_every_prefab_example_renders` calls `renderer.prefab(name, example["args"])` for every loaded prefab and asserts non-empty output; the Reference page (public, no visibility key) binds `$prefabs` into prefab-gallery, whose template calls `prefab(p.name, ex.args)` for each example, so CI's strict public build renders them all. test_gh11 additionally asserts examples ship no dead reference links. The skill's claim that "the test suite renders every example" is true.
  - title: One exception type per module, mapped to exit codes in one place
    location: |-
      yss/cli.py:495-499, yss/build.py:26, yss/loader.py:37, yss/config.py:108, yss/hooks.py:22, yss/binding.py:17, yss/render.py:45, yss/dynamic.py:24, yss/symbols.py:226
    note: |-
      ConfigError/LoadError map to exit 2 and BuildError/BindError/ScaffoldError/GhError to exit 1 in `main` and the `cmd_*` adapters; lower layers wrap foreign exceptions into their own (`HookError` at hooks.py:46, `SymbolError` carrying only a repo-relative path per adr-004, `RenderError` wrapping Jinja `TemplateError` at render.py:566). Errors carry file and path, which is what design p-validate-early asks for.
  - title: A pure core with constructor injection, so the hard logic is testable without a filesystem
    location: |-
      yss/attribution.py:1-18, yss/binding.py:293-350, yss/visibility.py:19-54, yss/symbols.py:71-108, yss/config.py:237-242, yss/render.py:89-99
    note: |-
      attribution.py, binding.py, visibility.py and symbols.py take dicts, strings and Paths and return values; `attribute()` and `describe()` are explicitly designed to run on spec dictionaries alone (attribution.py:6-9) and six test files import these modules directly. `Config(root, data)` accepts an in-memory dict, and `Renderer` receives docs, pages, prefabs, `all_doc_ids`, `build_info` and `evidence` as constructor arguments rather than loading them, so a renderer can be built over hand-written docs (tests/test_yss.py:240, 490).
  - title: Theme layer overrides tokens only, and a test pins it
    location: |-
      site/assets/theme-bamboo.css:14-44, examples/demo-musing/assets/theme.css, tests/test_features.py:249-260, yss/assets/yss.css:149-167
    note: |-
      Both shipped themes touch custom properties (or collection-class-scoped rules) and no layout; `test_site_theme_css_is_linked_after_the_base_stylesheet` asserts link order and that the theme contains no `.site-header` rule. The adr-031 tokens are consumed as `var(--x, var(--old))` at the point of use with the substitution-rule rationale written into the stylesheet itself, so a palette that declares none of them renders unchanged.
  - title: Static-first is real in the places the decision log claims it
    location: |-
      yss/templates/default.html:26-34, yss/render.py:600-620, yss/prefabs/module-list.yaml:29-36, yss/assets/yss.css:30, yss/prefabs/status-board.yaml:29-40
    note: |-
      Nav menus are `<details>`; attribution is a `title` attribute plus a `hidden` caption; code-map deep links carry real `#L<start>-L<end>` anchors computed at render time so they work with scripting off; anchor offsetting is a single `--header-offset` token spent as `scroll-padding-top`; the status board switches to kanban columns with a container query because it sits beside the TOC; wide tables get a `.table-scroll` wrapper. A skip link, `aria-expanded`/`aria-controls` on the toggle, `aria-label` on the TOC aside, `aria-live` on the worksheet status and `aria-pressed` on toggles are all present.
  - title: |-
      Hygiene basics are consistently right: no mutable defaults, 84% fully typed, no cross-module underscore access
    location: yss/*.py, yss/providers/*.py
    note: |-
      An AST scan found no `def f(x=[])`/`={}` defaults anywhere; 253 of 300 functions have every parameter and the return annotated; every module starts with `from __future__ import annotations`; and a grep for `from .x import _name` and `obj._attr` across module boundaries returned nothing - private helpers stay private. Module-level state is limited to two caches (`hooks._cache`, `symbols._CACHE`, the latter mtime-keyed) and one immutable MarkdownIt instance.
  - title: Prefab argument checking fails loudly and keeps vocabularies as data
    location: yss/render.py:525-566, yss/render.py:187-195, yss/prefabs/card.yaml:23-28, yss/prefabs/card.yaml:22
    note: |-
      `prefab()` names the prefab and param on a missing required arg or a type mismatch, distinguishes bool from integer, and coerces numbers to strings for string params; the `fail()` global lets a template reject its own arguments with a readable message. card keeps its closed `tone` set as a `_known_tones` param default rather than a template literal (adr-011), and the `level` param threaded through card-grid and group-sections keeps the heading outline correct when cards sit under a group heading.
  - title: Single sources of truth where drift had actually bitten
    location: yss/config.py:192-204, yss/symbols.py:311-326, yss/hooks.py:33-48
    note: |-
      `Collection.route_path` is the one answer for asset emit, mount prefix, card links and emblem hrefs (adr-027), and the build's asset copy and `_mount` both go through it (build.py:462, 520). `symbols.index_for` is shared by the evidence checker, the renderer's `symbol_range` global and the symbols provider, is cached by mtime, and never imports. These are the places the issue history shows were fixed by consolidation rather than by patching each caller.
  - title: Tests almost never reach through private members
    location: tests/test_gh23.py, tests/test_gh28.py, tests/test_gh29.py
    note: |-
      Across 29 test files only four calls touch an underscore member (`renderer._nav_groups`, `renderer._collection_nav`, `renderer._refs`, `Renderer._bind`); everything else drives `load_all`, `build`, `Renderer.render_page`, `resolve_binding` and the CLI. That keeps the refactors recommended above (extracting nav and collection views from Renderer, staging `build()`) low-risk, because the suite tests behaviour at the module boundary rather than the internal shape.
  - title: Dynamic rendering is a small, uniform envelope with graceful failure paths
    location: yss/assets/yss.js:106-147, yss/render.py:676-700, yss/prefabs/module-list.yaml:81-95
    note: |-
      Every dynamic view reads the same `{source, collected_at, ok, data|error}` envelope, an unavailable source in this target renders the page-authored `empty` text without a fetch, fetch failures print the HTTP status beside that text, and the source-reader upgrade in module-list lets the click through to the real link on any miss (no index, not pinned, 404). The runtime is 173 lines with no dependencies.
  - title: The extension API is small, dict-based and needs no yss import
    location: examples/demo-musing/hooks.py:1-47, yss/hooks.py:1-14, yss/config.py:218-233
    note: |-
      The reference hooks.py implements `configure`, `load_docs`, a provider and `after_build` in 47 lines using only `pathlib` and plain dicts; the collection it receives is `Collection.summary()` (a JSON-able dict) plus `root`, so a hook author never touches Config internals. Loading is by file path with the repo root on sys.path, and every hook is optional with `call(..., default=...)`, which is what k-per-musing asks for.
  - title: Comments explain boundaries and are navigable to their evidence
    location: |-
      yss/build.py:213-217, yss/build.py:376-378, yss/binding.py:74-85, yss/render.py:277-286, yss/attribution.py:60-67
    note: |-
      The 45 gh/adr citations each resolve to a tests/test_ghNN.py or a decisions.yaml entry, so a reader can go from a puzzling `(?<![-\w])` in LINK_RE to the exact test that pins it. The docstrings that matter most say what would go wrong otherwise: why `_source_stamp` copies rather than mutates (the JSON export would leak `_src`), why `_resolve_doc_ref` takes an `exact` flag (a generated id pushed through the scope-relative resolver is silently rewritten), why `binding_specs` scans YAML instead of hooking `_bind` (four of six section types never reach it).
  corrections:
  - finding: '[[#arch-renderer-god-object]]'
    correction: build.py reads `renderer.ctx['collections']` at two sites (532, 593), not three.
  - finding: '[[#quality-sentinel-and-status-literals]]'
    correction: The `_source` literal appears 30 times across 7 files at this commit, not 23; the point stands.
  - finding: '[[#arch-codemap-depends-on-drift]]'
    correction: |-
      Two more lists were wrong than the finder listed: scaffold and server both omit `config`. All seven were corrected when this audit was published.
private_notes:
  second_pass:
    how: |-
      One dimension at a time: one finder agent with the brief below, then three verifiers per finding (fact, intent, impact; a finding survives two of three; info-level findings need only the fact lens), then append the confirmed findings to data.findings with group set to the dimension key, add the dimension's group blurb, fill its scorecard row and a corrections row per verifier correction. Rules for every agent: read only; repo-relative paths only; check docs/decisions.yaml and docs/design.yaml before calling a deliberate choice a defect; plan tasks m7-on-accent-rest and m13-emit depend on a design item on purpose. Regenerate nothing by hand that a script can emit; keep finding ids unique across all of data.
    order:
    - security
    - tests
    - errors
    - schema
    - packaging
    - drift
    - perf
    briefs:
      errors:
        title: Error handling and robustness
        brief: |-
          Dimension: ERROR HANDLING, FAILURE MODES AND ROBUSTNESS.
          Trace the failure paths: exceptions raised/caught in yss/cli.py, build.py, loader.py, evidence.py, dynamic.py, server.py, hooks.py. Assess: broad 'except Exception' swallowing, error messages that lose file/path context (the project promises file-and-path in every error), exit codes vs the documented contract (0/1/2 in design interfaces i-cli), atomicity of build output (dist/ deleted on forbidden hit, advisory lock in build.py per adr-029: is it actually safe on Windows? stale lock recovery?), partial writes, subprocess handling (timeouts, encoding on Windows, shell=True), thread safety in server.py (background dynamic refresh, rebuild while serving), resource cleanup (file handles, sockets), behaviour when a hooks.py raises, when a provider hangs, when git is absent, when a schema file is malformed. Also check loader behaviour on duplicate ids, missing docs referenced by pages, and how warnings vs errors are distinguished and surfaced.
      tests:
        title: Test strategy and coverage
        brief: |-
          Dimension: TEST STRATEGY, STRUCTURE AND COVERAGE.
          Read tests/*.py (all files). Assess: the one-file-per-GitHub-issue naming (test_ghNN.py) and what it does to discoverability and duplication; shared fixtures/helpers vs copy-paste (grep for repeated tmp-site scaffolding); isolation (do tests write into the real repo, dist/, .yss/, or rely on the repo's own docs?); speed (the whole suite takes 573 s on Windows: find the slow tests by reading: subprocess builds? git calls? full builds of the pilot repo per test? the testruns provider running unittest inside unittest? skills install into temp dirs?); flakiness risks (network, clock, git author, port binding in server tests, Windows path/CRLF); what modules or behaviours have NO tests (map tests to yss/ modules; codemap.yaml lists 'tests:' per module: verify those claims); assertion quality (asserting on exact strings vs behaviour); whether tests cover the public-redaction guarantee end to end; whether CI runs the same suite. Do NOT run the suite. Prefer static reading; you may run 'python -m unittest tests.test_gh01 -v' style single small modules ONLY if they are clearly fast and do not write into the repo.
      security:
        title: Security and privacy guarantees
        brief: |-
          Dimension: SECURITY AND PRIVACY.
          The product promise: the public build must never contain private data, the maintainer's legal name, or the absolute checkout path. Trace the redaction pipeline end to end: yss/visibility.py filter_for_target and scan_tree, yss/build.py (where the scan runs, what file types it covers, what happens on a hit, whether exported JSON, dynamic JSON, mounted assets, copied collection assets and the manifest are all covered), yss/config.py redaction lists (.yss/local.yaml, env vars YSS_FORBIDDEN_STRINGS), .github/workflows/pages.yml secrets usage. Look for gaps: private items in nested structures the filter misses, private_notes inside prefab args or page sections, dynamic sources with targets public leaking repo-local data, symbolsource/gitlog targets, mounts, evidence output including absolute paths or command output, error messages embedded in output, the new _src/_doc attribution keys and data-src attributes (do they leak private doc ids or paths into public HTML?). Then the code-execution surface: hooks.py loaded and executed in-process (yss/hooks.py), 'command' evidence claims and 'command' dynamic sources (shell=True?), yaml.safe_load vs load, Jinja2 autoescape settings in yss/render.py and prefab templates using |safe or autoescape false, the dev server (yss/server.py) path traversal, host binding, directory listing, COOP/COEP. Rate the actual exposure honestly: a local dev server bound to 127.0.0.1 is not a public attack surface, but say so explicitly.
      schema:
        title: Data model, schemas and validation
        brief: "Dimension: DATA MODEL, SCHEMAS AND VALIDATION DESIGN.\nRead yss/schemas/*.yaml and yss/loader.py\
          \ (SchemaRegistry, envelope merging, x-vocab / x-limit / x-ref / x-evidence annotation discovery, resolved(),\
          \ validate(), check_refs) and yss/config.py DEFAULTS. Assess: correctness of merging the envelope into\
          \ each kind (allOf vs property merge, unevaluatedProperties, additionalProperties interactions: the envelope\
          \ comment says a status enum on item_base would intersect wrongly: is that handled consistently?), whether\
          \ annotation resolution is cached and invalidated properly per collection, quality and locality of validation\
          \ error messages (file, path, allowed values), the reference resolver (collection-local first, /doc root,\
          \ `[[\x01]]` in text: false positives inside code spans?), id uniqueness across collections and hooks-loaded\
          \ docs, the 'generic' escape hatch, schema drift between yss/schemas and what pages/prefabs assume (page.schema.yaml\
          \ section keys vs render.py handlers), duplication between schemas (item_base repeated?), and whether\
          \ site.schema.yaml and collection.schema.yaml stay in sync with config.py DEFAULTS. Also check the doc.envelope\
          \ 'links' kind vocab vs collection card links (adr-020), and the new reserved _src/_doc keys."
      packaging:
        title: Packaging, CI/CD and developer experience
        brief: |-
          Dimension: PACKAGING, CI/CD, REPO HYGIENE AND DEVELOPER EXPERIENCE.
          Read pyproject.toml, requirements.txt, .gitignore, .gitattributes, .github/workflows/pages.yml, .claude/launch.json, README.md, CLAUDE.md, yss/__init__.py, yss/__main__.py, yss/cli.py, yss/scaffold.py (yss init), yss/skillpack.py, yss/ghpages.py. Assess: dependency declaration duplication (requirements.txt vs pyproject: are they in sync? are versions pinned anywhere? no lockfile), package-data completeness (does the wheel ship everything 'yss init' and the renderer need: schemas, prefabs, templates, assets, skills: check the globs against the actual tree including subfolders), the version triple (pyproject / yss/__init__.py / changelog: convention cv-release says a test enforces it: find that test), the observed 'pip show yss' 0.2.0 vs 0.3.0 mismatch (stale editable install metadata? yss.egg-info present in the tree), CRLF: git warns 'CRLF will be replaced by LF' on several files: what does .gitattributes say and are line endings consistent?, CI: no Windows job although development is on Windows (constraint k-windows), no test matrix, secrets passed as env, cancel-in-progress, fetch-depth 0 for git recency, missing steps (lint? type check? the suite is 573 s), no linter/formatter/type-checker configured at all (no ruff/mypy/pre-commit): is that a gap?, CLI ergonomics (argparse structure, --help quality, consistency of flags across subcommands, exit codes), 'yss init' scaffold on a fresh repo, and README accuracy vs the CLI (compare the README command table against cli.py subparsers).
      drift:
        title: Docs-as-code consistency and drift
        brief: |-
          Dimension: DOCUMENTATION-AS-CODE CONSISTENCY AND DRIFT.
          This repo documents itself with its own tool and claims the docs are checked evidence. Verify that claim harder than 'yss check' does. Compare: docs/codemap.yaml modules and exports against the real modules (every module in yss/ listed? every listed export exists with roughly that signature? private names like _check_export, _nav_groups, _collection_nav, _emblem_url, _page_state, _dead_links listed as exports: is exposing private helpers in the code map a smell or a deliberate deep-link choice per adr-024?), codemap 'tests:' claims against what the tests actually cover, docs/design.yaml components 'code:' and 'depends_on' against real imports, design interfaces (i-cli subcommand list vs cli.py; i-hooks function list vs hooks.py; i-binding ops order vs binding.py; i-data-json exported files vs build.py), conventions cv-* 'enforced_by' claims (is each really enforced by validate/check/build/scan/test? find the enforcing code or test; 'none' ones: could they be enforced?), docs/decisions.yaml adr consequences vs code (spot check 6-8 ADRs), docs/glossary.yaml terms vs actual vocabulary, docs/changelog.yaml latest release vs pyproject version and git tags ('git tag' is read-only), README and CLAUDE.md command lists vs cli.py, the five skills in yss/skills/ vs .claude/skills/ (identical? the codemap says a test keeps them so) and skills' CLI claims vs cli.py. Report every concrete mismatch as a finding with both sides quoted.
      perf:
        title: Performance and scalability
        brief: |-
          Dimension: PERFORMANCE AND SCALABILITY.
          Read yss/loader.py, evidence.py, build.py, render.py, binding.py, symbols.py, dynamic.py, server.py, providers/*. Assess with evidence (count call sites, look for loops): repeated schema resolution/validation per doc (is SchemaRegistry.resolved cached? keyed on what?), jsonschema validator construction per call vs once, deep copies of docs per target/page, git subprocess calls per doc or per claim in evidence git-recency (how many 'git log' invocations for N docs? is there a single 'git log --name-only' pass?), symbols parsing cached by mtime (verify), evidence path checks that walk the tree, the output scan reading every file (fine) vs reading binaries, the server's polling watcher (interval, what it stats), dynamic sources collected synchronously during build (testruns runs the whole unittest suite inside the build? the suite is 573 s: is on_build true for it? check site.yaml and dynamic.py), rebuild-on-change granularity (full rebuild of both targets on any change?), and how all of this scales to the stated goal of hosting a multi-musing repository with many collections (adr-010). Where you can, measure cheaply and read-only: e.g. 'python -c' timing of Config.load + load_all, or count of git invocations by reading code. Do not run build or the tests.
