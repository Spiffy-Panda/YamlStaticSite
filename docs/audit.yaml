  findings:
  - id: arch-query-context-drift
    handle: AUD.15
    title: The binding context is built in two places; `yss query` silently lacks three virtual roots
    group: arch
    severity: high
    rank: 2
    confidence: high
    location: yss/cli.py:250, yss/render.py:118-127, yss/binding.py:125-133
    observation: |-
      `Renderer.__init__` builds `self.ctx` with keys docs, pages, site, prefabs, all_doc_ids, collections, evidence, build, collection. `cmd_query` builds its own dict with only docs, pages, site, prefabs, all_doc_ids. `binding.resolve_from` treats the missing roots as empty (`ctx.get("collections") or []`, `ctx.get("build") or {}`), so on this repository, which has the demo-musing collection, `python -m yss query '$collections'` prints `[]`, `'$build'` prints `{}` and `'$evidence'` prints `[]`, all with exit 0 (verified at audit time). `cmd_query` also never sets `collection`, so the collection-local resolution a page gets cannot be expressed from the CLI.
    why_it_matters: |-
      docs/codemap.yaml e-query and CLAUDE.md tell agents that `yss query` reads 'structured data the way pages do'. An agent checking why a collection-index page is empty gets a confident empty answer from the tool meant to diagnose it. The contract 'what a binding can see' has no owner, so the two copies drifted as roots were added (collections, evidence, build all arrived after the query command).
    recommendation: |-
      Add one `binding_context(cfg, target, loaded, build_info=None, evidence=None, collection=None) -> dict` (in binding.py or a small context module), call it from both `Renderer.__init__` and `cmd_query`, and have `resolve_from` raise `BindError` for a root name that is absent from the ctx rather than defaulting to empty. Give `yss query` a `--collection` flag so collection-local `from:` expressions can be reproduced.
    related_decision: ''
    checked: |-
      Confirmed live: on this repository `python -m yss query '$collections'` prints `[]` and `'$build'` prints `{}`; `cmd_query` builds a five-key context, `Renderer.__init__` a nine-key one.
  - id: arch-serve-stale-config
    handle: AUD.16
    title: serve rebuilds with a Config, collection data and hooks cache that are never refreshed
    group: arch
    severity: high
    rank: 2
    confidence: high
    location: |-
      yss/server.py:158-169, yss/server.py:219-229, yss/config.py:278-280, yss/config.py:306, yss/hooks.py:34-36, yss/loader.py:484-487, yss/server.py:158-229, yss/config.py:241, yss/config.py:279-280, yss/hooks.py:28-48, yss/config.py:271-275
    observation: |-
      `serve(cfg, ...)` receives one `Config` from `cli._cfg` and the watch loop calls `rebuild(cfg, ...)` -> `load_all(cfg)` on every change. `Config.collections()` returns the memoised `self._collections` once built, and each `Collection.data` was read from collection.yaml exactly once at config.py:306; `cfg.data` (site.yaml) is never re-read either. `hooks.load_hooks` caches modules in `_cache` keyed only by resolved path, with no mtime check (contrast `symbols._CACHE`, which is mtime-keyed). `watch_paths()` explicitly includes site.yaml, every collection root and `serve.watch`, so an edit to site.yaml, collection.yaml or hooks.py does trigger a rebuild, but that rebuild uses the first-load data and the first-loaded hook module. Additionally `load_collection_configs` runs the `configure()` hook against `dict(collection.data)` and stores the result back onto the cached Collection, so on every rebuild (and every provider `load_all`) configure() is applied to its own previous output rather than to the file. The code-quality finder reached the same conclusion independently: `Config.data` is computed once in `__init__`, `collections()` memoises on `_collections`, nothing in the package clears `hooks._cache`, and no test exercises `rebuild()` after a config or hooks change.
    why_it_matters: |-
      The dev server is the loop an author uses to check collection.yaml, theme, mount and hook changes; a rebuild that silently ignores those files shows a stale page with a fresh '[watch] rebuilding' message and no error. Nothing in docs/plan.yaml or docs/decisions.yaml records this as a limitation (adr-008 and m7-watchdog concern the watch mechanism, not what is reloaded).
    recommendation: |-
      Have `rebuild` construct a fresh `Config.load(cfg.root)` per rebuild (or add `Config.reload()` that clears `_collections`), key `hooks._cache` by (path, mtime) the way `symbols.index_for` already does, and make `load_collection_configs` apply `configure()` to a copy of the file data rather than writing back into the shared Collection. Add a test that edits collection.yaml between two `rebuild` calls and asserts the second build sees the change.
    related_decision: ''
    checked: |-
      Confirmed: `rebuild(cfg, ...)` reuses the one Config; `Config.collections()` returns the memoised list; `hooks._cache` is keyed by path only; `load_collection_configs` writes `configure()`'s result back onto the shared Collection.
    merged_from:
    - quality-serve-stale-config-and-hooks
  - id: arch-build-monolith
    handle: AUD.17
    title: build() is a single ~280-line function with a dozen inline stages and threaded locals
    group: arch
    severity: medium
    rank: 3
    confidence: high
    location: yss/build.py:355-633, yss/build.py:382-632
    observation: |-
      `build()` inlines, in order: lock acquisition, `_safe_clear`, evidence check and inject, build_info and Renderer construction, before_render hooks, page rendering plus the duplicate-anchor gate, renderer warnings, dead refs, data export (docs, docs.json, pages.json, collections.json, evidence.json, site.json), schema export, four asset copies plus three generated bundles, site and collection mounts, dynamic sources, after_build hooks, manifest, dead links, leak scan and strict aggregation. Stage results are carried in locals (`evidence_rows`, `rendered`, `duplicate_ids`, `strict_failures`, `build_info`) rather than on `BuildReport`. The only stage boundaries that exist as functions are the ones that were extracted for specific issues (`_dead_links`, `_mount`, `_acquire_lock`). Every test of a gate therefore runs the whole pipeline over a temp site. The code-quality finder counted the same function at 251 lines against a package median of 10, and 91 `build(` calls in the tests against 49 direct pure-function calls.
    why_it_matters: |-
      Adding the next gate (plan m7-card-link-routes needs route-table-aware evidence, m13-emit adds per-item data-src) means editing the middle of this function and re-deriving which locals it may read. The ordering constraints that matter (dead-link gate after hooks and manifest; leak scan last; strict failures collected not raised, adr-034) are expressed only as comments inside the body.
    recommendation: |-
      Split into stage functions with one signature, e.g. `_stage_render(ctx)`, `_stage_export(ctx)`, `_stage_assets(ctx)`, `_stage_mounts(ctx)`, `_stage_gates(ctx)`, where `ctx` is a small dataclass holding cfg, target, out, loaded, docs_t, pages_t, renderer, report and strict_failures; keep `build()` as the ordered list of stages under the lock. This is a pure refactor and lets the gate tests call one stage over a prepared output tree.
    related_decision: adr-034
    checked: 'Confirmed: `build()` spans build.py:382-633 and every helper it calls is module-private.'
    merged_from:
    - quality-build-monolith
  - id: arch-load-facade-in-build
    handle: AUD.18
    title: The loading facade lives in build.py, forcing a lazy providers -> build back-edge
    group: arch
    severity: medium
    rank: 3
    confidence: high
    location: |-
      yss/build.py:54-95, yss/providers/buildinfo.py:12, yss/providers/evidence.py:12-13, yss/providers/symbols.py:38, yss/dynamic.py:47, docs/codemap.yaml:175-180
    observation: |-
      `Loaded`, `load_all` and `cross_checks` are defined in build.py. cli, server and all three built-in providers import them from there; the providers do so with function-level imports (`from ..build import load_all`) because build imports dynamic, and dynamic reaches the providers through `importlib.import_module` at yss/dynamic.py:47, so a top-level import would be circular. `cross_checks` itself needs only `cfg.dynamic_sources`, `docs`, `pages`, `prefabs`. Importing `yss.build` for `load_all` also imports render (Jinja2, markdown-it), evidence, hooks and visibility. docs/codemap.yaml records providers `depends_on: [dynamic, evidence]`, which is the reverse of the real edge (dynamic calls providers) and omits build.
    why_it_matters: |-
      The only cycle in the package is manufactured by module placement, and it is hidden from the code map. A provider written by a collection author (hooks providers) is documented as `collect(cfg, spec)`; the built-in ones show that the real recipe is 'import the build orchestrator', which is the heaviest module in the tree and the one whose import-time cost and side effects are least appropriate for a data collector.
    recommendation: |-
      Move `Loaded`, `load_all` and `cross_checks` to loader.py (build keeps importing them by name, so callers change one import line), have the providers import `from ..loader import load_all` at top level, and correct codemap `providers.depends_on` to [loader, evidence, symbols, visibility] with a note that dynamic is the caller.
    related_decision: ''
    checked: |-
      Confirmed: `Loaded`, `load_all` and `cross_checks` are in build.py; all three providers import `load_all` from `..build` inside the function body.
  - id: arch-providers-reload-per-source
    handle: AUD.19
    title: Every built-in provider re-runs a full load_all and re-derives target filtering on its own
    group: arch
    severity: medium
    rank: 3
    confidence: high
    location: |-
      yss/build.py:509, yss/dynamic.py:93, yss/providers/buildinfo.py:12-29, yss/providers/symbols.py:38-41, yss/providers/evidence.py:12-45
    observation: |-
      `build()` calls `write_all(cfg, target, out, only_on_build=True)` after it has already validated everything into `loaded`, but the provider contract `collect(cfg, spec)` carries no handle to that `Loaded`. buildinfo.collect, symbols._codemap_modules and evidence.collect therefore each call `load_all(cfg)` again: schema validation of every doc/page/prefab, `load_collection_configs` (which re-runs `configure()` hooks), `check_refs` and `cross_checks`. With this repository's site.yaml a `build --target all` performs the initial load plus buildinfo+symbols on public and buildinfo+symbols+symbolsource on private, i.e. five extra full loads. Each provider must also re-apply visibility itself: symbols.py:41 does `filter_for_target(loaded.docs, target)`, but buildinfo.collect ignores `spec['_target']` entirely, so the public `dynamic/buildinfo.json` reports `docs`, `docs_by_kind`, `pages` and `validation_errors` counted over the unfiltered set, including private docs.
    why_it_matters: |-
      The trust boundary (design c-visibility, adr-004) is applied once in `build()` and then has to be re-discovered by each provider; one of the three shipped providers does not. The cost is currently count-level only, but it is exactly the class of drift the `_target` injection (adr-024 consequence) was meant to close. The repeated loads also multiply the hook side effects described in arch-serve-stale-config.
    recommendation: |-
      Pass the build's already-filtered view to providers: extend the envelope `spec` with `_loaded` (the `Loaded` for that target, docs already `filter_for_target`-ed) when called from `build`, let `dynamic.collect` fall back to `load_all` only when it is absent (the `yss dynamic` and server paths), and make buildinfo count `spec['_loaded'].docs`. Add a test asserting public buildinfo counts exclude a private doc.
    related_decision: ''
    checked: |-
      Confirmed: `buildinfo.collect` calls `load_all(cfg)` and counts `loaded.docs` without consulting `spec['_target']`.
  - id: arch-renderer-god-object
    handle: AUD.20
    title: Renderer is one ~800-line class with ambient per-page state and a ctx dict other modules reach into
    group: arch
    severity: medium
    rank: 3
    confidence: high
    location: |-
      yss/render.py:84-164, yss/render.py:739-806, yss/build.py:433, yss/build.py:446, yss/build.py:523, yss/render.py:753-758, yss/render.py:806-810, yss/render.py:196-200, yss/render.py:288-290, yss/render.py:439-441, yss/render.py:455-460, yss/render.py:483, yss/render.py:632, yss/render.py:669-673, yss/render.py:734, yss/render.py:817-827
    observation: |-
