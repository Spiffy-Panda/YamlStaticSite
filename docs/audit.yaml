    commit: 33e8085 (`Put the sweep's deferred work in the plan`), working tree clean
    date: '2026-09-04'
    python: 3.12.10 on Windows 10
    validate: 'ok: 15 docs, 18 pages, 22 prefabs, 13 schemas'
    check: 166 claims, 0 stale, 0 warnings
    tests: 336 test functions in 30 files; exit 0 in 573 seconds wall-clock
    installed package: |-
      `pip show yss` reports 0.2.0 from a stale editable install; pyproject, `yss/__init__.py`, the changelog and the git tag all say 0.4.0
    coverage: 4 of 10 dimensions audited; 37 findings, 0 refuted; 19 strengths
    agents: 13 launched in the first run, 105 in the second; 3 returned
  executive_summary: |-
    **Verdict on the third that was audited: sound engineering with a consolidation debt, not a correctness problem.** The package is layered the way its own design document says it is, the extension contract for collections holds in the code, the hard logic is pure and constructor-injected, and the hygiene basics (types, exception boundaries, no mutable defaults, no reaching through private names) are better than most codebases this size. The prefab examples are rendered twice, once by a test and once by the public Reference page, so the presentation layer cannot silently break.

    Two findings are real behaviour defects an agent will hit. The dev server watches site.yaml, collection.yaml and hooks.py, announces a rebuild when they change, and then rebuilds against the `Config` and hooks module it loaded at startup (`arch-serve-stale-config`). And `yss query`, the command agents are told reads data the way pages do, builds a smaller binding context than the renderer and so returns an empty list for `$collections` on a site that has one (`arch-query-context-drift`). Both are hours of work.

    The larger cost is structural and deliberate to leave until the maintainer says otherwise: `build()` is one 251-line function and `Renderer` one 900-line class with ambient page state, which is why the test suite drives 91 whole-pipeline builds and takes nine and a half minutes. The same shape produces the smaller items: the trust rules for what a public build hides are spelled three times, the binding context twice, the card markup three times.

    On the front end, three small things fail the site's own standards: the primary navigation is unreachable on a phone without JavaScript, three controls draw white on the accent colour at 1.8 to 2.1 to 1 in dark mode, and the muted token colours 13-pixel text at 3.3 to 1 in the default light palette. Each is a one-line or one-decision fix.

    Six of ten dimensions remain unaudited. The first pass lost seven finders to the account's session limit, and its three surviving dimensions were fact-checked by the main agent rather than by independent verifiers; those notes sit under each card. Security was then audited with the full method: one finder, three adversarial verifiers per finding, eight findings kept and none refuted, three severities moved by the impact lens. Tests, error handling, schemas, packaging, docs drift and performance are the unexamined six; the second pass continues one dimension at a time as plan task m14-second-pass.
  overall_score: 3
  method: |-
    The audit was orchestrated as a workflow of read-only agents: ten dimension finders in parallel, a completeness critic naming gaps, a dedup editor, three adversarial verifiers per finding (fact, intent, impact; majority to survive) and a synthesis editor. Every agent was forbidden to write to the repository and told to cite repo-relative locations, to check docs/decisions.yaml and docs/design.yaml before calling a deliberate choice a defect, and that plan tasks m7-on-accent-rest and m13-emit depend on a design item on purpose.

    The first run lost all thirteen agents to the account's five-hour session limit after 356 seconds. The second run, launched after the limit reset, completed three finders (architecture, front end, code quality) and then lost the other seven finders, the critic, the dedup editor, every verifier and the synthesis editor to the same limit after 590 seconds and 2.05 million subagent tokens.

    What replaced the missing stages. Dedup was done by hand: three code-quality findings that restated an architecture finding were folded into it, with the second finder's facet appended to the observation. Verification was a single fact-lens pass by the main agent, which re-read every cited location at commit 33e8085, recomputed the four contrast ratios, and ran the `yss query` case live; its note sits under each finding as *Checked*. The intent lens was applied by the same agent using the decision log; no finding was refuted, two counts were corrected. The executive summary, scorecard verdicts, roadmap and worksheet questions were written by the main agent from the three reports.

    What this means for the reader. Each finding's factual claim has been checked twice, by the finder and the main agent, but not adversarially and not by an independent judge of severity. The severity ratings are the finders', unchanged. Seven dimensions have no findings because they were not examined, not because they are clean.

    Second pass, security (2026-09-05, commit b691f67). The full method ran for the first time: one finder with the brief from this doc's private notes, then three verifiers per finding (fact, intent, impact, at most four agents at once; a finding survives two of three, an info-level one needs the fact lens only). All eight findings survived. The impact lens moved three severities and the fact lens corrected several details; every correction is in the table at the end, and each finding's *Checked* line names the lenses that upheld it.
