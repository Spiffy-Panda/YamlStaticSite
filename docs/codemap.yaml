# Code map - schema: doc.codemap (python -m yss schema doc.codemap --yaml)
# Agents: when you add or move a module, update `modules` here. Paths are evidence; `yss check` fails if they vanish.
kind: codemap
id: codemap
title: YamlStaticSite code map
summary: Where each part of the toolchain lives, what it exports, and how to run it.
status: active
updated: 2026-09-04
related: [design]

roots:
  - path: yss/
    purpose: The toolchain package. Installable (`pip install -e .`) or run in place with `python -m yss`.
  - path: yss/schemas/
    purpose: Built-in JSON Schemas written as YAML - doc envelope and kinds, prefab, page, collection, site.
  - path: yss/prefabs/
    purpose: Built-in UI prefabs (Jinja2 template + params + CSS in one YAML file each).
  - path: yss/templates/
    purpose: Default page layout. A site overrides it with site/layouts/default.html.
  - path: yss/assets/
    purpose: Base stylesheet (tokens including --header-offset, the sticky-header scroll offset) and client runtime, copied into every build.
  - path: yss/providers/
    purpose: Built-in dynamic data providers (buildinfo, testruns, gitlog, evidence, symbols).
  - path: yss/skills/
    purpose: Canonical agent skills, shipped with the package; `yss init` / `yss skills --install` copy them into a repo.
  - path: docs/
    purpose: This repo's structured docs (the agent-first source of truth).
  - path: docs/_archive/
    purpose: Done-and-committed plan milestones. Underscore prefix means yss never loads it.
  - path: site/
    purpose: This repo's pages, site-local prefabs, layouts and static assets (including prototypes).
  - path: examples/demo-musing/
    purpose: A demo collection - collection.yaml, hooks.py, docs/, pages/, assets/, play/ - exercising the folder-per-musing contract.
  - path: schemas/
    purpose: Site-local schema additions or overrides (empty in the pilot).
  - path: tests/
    purpose: unittest suite; also collected by the `testruns` dynamic source.
  - path: .claude/skills/
    purpose: This repo's installed copies of the skills (kept identical to yss/skills/ by a test).

modules:
  - id: config
    path: yss/config.py
    purpose: site.yaml over defaults; collections discovered from root globs; targets, base URLs, vocabularies, limits, build and evidence policy, mounts, dynamic sources, redaction lists.
    language: python
    status: active
    exports:
      - {name: Config, kind: class, signature: "Config.load(root=None)", description: Finds site.yaml upwards from cwd.}
      - {name: Collection, kind: class, signature: "Collection(id, root, docs_dir, pages_dir, ...)", description: "id '' is the site root; vocab(cfg), limits(cfg) and evidence(cfg) merge overrides; hero and links carry the card contract."}
      - {name: Config.evidence_for, kind: function, signature: "(collection_id='') -> dict", description: "site.yaml evidence overridden by that collection's own block."}
      - {name: Collection.route_path, kind: function, signature: "(rel='') -> str", description: "Where a collection's files live, route prefix included - the one answer for assets, mounts, card links and emblems (adr-027)."}
      - {name: Config.collections, kind: function, signature: "() -> [Collection]"}
      - {name: Config.redaction_lists, kind: function, signature: "(target) -> (forbidden, flags)"}
      - {name: DEFAULTS, kind: constant, description: Includes the default vocabularies and limits.}
    tests: [tests/test_yss.py, tests/test_gh14.py, tests/test_gh18.py]
  - id: hooks
    path: yss/hooks.py
    purpose: "Load a hooks.py by path and call optional functions safely; provider lookup for `provider: hooks:<name>`."
    language: python
    status: active
    exports:
      - {name: load_hooks, kind: function, signature: "(path, root=None) -> module | None"}
      - {name: call, kind: function, signature: "(hooks, name, *args, default=None)"}
      - {name: provider, kind: function, signature: "(hooks, name) -> callable | None"}
    tests: [tests/test_yss.py]
  - id: loader
    path: yss/loader.py
    purpose: YAML loading (dates stay strings, `_` paths skipped), SchemaRegistry with x-vocab / x-limit resolution and annotation discovery, doc/page/prefab/collection loading, id indexes and reference checks.
    language: python
    status: active
    depends_on: [config, hooks]
    exports:
      - {name: SchemaRegistry, kind: class, signature: "SchemaRegistry(dirs).validate(instance, name, where, vocab, limits) -> [errors]"}
      - {name: SchemaRegistry.resolved, kind: function, signature: "(name, vocab, limits) -> schema", description: Cached deep copy with enums and maxLength filled in.}
      - {name: SchemaRegistry.annotations, kind: function, signature: "(name) -> {ref: {field: type}, evidence: {field: type}}"}
      - {name: load_docs, kind: function, signature: "(cfg, reg) -> (docs_by_id, errors)", description: Ids prefixed by collection; hook load_docs merged.}
      - {name: load_pages, kind: function, signature: "(cfg, reg) -> (pages, errors)", description: Routes prefixed by collection.}
      - {name: load_prefabs, kind: function, signature: "(cfg, reg) -> (prefabs_by_name, errors)"}
      - {name: check_refs, kind: function, signature: "(docs, reg, pages) -> [errors]", description: x-ref fields and inline references.}
      - {name: resolve_doc_id, kind: function, signature: "(ref, collection_id, docs) -> id | None", description: "Collection-local first, then exact; `/doc` forces root."}
    tests: [tests/test_yss.py]
  - id: symbols
    path: yss/symbols.py
    purpose: Resolve a code map export name to its line range by parsing the module, never importing it; handles dotted class members, module constants and package directories (adr-024).
    language: python
    status: active
    exports:
      - {name: index_for, kind: function, signature: "(root, rel) -> {name: (start, end)}", description: A file or a package directory; results cached by mtime.}
      - {name: file_index, kind: function, signature: "(path, rel=None) -> {name: (start, end)}"}
      - {name: lookup, kind: function, signature: "(root, rel, name) -> (start, end) | None"}
      - {name: supported, kind: function, signature: "(rel) -> bool", description: Only Python carries line ranges; anything else gets a plain file link.}
      - {name: SymbolError, kind: class, description: Carries a repo-relative path only - the message reaches build output.}
      - {name: SUPPORTED_SUFFIXES, kind: constant}
    tests: [tests/test_yss.py]

  - id: evidence
    path: yss/evidence.py
    purpose: Collect and evaluate evidence claims; git recency; inject `_evidence` freshness; format reports. Policy resolves per doc - CLI flag, then collection.yaml, then site.yaml.
    language: python
    status: active
    depends_on: [config, loader, symbols]
    exports:
      - {name: check, kind: function, signature: "(cfg, docs, reg, run_commands=None, git_recency=None) -> EvidenceReport", description: "None means use the configured policy for each doc's collection."}
      - {name: inject, kind: function, signature: "(docs, report) -> None"}
      - {name: Claim, kind: class}
      - {name: _check_export, kind: function, signature: "(cfg, claim) -> None", description: "`x-evidence: export` - resolves `<path>::<name>` by parsing (adr-024)."}
    tests: [tests/test_yss.py]
  - id: visibility
    path: yss/visibility.py
    purpose: filter_for_target, is_visible, scan_tree, slugify.
    language: python
    status: active
    exports:
      - {name: filter_for_target, kind: function, signature: "(data, target) -> data"}
      - {name: scan_tree, kind: function, signature: "(root, forbidden, flags) -> (hits, flag_hits)"}
    tests: [tests/test_yss.py]
  - id: binding
    path: yss/binding.py
    purpose: Resolve binding specs against docs; where/sort/limit/map/fields/group_by in that order; collection-local ids; virtual roots, including the doc-local $items that flattens a doc's type arrays and tags each item `_type`.
    language: python
    status: active
    exports:
      - {name: resolve_binding, kind: function, signature: "(spec, ctx, render=None, warn=None, stats=None) -> value", description: "Pass `stats` to learn candidates/shown without resolving twice (gh-29)."}
      - {name: doc_items, kind: function, signature: "(doc) -> [item + _type]", description: "Every item of every type array in one doc, tagged with the array it came from (adr-025)."}
      - {name: is_binding, kind: function, signature: "(value) -> bool"}
    tests: [tests/test_yss.py, tests/test_gh12.py, tests/test_gh30.py]
  - id: attribution
    path: yss/attribution.py
    purpose: Turn a section spec into a sentence naming the doc, the query and the counts behind a rendered region. Pure - no rendering, no re-resolution - so the phrasing is unit tested on spec dictionaries.
    language: python
    status: active
    depends_on: [binding]
    exports:
      - {name: attribute, kind: function, signature: "(sec, page, docs, collection, counts, detail) -> Attribution", description: "Picks a headline among several bindings, or names them all rather than choosing silently."}
      - {name: describe, kind: function, signature: "(spec, docs, collection, counts, detail) -> str", description: "One binding as a phrase; `detail=False` drops the filter half for the public target."}
      - {name: binding_specs, kind: function, signature: "(sec) -> [(arg_name, spec)]"}
    tests: [tests/test_gh29.py]
  - id: render
    path: yss/render.py
    purpose: Renderer - Jinja env, prefab(), section handlers, inline reference expansion, pluggable markdown, collection context, render_page.
    language: python
    status: active
    depends_on: [attribution, binding, config, hooks, loader, symbols, visibility]
    exports:
      - {name: Renderer, kind: class, signature: "Renderer(cfg, target, docs, pages, prefabs, all_doc_ids, build_info, evidence)"}
      - {name: Renderer.prefab, kind: function, signature: "(name, *dicts, **kwargs) -> Markup"}
      - {name: Renderer.expand_refs, kind: function, signature: "(text) -> text", description: "Inline references to markdown links."}
      - {name: Renderer._nav_groups, kind: function, signature: "(items, collection_items=None) -> [{id, label, menu, items, waiting}]", description: "Nav clusters from site.yaml nav.groups; the reserved `collections` group takes its members from collection_items and is appended when unlisted (adr-028); empty groups are dropped."}
      - {name: Renderer._collection_nav, kind: function, signature: "(current_cid='') -> [item]", description: "Collections as nav items, ordered by (order, title), with `active` set explicitly (adr-028)."}
      - {name: Renderer._emblem_url, kind: function, signature: "(collection) -> str | None", description: "Route-resolved emblem href, None for a literal glyph (adr-027)."}
      - {name: Renderer._page_state, kind: function, signature: "(page) -> {archived, waiting}", description: "Derived from the docs a page presents - drives what the nav shows (adr-022)."}
      - {name: route_to_path, kind: function, signature: "(out_dir, route) -> Path"}
    tests: [tests/test_yss.py, tests/test_gh14.py, tests/test_gh18.py]
  - id: build
    path: yss/build.py
    purpose: load_all (validate, collection configs, refs, cross checks) and build (filter, evidence, hooks, render, export, assets, mounts, dynamic, manifest, dead-link gate, scan), holding an advisory lock on the output directory so two builders cannot race on one dist/.
    language: python
    status: active
    depends_on: [config, dynamic, evidence, hooks, loader, render, visibility]
    exports:
      - {name: load_all, kind: function, signature: "(cfg) -> Loaded"}
      - {name: build, kind: function, signature: "(cfg, target, out_dir=None, strict=False, run_dynamic=True, loaded=None, check_evidence=True) -> BuildReport"}
      - {name: _dead_links, kind: function, signature: "(rendered, out, base_url) -> [str]", description: "Local href/src on rendered pages that the output does not carry (adr-027)."}
      - {name: output_ok, kind: function, signature: "(report) -> bool", description: "Did the build's own build.json survive? The summary is in-memory counts and cannot tell (adr-029)."}
    tests: [tests/test_yss.py, tests/test_gh14.py, tests/test_gh19.py]
  - id: dynamic
    path: yss/dynamic.py
    purpose: Collect dynamic sources (provider, hooks provider, command, file) into the JSON envelope.
    language: python
    status: active
    depends_on: [config, hooks]
    exports:
      - {name: collect_envelope, kind: function, signature: "(cfg, name, spec) -> dict"}
      - {name: write_all, kind: function, signature: "(cfg, target, out_dir, names=None, only_on_build=False) -> {name: envelope}"}
  - id: providers
    path: yss/providers/
    purpose: buildinfo (counts), testruns (unittest in a subprocess), gitlog (recent commits), evidence (claims incl. commands), symbols (code map export line ranges).
    language: python
    status: active
    depends_on: [build, evidence, symbols, visibility]
    exports:
      - {name: buildinfo.collect, kind: function}
      - {name: testruns.collect, kind: function, description: "Also runnable: python -m yss.providers.testruns tests"}
      - {name: gitlog.collect, kind: function}
      - {name: symbols.collect, kind: function, description: "Export line ranges for the target's visible code map modules."}
      - {name: symbols.collect_source, kind: function, description: "The same ranges plus the lines; refuses a redacting target."}
      - {name: evidence.collect, kind: function}
  - id: server
    path: yss/server.py
    purpose: SiteHandler (prefix stripping, background dynamic refresh, COOP/COEP), make_server, rebuild, serve with watch loop.
    language: python
    status: active
    depends_on: [build, config, dynamic]
    exports:
      - {name: serve, kind: function, signature: "(cfg, watch=True, host=None, private_port=None, public_port=None, targets=('private','public'))"}
      - {name: make_server, kind: function, signature: "(cfg, target, host, port, live) -> ThreadingHTTPServer"}
    tests: [tests/test_yss.py]
  - id: scaffold
    path: yss/scaffold.py
    purpose: Skeleton generation from resolved schemas for `yss new` and `yss init` (which also installs skills and a starter CLAUDE.md).
    language: python
    status: active
    depends_on: [config, loader, skillpack]
    exports:
      - {name: new_doc, kind: function}
      - {name: new_page, kind: function}
      - {name: new_prefab, kind: function}
      - {name: init_site, kind: function}
  - id: skillpack
    path: yss/skillpack.py
    purpose: "Canonical agent skills live in yss/skills/; `yss skills` installs or checks the copies in a repo's .claude/skills/."
    language: python
    status: active
    exports:
      - {name: install, kind: function, signature: "(root, force=False) -> [(name, status)]"}
      - {name: check, kind: function, signature: "(root) -> [(name, status)]"}
    tests: [tests/test_yss.py]
  - id: ghpages
    path: yss/ghpages.py
    purpose: "`pages-setup` - gh CLI wrapper that stores redaction secrets and sets the Pages source to GitHub Actions."
    language: python
    status: active
    depends_on: [config, visibility]
    exports:
      - {name: setup, kind: function, signature: "(cfg, repo=None, dry_run=False, secrets=True, pages=True, run_workflow=False) -> [messages]"}
  - id: cli
    path: yss/cli.py
    purpose: argparse front end for every command; paired flags (--strict/--no-strict, --git/--no-git, --run-commands/--no-run-commands) default to None so config decides; fails a build whose output vanished underneath it.
    language: python
    status: active
    depends_on: [binding, build, config, dynamic, evidence, ghpages, loader, scaffold, server, skillpack, visibility]
    exports:
      - {name: main, kind: function, signature: "(argv=None) -> int"}
  - id: client
    path: yss/assets/yss.js
    purpose: Dynamic section rendering and nav toggle; exposes window.yss. The worksheet's script ships with its prefab. Scroll offsetting is CSS-only (--header-offset in yss.css), never scripted.
    language: javascript
    status: active
  - id: layout
    path: yss/templates/default.html
    purpose: Default layout - header nav as ordered groups (labelled clusters, optional details menus, waiting counts) including the collections group, de-duplicated title crumbs, collection bar with emblem, theme and sub-nav, page header with freshness badge, sections, toc, footer.
    language: jinja
    status: active

entrypoints:
  - id: e-validate
    name: Validate
    command: python -m yss validate
    module: cli
    description: Schema-check every structured file, collection config and reference. Run after every edit.
  - id: e-check
    name: Check evidence
    command: python -m yss check [--run-commands] [--strict] [-v]
    module: cli
    description: Prove cited paths, symbols and commands; exit 1 on stale claims.
  - id: e-refs
    name: References
    command: python -m yss refs plan#m7-search
    module: cli
    description: Inbound references to a doc or item.
  - id: e-build
    name: Build
    command: python -m yss build [--target public|private|all] [--no-dynamic] [--strict]
    module: cli
  - id: e-serve
    name: Serve
    command: python -m yss serve [--no-watch]
    module: cli
    description: Private on 8800, public preview on 8801 under /YamlStaticSite/.
  - id: e-query
    name: Query
    command: python -m yss query plan.milestones --where status=active --fields id,title
    module: cli
    description: Read structured data the way pages do.
  - id: e-ls
    name: Inventory
    command: python -m yss ls [docs|pages|prefabs|kinds|dynamic|collections]
    module: cli
  - id: e-tests
    name: Tests
    command: python -m unittest discover -s tests -v
    module: cli
  - id: e-new
    name: Scaffold
    command: python -m yss new doc <kind> <id> | new page <id> [--doc <id>] | new prefab <name>
    module: scaffold
  - id: e-skills
    name: Skills
    command: python -m yss skills [--install] [--force]
    module: skillpack
    description: Check or install the agent skill suite into .claude/skills/.
  - id: e-pages
    name: Pages setup
    command: python -m yss pages-setup [--dry-run] [--run]
    module: ghpages
    description: One-time GitHub setup via gh - secrets from .yss/local.yaml, Pages source = Actions.

conventions:
  - id: cv-ids
    rule: Ids are lowercase slugs, stable forever, unique within a doc. Pages, references and evidence all rely on them.
    enforced_by: validate
  - id: cv-private
    rule: "Anything not for the public site is either `visibility: private` or under `private_notes`; never rely on the scan alone."
    enforced_by: none
  - id: cv-no-abs-paths
    rule: Nothing that ends up in dist/ may contain an absolute path.
    rationale: The checkout path contains personal information; the public build forbids it automatically.
    enforced_by: scan
  - id: cv-verify
    rule: "Every plan task carries `verify`; when a path or command can prove it, add an `evidence:` claim too."
    enforced_by: none
  - id: cv-archive
    rule: Done-and-committed milestones move to docs/_archive/; the plan holds open work only; the changelog is the history.
    enforced_by: none
  - id: cv-local-first
    rule: "Inside a collection, doc ids resolve to the local doc first; use `/doc` to reach a root doc that shares the name."
    enforced_by: validate
  - id: cv-generated
    rule: Never cite generated or gitignored paths (dist/) as evidence; a fresh clone must satisfy every claim.
    rationale: CI runs `yss check` on a clean checkout, so claims about build output are always stale there.
    enforced_by: check
  - id: cv-prefab-css
    rule: Prefab CSS is scoped under a class named after the prefab and uses the shared tone variables.
    enforced_by: none
  - id: cv-release
    rule: "The commit that closes an issue sweep carries the version bump: pyproject.toml, yss/__init__.py and a released changelog entry move together, and the tag is cut on that commit."
    rationale: Two materially different trees reporting the same version give a consumer no signal at all - no tag, no version, no error - which is how nineteen fixes stayed invisible behind v0.2.0.
    enforced_by: test
