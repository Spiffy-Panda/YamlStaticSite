# Plan document - schema: doc.plan (python -m yss schema doc.plan --yaml)
# Current work only. Milestones that are done AND committed move to docs/_archive/ (not loaded);
# the changelog records what shipped. Keep ids stable; pages and references point at them.
kind: plan
id: plan
title: YamlStaticSite plan
summary: Forward plan for the yss toolchain. Shipped work lives in the changelog and docs/_archive/; this file holds only what is open - the source reader, the prototype mounts, hardening, and the Musings adoption.
status: active
updated: 2026-09-04
owners: [panda, agent]
tags: [toolchain, docs, static-site]
related: [design, codemap, decisions, verdicts, pending]
agent_notes: |
  Statuses come from `work_status` (planned | active | blocked | done | dropped). Every task carries
  `verify` (a command or observation) and, where a path or command can prove it, an `evidence:` claim
  that `yss check` runs. When a milestone is done and committed, move it to docs/_archive/ and add a
  changelog line. Questions only the human can answer go to open_questions and the verdicts worksheet.

goals:
  - Structured YAML files replace PLAN.md, DESIGN.md, the code map and the decision log as the source of truth agents read and write.
  - A human-facing site is generated from those files plus a thin framing layer (pages) that decides what to show and how.
  - Two build targets from one source tree - a redacted public build for GitHub Pages and a private build for local use.
  - Reusable UI prefabs are filled from lists in the structured files, never hand-written HTML.
  - Docs prove they are current - cited paths, symbols and commands are checked, and stale claims fail the build.
  - Folder-per-topic repositories (musings) are first-class through collections with per-collection config and hooks.

non_goals:
  - A general purpose CMS or blog engine.
  - Client-side rendering of the main content; pages must be readable with JavaScript disabled.
  - Supporting XML or XSLT pipelines (rejected after earlier repos, see the decision log).

milestones:
  - id: m9-source-reader
    title: Click-to-source in the code map
    status: active
    priority: 2
    summary: An export in the code map opens its own source at the lines it occupies, without a copy of the tree in dist/.
    done_when: Every code map export links to its own line range at a pinned commit, opens in place on both targets, and a moved export fails `yss check`.
    notes: |
      Shipped by [[decisions#adr-024]]. The line range is parsed, never imported, so constants and
      dotted members such as `Config.evidence_for` resolve; the public target fetches the source at
      the pinned commit and the private target reads the working tree. Reviewed against the
      alternatives before building - an iframe of the hosting service is impossible, a generated
      mirror duplicates the package into the public build.
    tasks:
      - id: m9-resolver
        title: Parse a module to a symbol line range, shared by the checker and the site
        status: done
        owner: agent
        verify: python -m unittest tests.test_yss.SymbolResolverTests -v
        evidence: [{path: yss/symbols.py, contains: "def index_for"}]
      - id: m9-sources
        title: Publish the index on both targets and the source text on the private target only
        status: done
        owner: agent
        verify: python -m yss build --target all && ls dist/public/dynamic dist/private/dynamic
        evidence: [{path: yss/providers/symbols.py, contains: "def collect_source"}]
      - id: m9-pinning
        title: Give the build its commit so a line anchor is only published when pinned and clean
        status: done
        owner: agent
        verify: python -m unittest tests.test_yss.BuildCommitTests -v
        evidence: [{path: yss/build.py, contains: "def git_commit"}]
      - id: m9-reader
        title: Upgrade the export link into an in-page source pane, falling back to the link
        status: done
        owner: agent
        verify: python -m yss build --target public --no-dynamic && grep -c export-link dist/public/codemap/index.html
        evidence: [{path: yss/prefabs/module-list.yaml, contains: "export-link"}]
      - id: m9-export-evidence
        title: Prove every code map export with `yss check` rather than leaving a dead link
        status: done
        owner: agent
        verify: python -m yss check -v
        evidence: [{path: yss/evidence.py, contains: "def _check_export"}]
      - id: m9-offline
        title: Decide whether a generated source mirror is worth shipping for the offline case
        status: planned
        owner: panda
        notes: |
          Deliberately unanswered. The reader needs the network on the public target and dies if the
          repository ever goes private; a mirror in `dist/` fixes both and costs the duplication
          [[decisions#adr-024]] declined. No mirror is built until that trade is actually felt.

  - id: m6-prototypes
    title: Prototype hosting
    status: planned
    priority: 5
    summary: Host wasm and Godot web exports through collection mounts, exported without threads so no isolation headers are needed.
    done_when: A threadless Godot 4 web export runs inside a collection page on both the private server and GitHub Pages, and the bandwidth cost of hosting it publicly has been decided.
    notes: |
      Deliberately late (2026-09-02). A Godot web export is tens of megabytes and Pages bandwidth is
      metered against the account, so publishing one is a cost decision, not just a build step.
      Threadless exports are the rule; see [[decisions#adr-016]] and [[#r-headers]].
    tasks:
      - id: m6-godot
        title: Add a threadless Godot export as a collection mount and confirm it runs without COOP/COEP
        status: planned
        owner: panda
        notes: Export with threads off; the private server's headers must not be what makes it work.
      - id: m6-bandwidth
        title: Decide when a Godot export may carry the public target on its mount, given Pages bandwidth cost
        status: blocked
        owner: panda
        depends_on: [m6-godot]
        notes: |
          Deliberately unanswered (O.2, 2026-09-02): no rule is written until a real export exists
          and its size has been measured, so no Godot export carries the public target until then.
          Private-only mounts are unaffected, and mounts stay private by default regardless
          ([[decisions#adr-015]]). [[#m6-godot]] produces the export this call needs.
      - id: m6-serve-mounts
        title: Serve-mode mounts (private server maps a URL to a source folder without copying)
        status: planned
        owner: agent
        verify: python -m yss serve --no-watch
      - id: m6-export-import
        title: Dynamic sections that download and upload JSON (prototype state)
        status: planned
        owner: agent
      - id: m6-mount-filters
        title: include/exclude patterns on a mount so a folder can publish some files and not others
        status: done
        owner: agent
        notes: |
          Shipped 2026-09-03. `include` restricts, `exclude` removes and always wins, patterns are
          matched relative to the mount path with pathlib glob semantics (`*.html` top level,
          `**/*.html` recursive, a trailing `/` naming a whole subtree). A mount with neither key
          still copies the whole tree byte for byte. Issue 3.
        verify: python -m yss build --target all --no-dynamic
        evidence:
          - {path: tests/test_gh02_03_04.py}
          - {path: yss/schemas/collection.schema.yaml, contains: exclude}
  - id: m7-hardening
    title: Hardening and ergonomics
    status: planned
    priority: 4
    summary: Things consciously left out so far, now ranked in the order they get picked up - search, reverify, watchdog, kinds, run-commands.
    tasks:
      - id: m7-search
        title: Client-side search index over docs.json
        status: planned
        owner: agent
        notes: |
          First in the m7 order (P.7, 2026-09-02). O.3 then ranked the rest - reverify, watchdog,
          kinds, run-commands - so the whole milestone is wanted and nothing in it was dropped.
      - id: m7-new-collection
        title: "`yss new collection <id>` - the one structural unit with no scaffold"
        status: done
        owner: agent
        verify: python -m yss new collection --help
        links:
          - {label: 'Issue #1', href: 'https://github.com/Spiffy-Panda/YamlStaticSite/issues/1', kind: issue}
        notes: |
          Shipped 2026-09-03. `yss new collection <id>` scaffolds collection.yaml, docs/plan.yaml and
          pages/index.yaml under the site's configured collection root, and fails clearly when that
          root is missing or ambiguous. Building it also surfaced an argparse bug: the subparser flag
          was clobbering the top-level `--root`, so the flag is `--collections-root`. Issue 1.
        evidence:
          - {path: tests/test_gh01.py}
          - {symbol: yss.scaffold:new_collection}

      - id: m7-group-ref-mode
        title: "`x-ref: group` so an item's `group:` can only name a declared group"
        status: planned
        owner: agent
        notes: |
          `group:` is validated with `x-ref: item`, which proves the id exists somewhere in the doc -
          so `group: c-config`, naming a component, passes. Constraining it needs a new ref mode in
          the loader. Surfaced by the subject-grouping work (gh-8, 2026-09-03) and left open.
        verify: python -m yss validate
      - id: m7-card-link-routes
        title: Check that a relative card link in collection.yaml resolves to a real route
        status: planned
        owner: agent
        notes: |
          Approved as N.3 (2026-09-03; [[decisions#adr-021]]). `links.href` already carries
          `x-evidence: route`, but the evidence checker only walks docs and only knows path, glob,
          symbol and command claims, so nothing reads that annotation yet. Routes exist only after
          pages load, so the claim has to be evaluated with the route table in hand rather than
          from a doc alone. Mount contents and external hrefs stay unchecked on purpose.
        verify: python -m yss check -v
        evidence:
          - {path: yss/schemas/collection.schema.yaml, contains: "x-evidence: route"}
      - id: m7-watchdog
        title: Optional watchdog-based file watching instead of polling
        status: planned
        owner: agent
        notes: Third in the m7 order (O.3, 2026-09-02).
      - id: m7-kinds
        title: Promote recurring `generic` shapes into real doc kinds
        status: planned
        owner: agent
        notes: Fourth in the m7 order (O.3, 2026-09-02); still only worth doing once a shape repeats.
      - id: m7-reverify
        title: "`yss reverify <doc>` - bump `updated` after the human confirms the doc still holds"
        status: planned
        owner: agent
        notes: |
          Chosen over simply accepting the noise (P.8, 2026-09-02); [[#r-evidence-noise]] stays open
          until it ships. Second in the m7 order behind [[#m7-search]] (O.3, 2026-09-02).
        verify: python -m yss reverify --help
      - id: m7-verify-evidence
        title: Optional CI job that runs `yss check --run-commands` so task verify commands are executed
        status: planned
        owner: agent
        notes: Last in the m7 order (O.3, 2026-09-02); every m7 item is now wanted, none dropped.
        verify: cat .github/workflows/pages.yml
      - id: m7-open-item-checks
        title: "`yss check` rules for `options`: an `open` item with none, and options on a `live` one"
        status: planned
        owner: agent
        notes: |
          Deferred out of the gh-27 sweep on purpose (2026-09-04). An `open` item with no options
          is an unfinished question and one carrying options at `status: live` is stale, so both
          are checkable - but both would fail docs that are legal today, so adopting them is a
          decision about existing content rather than a pure addition. Wanted, not urgent.
        verify: python -m yss check -v
      - id: m7-on-accent-rest
        title: Finish the on-accent token pass - `.nav-count`'s hard-coded #fff, and the pill's own text colour
        status: blocked
        owner: agent
        depends_on: [design/k-on-accent]
        notes: |
          Left out of gh-26 deliberately (2026-09-04): same class of defect as the collection bar,
          different component, and nothing has reported it. `.nav-count` hard-codes `color: #fff`,
          which no theme can reach; a theme overriding `--on-accent-2-surface` may also want its own
          colour for the active pill's text, which still takes `--accent`.

          The engineering audit ([[audit]], 2026-09-04) found two more sites in the same class:
          `.ws-n` and `.ws-go` in yss/prefabs/worksheet.yaml hard-code `#fff` on `--accent` and
          measure 2.09:1 on the stock dark palette and 1.80:1 on the bamboo dark theme. Whatever
          k-on-accent decides has to cover them too.

          Blocked on a call, not on code: [[design#k-on-accent]] is `status: open` and its two
          options are exactly this question - extend the token set everywhere, or add a token only
          where a theme has demonstrably been unable to reach. Answer that first ([[decisions#adr-031]]).
      - id: m7-flow-overrides
        title: "Config and CLI overrides for the flow: build.strict in site.yaml, --no-strict, evidence.git_recency per collection"
        status: done
        owner: agent
        notes: Approved as P.1 and applied 2026-09-02; see [[decisions#adr-014]].
        verify: python -m yss schema site --yaml
        evidence:
          - {path: yss/schemas/site.schema.yaml, contains: "build:"}
          - {path: yss/schemas/collection.schema.yaml, contains: "Evidence policy for this collection"}
          - {path: yss/config.py, contains: "def evidence_for"}
          - {path: yss/cli.py, contains: "--no-strict"}
          - {path: yss/evidence.py, contains: "def _policy"}

  - id: m12-musings
    title: Adopt yss in the Musings repository
    status: planned
    priority: 2
    summary: Migrate one musing at a time through collections; the old site generator is retired last (see decision adr-010).
    done_when: Every musing is a collection, build_site.py is deleted, and the audited Pages workflow builds with yss.
    tasks:
      - id: m12-collection-id
        title: Let collection.yaml set the collection id so an existing URL slug survives the move
        status: done
        owner: agent
        notes: |
          Shipped 2026-09-03. `collection.yaml: id:` overrides the folder name; it is slug-checked,
          and two collections claiming the same id fail to load with both folder names in the
          message. Everything keyed off the id follows - doc-id prefix, page ids, routes and
          `[[doc#item]]` resolution - because nothing hardcoded the folder name. Issue 2.
        verify: python -m yss ls collections
        evidence:
          - {path: tests/test_gh02_03_04.py}
          - {path: yss/schemas/collection.schema.yaml, contains: "id:"}
      - id: m12-route-prefix
        title: A URL prefix for collections so they can sit under /musings/ instead of the site root
        status: done
        owner: agent
        notes: |
          Shipped 2026-09-03 as `at:` on the site.yaml `collections[]` entry rather than per
          collection, because the need is a property of the group - nine sibling musings under
          `/musings/` is one line, not nine. Defaults to empty, so a collection that does not use
          it routes exactly as before. Mount output moved to the same prefix as its pages. Issue 4.
        verify: python -m yss build --target all --no-dynamic
        evidence:
          - {path: tests/test_gh02_03_04.py}
          - {path: yss/config.py, contains: route_prefix}
      - id: m12-first
        title: Migrate the space cargo cannon musing first and compare the rendered result
        status: planned
        owner: agent
        depends_on: [m12-collection-id, m12-route-prefix]
        notes: The first migration is what proves the two route changes above; it should not start before them.
      - id: m12-renderer
        title: Plug the existing Musings renderer in through markdown.renderer or hooks.py markdown()
        status: planned
        owner: agent
        notes: |
          Confirmed as P.5 (2026-09-02). The Musings renderer stays authoritative for the whole
          migration so no page changes appearance while it moves; retiring it is [[#m12-retire]]'s
          business, not this task's. Changes inside the Musings repository are out of scope for yss.
      - id: m12-retire
        title: Retire build_site.py once every musing renders through yss
        status: planned
        owner: panda

  - id: m13-attribution
    title: Per-item source attribution
    status: planned
    priority: 4
    summary: A card says which file *it* came from, not just which query built the region around it.
    done_when: A `$docs`-fed grid and a `group-sections` region both show per-card provenance, and each of the eleven item prefabs has a test for it.
    notes: |
      Region-level attribution shipped in 0.4.0 ([[decisions#adr-033]]) and is the honest unit
      almost everywhere - a card grid *is* one query. It is wrong only where a region genuinely
      spans several docs, which is a `$docs`-fed grid (site/pages/index.yaml) or a
      `group-sections` region.

      The cheap half is already done: [[#m13-reserved]] shipped with gh-30, so a prefab written
      today can read `_src` without the emission existing yet. That was the whole point of doing it
      early - the convention is written down in the `yss-prefab` skill, so prefabs authored during
      the Musings port land compatible either way.

      Deliberately not started (2026-09-04). Roughly a day for the set, half a day for the first
      two; do it when a region demonstrably needs it, not before.
    tasks:
      - id: m13-reserved
        title: Stamp `_src` and `_doc` onto bound items so prefabs can read them
        status: done
        owner: agent
        notes: |
          Shipped 2026-09-04 with gh-30. Stamped onto copies in `doc_items` and `resolve_binding`,
          never in place - the build dumps docs to `data/docs/<id>.json` after rendering, so an
          in-place stamp would have put `_src` in every export. `fields:` drops them by design and
          virtual roots never carry them.
        verify: python -m unittest discover -s tests -p test_gh30.py
        evidence:
          - {path: tests/test_gh30.py}
          - {path: yss/binding.py, contains: _source_stamp}
      - id: m13-emit
        title: "Emit `data-src` from the eleven item prefabs that receive a whole item"
        status: planned
        owner: agent
        depends_on: [m13-reserved]
        notes: |
          `card`, `table`, `module-list`, `task-list`, `decision-list`, `term-list`, `timeline`,
          `changelog-list`, `status-board`, `bullet-list` and `steps` - a line each and a test each.
          Only prefabs that receive the whole item dict get it for free; ones reading named fields
          need the key threading through. `group_by` yields bucket dicts rather than items, so a
          prefab rendering groups has to read through to `items`.
        verify: python -m yss build --target all --no-dynamic
      - id: m13-trigger
        title: Decide whether a $docs-fed grid or a group-sections region actually needs per-card provenance
        status: planned
        owner: panda
        notes: |
          The gate on [[#m13-emit]], not a formality. Region-level attribution may simply be
          enough; the answer is worth having from a real page rather than in advance.

  - id: m14-audit
    title: Act on the engineering audit
    status: active
    priority: 3
    summary: The work the 2026-09-04 engineering audit found - two behaviour defects, a bundle of front-end fixes, the consolidations, the orchestration refactor - plus the second pass over the seven dimensions the audit could not examine.
    done_when: Every task below is done or dropped by a recorded call, and docs/audit.yaml's scorecard shows a score for all ten dimensions.
    notes: |
      Source: [[audit]] (three of ten dimensions, every finding fact-checked at 33e8085) and the
      calls in [[audit-calls]]. Finding ids are quoted in backticks; they are data in the audit
      doc, not indexed items. Tasks marked `blocked` wait on a worksheet call, not on code. The
      first task is the second pass, because the unexamined seven include security and tests.
    tasks:
      - id: m14-second-pass
        title: Audit the seven dimensions the first pass could not reach
        status: active
        owner: agent
        notes: |
          Error handling, tests, security and redaction, schemas, packaging and CI, docs drift,
          performance. Unblocked by A.1 in [[audit-calls]] (2026-09-04): one dimension at a
          time, each verified before the next starts, resumed on a timer ten hours after the
          audit was published. The briefs, the order and the verification rules are in the
          private notes of [[audit]]; the method section there says which stages never ran
          the first time. Security goes first.
        verify: docs/audit.yaml scorecard shows a score for all ten dimensions
      - id: m14-serve-reload
        title: Make the dev server rebuild against the files on disk
        status: planned
        owner: agent
        notes: |
          `rebuild()` reuses the one `Config`; `collections()` memoises; `hooks._cache` is keyed
          by path only; `configure()`'s result is written back onto the shared Collection.
          Construct a fresh Config per rebuild, key the hooks cache by (path, mtime) as
          `symbols.index_for` does, apply configure() to a copy. `arch-serve-stale-config`.
        verify: A test edits collection.yaml between two rebuild() calls and the second build sees the change
      - id: m14-query-context
        title: One binding context for the renderer and `yss query`
        status: planned
        owner: agent
        notes: |
          `cmd_query` builds five roots, `Renderer.__init__` nine, so `yss query '$collections'`
          prints `[]` here. One `binding_context(...)` for both, `resolve_from` raises on a root
          the context lacks, and a `--collection` flag. `arch-query-context-drift`.
        verify: python -m yss query '$collections' --fields id
      - id: m14-provider-loaded
        title: Hand providers the build's filtered load instead of reloading
        status: planned
        owner: agent
        notes: |
          Each built-in provider calls `load_all(cfg)` again and re-derives target filtering;
          buildinfo ignores `_target`, so public counts include private docs. Pass the target's
          filtered `Loaded` in the spec from `build()`, fall back to `load_all` elsewhere.
          `arch-providers-reload-per-source`.
        verify: A test asserts public dynamic/buildinfo.json doc counts exclude a private doc
      - id: m14-load-facade
        title: Move `Loaded`, `load_all` and `cross_checks` into loader.py
        status: planned
        owner: agent
        notes: |
          Removes the only import cycle (providers reach back into build.py with function-level
          imports). build.py keeps re-exporting the names. Code map `depends_on` for providers
          then reads [loader, evidence, symbols, visibility]. `arch-load-facade-in-build`.
        verify: python -c "from yss.loader import load_all, Loaded, cross_checks"
      - id: m14-visibility-owner
        title: Give the public-hides-private and mount-default rules one owner
        status: planned
        owner: agent
        notes: |
          `hidden_collections` in build.py, the collections filter in Renderer, `is_visible`,
          the `or ["private"]` mount default in two files and `_resolve_source` restating
          `cross_checks`. `Collection.visible_in(target)`, a mount-targets helper and
          `Config.resolve_dynamic_source()`. `arch-visibility-rules-spelled-thrice`.
        verify: Select-String -Path yss\build.py,yss\render.py -Pattern 'or \["private"\]' returns nothing
      - id: m14-frontend-fixes
        title: The front-end fixes that need no decision
        status: planned
        owner: agent
        notes: |
          `var(--border)` to `var(--line)` in collection-index; a noscript note in dynamic
          sections and beside the worksheet actions; aria-label on the worksheet's free-text
          controls; a thead on module-list's exports table; `.empty` and the five `tone-*`
          classes into yss.css; a `level` param for worksheet and decision-list and a 2 to 6
          clamp in card; a test that every prefab selector starts with the prefab's class or a
          declared prefix, then cv-prefab-css to `enforced_by: test`.
          `frontend-undefined-border-token`, `frontend-no-js-degradation-note-missing`,
          `frontend-a11y-names-headers-outline`, `frontend-prefab-css-scope-not-enforced`.
        verify: python -m yss build --target all --no-dynamic
      - id: m14-card-consolidation
        title: Render every collection card through the `card` prefab
        status: planned
        owner: agent
        notes: |
          collection-index hand-writes the card markup with a hard-coded h3; yss.js writes it a
          third time. Two optional slots on card (`image`, `links`) and collection-index calls
          `prefab('card', ...)`. Do this before [[plan#m13-emit]] so `data-src` is written once.
          `frontend-card-markup-duplicated-three-ways`.
        verify: Select-String -Path yss\prefabs\collection-index.yaml -Pattern '<article' returns nothing
      - id: m14-typed-warnings
        title: Typed build warnings and one CLI failure formatter
        status: planned
        owner: agent
        notes: |
          Warnings are strings, so strict gating keeps parallel lists (five append sites); the
          `validation failed:` block is copied three times to stdout while other commands use
          stderr. A warning record with a kind on BuildReport; `_fail()` in cli.py.
          `quality-string-warnings-parallel-lists`, `quality-cli-error-streams`.
        verify: A failing `python -m yss validate` prints nothing to stdout and exits 1
      - id: m14-consolidations
        title: The small consolidations
        status: blocked
        owner: agent
        notes: |
          Delete the seven dead names; `Config.doc_roots(doc)` and `Config.rel(path)`; one YAML
          loader for config.py and loader.py; `Config.markdown`, `Config.redaction`,
          `Config.hooks_path`; a `yss/meta.py` naming the reserved keys and `evidence.worst()`
          used by render.py; a `Provider` alias and a `Hooks` protocol; and the evidence import
          fallback bounded per A.5 in [[audit-calls]], which is the only part that is blocked -
          the rest can start. `quality-dead-names`, `quality-duplicate-root-resolution`,
          `quality-two-yaml-loaders`, `quality-config-accessor-bypass`,
          `quality-sentinel-and-status-literals`, `quality-extension-surface-least-typed`,
          `arch-evidence-import-fallback-side-effects`.
        verify: Select-String -Path yss\*.py -Pattern 'ANNOTATION_KEYS|python_executable' returns nothing
      - id: m14-orchestration
        title: Stage `build()` and split the nav and collection views out of `Renderer`
        status: blocked
        owner: agent
        notes: |
          A pure move: stage functions with one signature under the lock, a `PageContext` passed
          explicitly, stateless `nav` and `collections_view` modules, the `yss refs` walk into
          loader.py. Tests green before and after. Blocked on A.2 in [[audit-calls]].
          `arch-build-monolith`, `arch-renderer-god-object`, `arch-refs-logic-in-cli`.
        verify: python -m unittest discover -s tests
      - id: m14-muted-text
        title: Settle the `--muted` contrast contract
        status: blocked
        owner: agent
        notes: |
          12 to 13 pixel text in `--muted` at 3.3:1 on both shipped light palettes; the playground
          floor is 3. Blocked on A.3 in [[audit-calls]]. `frontend-muted-small-text-below-aa`.
        verify: The playground contrast table and docs/palettes.yaml agree on the token's role
      - id: m14-mobile-nav
        title: Primary navigation reachable on a phone without JavaScript
        status: blocked
        owner: agent
        notes: |
          `.site-nav` is display none under 720px and only yss.js can open it. Blocked on A.4
          in [[audit-calls]]. `frontend-mobile-nav-unreachable-without-js`.
        verify: With scripting disabled at 375px wide, every nav link is reachable

risks:
  - id: r-two-renderers
    title: A host repo already has a markdown renderer with a documented subset and the two drift
    likelihood: medium
    impact: medium
    mitigation: |
      markdown.renderer or a collection's hooks.py markdown() makes one renderer authoritative. For
      the Musings migration that renderer is the existing Musings one (P.5, 2026-09-02), so nothing
      re-renders differently while both generators are alive; it is retired after the migration.
    status: mitigated
  - id: r-leak
    title: Private or personal data leaks into the public build
    likelihood: medium
    impact: high
    mitigation: Private objects are filtered before rendering; the public build scans its output for forbidden strings and deletes itself on a hit; the checkout path is always forbidden.
    status: mitigated
  - id: r-schema-churn
    title: Doc schemas change and old docs stop validating
    likelihood: medium
    impact: medium
    mitigation: Kinds are additive, vocabularies and limits are data, `x-` fields are always allowed, `generic` is the escape hatch.
    status: accepted
  - id: r-jinja-in-yaml
    title: Prefab templates in YAML become unreadable
    likelihood: medium
    impact: low
    mitigation: Keep templates short, push logic into bindings and CSS, render prefab examples on the reference page so breakage is visible.
    status: open
  - id: r-headers
    title: GitHub Pages cannot send COOP/COEP headers, so threaded wasm fails there
    likelihood: high
    impact: low
    mitigation: |
      Prototypes are exported without threads, so no isolation headers are needed anywhere and one
      export serves both targets (P.3, 2026-09-02; [[decisions#adr-016]]). The coi-serviceworker
      shim was considered and dropped. The private server still sends COOP/COEP, but nothing is
      allowed to depend on it.
    status: mitigated
  - id: r-evidence-noise
    title: Git recency warns on every doc after a large refactor, and warnings get ignored
    likelihood: medium
    impact: medium
    mitigation: |
      Warnings never fail a build unless `--strict`, and the Evidence page shows only failures by
      default. [[#m7-reverify]] will bump `updated` once the human confirms a doc still holds; this
      risk stays open until that command ships (P.8, 2026-09-02).
    status: open

open_questions:
  - id: q-subsite-cards
    question: How does a parent site present the sub-sites (per-musing collections) it links to, and which of them sit in the hero panel?
    context: |
      The gap named in the 2026-09-02 site review. A musings landing page draws a card per musing -
      emblem, blurb, links to its pages and straight to its prototypes - and some sit in a hero
      panel. Nothing says what a collection publishes for a parent to draw that card.
    options:
      - A card contract in collection.yaml (emblem, blurb, links, hero flag) that the parent renders
      - The parent page lists its sub-sites by hand and an agent keeps the list current
      - Both - the contract supplies defaults, the parent page overrides per sub-site
    owner: panda
    status: answered
    answer: "Card contract in collection.yaml - links (label, href, kind) and a hero flag - rendered by the parent; adr-017 accepted (Panda, 2026-09-02)."
  - id: q-md-bridge
    question: Should README.md content be migrated into docs, or stay as an include section on the Reference page?
    context: The Reference page includes README.md verbatim; the same words then exist in two places.
    options: [Keep the include, Move the content into a generic doc and delete the include, Trim README to a pointer]
    owner: panda
    status: answered
    answer: "Keep README.md and the include section on the Reference page (Panda, 2026-09-02)."
  - id: q-multi-repo
    question: Should yss be installed as a package in other repos (pip install) or vendored?
    context: pyproject.toml supports `pip install -e .` and the git URL; vendoring keeps the schemas visible in the repo.
    options: [pip install from the git URL, Vendor the yss folder, Both, decided per repo]
    owner: panda
    status: answered
    answer: "pip install from the git URL is the default; vendoring stays possible (Panda, 2026-09-02)."
  - id: q-musings-collision
    question: How does yss enter the Musings repository, which already has build_site.py owning site/?
    context: "Options - library only, full adoption, one config per musing, or collections migrated one musing at a time (adr-010)."
    options: [Collections, one musing at a time, Library only, One yss config per musing]
    owner: panda
    status: answered
    answer: "Collections, one musing at a time, build_site.py retired last; adr-010 accepted. First musing: space cargo cannon (Panda, 2026-09-02)."
  - id: q-work-status-for-risks
    question: Should risks share work_status or keep risk_status by default?
    context: Vocabularies are data and can differ per collection; this decides the default in site.yaml.
    options: [Keep risk_status (open, mitigated, accepted, closed), Use work_status everywhere]
    owner: panda
    status: answered
    answer: "Keep risk_status as the shipped default; a collection overrides it in collection.yaml when it wants (Panda, 2026-09-02)."
  - id: q-check-strictness
    question: Should stale evidence fail the public build in CI, or only warn?
    context: "`yss build --strict` fails on stale claims; the workflow currently runs `yss check` as a separate step."
    options: [Fail the build (strict), Warn only]
    owner: panda
    status: answered
    answer: "Strict: the CI public build runs with --strict so stale evidence fails the deploy; git recency stays on (Panda, 2026-09-02)."
