risks:
  - id: r-leak
    title: Private or personal data leaks into the public build
    likelihood: medium
    impact: high
    mitigation: Objects marked private are filtered before rendering; the public build scans every output file for forbidden strings and deletes itself on a hit; the absolute checkout path is always forbidden.
    status: mitigated
  - id: r-schema-churn
    title: Doc schemas change and old docs stop validating
    likelihood: medium
    impact: medium
    mitigation: Kinds are additive; `x-` fields are always allowed; `generic` is the escape hatch.
    status: accepted
  - id: r-jinja-in-yaml
    title: Prefab templates in YAML become unreadable
    likelihood: medium
    impact: low
    mitigation: Keep templates short, push logic into binding (where/sort/map) and CSS, and render prefab examples on the reference page so breakage is visible.
    status: open
  - id: r-headers
    title: GitHub Pages cannot send COOP/COEP headers, so threaded wasm fails there
    likelihood: high
    impact: low
    mitigation: Export Godot without threads or ship the coi-serviceworker shim (m6-coi).
    status: open

open_questions:
  - id: q-md-bridge
    question: Should existing README.md / CLAUDE.md content be migrated into docs, or stay as include sections?
    context: The reference page currently includes README.md verbatim.
    owner: panda
    status: open
  - id: q-doc-kinds
    question: Which additional doc kinds are worth first-class schemas (test plan, runbook, API surface)?
    owner: panda
    status: open
  - id: q-multi-repo
    question: Should yss be installed as a package in other repos (pip install) or vendored?
    context: pyproject.toml is ready for `pip install -e .`; vendoring keeps the schemas visible in the repo.
    owner: panda
    status: open
