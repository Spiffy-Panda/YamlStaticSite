# Plan document - schema: doc.plan (python -m yss schema doc.plan --yaml)
# Agents: update task status here instead of writing a PLAN.md. Keep ids stable; pages link to them.
kind: plan
id: plan
title: YamlStaticSite plan
summary: Build a Python toolchain that turns agent-first structured YAML docs into a human-first static site with a redacted public target and a full private target, then pilot it on this repository.
status: active
updated: 2026-09-02
owners: [panda, agent]
tags: [toolchain, docs, static-site]
related: [design, codemap, decisions]
agent_notes: |
  Statuses: planned | active | blocked | done | dropped. Every task should carry a `verify` command
  or observation. Add new milestones at the end; do not renumber. Private planning notes go under
  `private_notes` or in items marked `visibility: private`.

goals:
  - Structured YAML files replace PLAN.md, DESIGN.md, the code map and the decision log as the source of truth agents read and write.
  - A human-facing site is generated from those files plus a thin "framing" layer (pages) that decides what to show and how.
  - Two build targets from one source tree, a redacted **public** build for GitHub Pages and a **private** build for local use.
  - Reusable UI prefabs (cards, boards, tables, timelines) are filled from lists in the structured files, never hand-written HTML.
  - The site stays mostly static but can load repo-specific runtime data (test runs, git state) and host prototypes (Godot, wasm, plain HTML).
  - Agents get a skill suite so they use the tools consistently without re-reading the code.

non_goals:
  - A general purpose CMS or blog engine.
  - Client-side rendering of the main content; pages must be readable with JavaScript disabled.
  - Supporting XML or XSLT pipelines (rejected after earlier repos, see the decision log).

milestones:
  - id: m1-core
    title: Core toolchain
    status: done
    priority: 1
    summary: Config, schema validation, visibility filtering, data binding, Jinja rendering and the build pipeline.
    done_when: "`python -m yss build` produces dist/public and dist/private from this repo with no validation errors."
    tasks:
      - id: m1-config
        title: site.yaml loader with defaults, targets and redaction lists
        status: done
        owner: agent
        verify: python -m yss schema site
      - id: m1-schemas
        title: JSON Schema (as YAML) for doc envelope, six doc kinds, prefabs, pages and site config
        status: done
        owner: agent
        verify: python -m yss validate
      - id: m1-visibility
        title: Recursive public/private filtering and forbidden-string scan of build output
        status: done
        owner: agent
        verify: python -m unittest tests.test_yss.VisibilityTests
      - id: m1-binding
        title: Binding language (from, where, sort, limit, map, fields, group_by)
        status: done
        owner: agent
        verify: python -m yss query plan.milestones --where status=active --fields id,title
      - id: m1-render
        title: Prefab rendering, section types (markdown, prefab, dynamic, embed, html, include) and the default layout
        status: done
        owner: agent
        verify: python -m yss build --target private --no-dynamic
      - id: m1-export
        title: Export filtered docs as JSON (data/docs/*.json) and schemas alongside the HTML
        status: done
        owner: agent
        verify: ls dist/public/data/docs

  - id: m2-dynamic-serve
    title: Dynamic data and two-port server
    status: done
    priority: 2
    depends_on: [m1-core]
    summary: Runtime JSON sources with a uniform envelope, built-in providers, and a dev server that serves the private and public builds on separate ports.
    done_when: "`python -m yss serve` serves 8800 (private, live dynamic) and 8801 (public preview under the base_url) and rebuilds on change."
    tasks:
      - id: m2-envelope
        title: Dynamic source envelope {source, collected_at, ok, data|error} and provider/command/file collectors
        status: done
        owner: agent
        verify: python -m yss dynamic --target private
      - id: m2-providers
        title: Built-in providers - buildinfo, testruns (unittest in a subprocess), gitlog
        status: done
        owner: agent
        verify: python -m yss.providers.testruns tests
      - id: m2-server
        title: ThreadingHTTPServer per target, base_url prefix handling, COOP/COEP headers, watch loop
        status: done
        owner: agent
        verify: python -m yss serve --no-watch
      - id: m2-client
        title: yss.js renders dynamic sections as table, kv, list, cards, json or a custom script
        status: done
        owner: agent
        verify: Open /status/ on the private port and see test results render.

  - id: m3-pilot
    title: Pilot on this repository
    status: active
    priority: 1
    depends_on: [m1-core]
    summary: Write this repo's own plan, design, code map, decisions, glossary and changelog as structured docs, and the pages that frame them.
    done_when: Every page in site/pages renders from docs/ without hand-written HTML for the main content.
    tasks:
