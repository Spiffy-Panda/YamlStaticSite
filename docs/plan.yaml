      - id: m3-pages
        title: Author index, plan, design, codemap, decisions, glossary, changelog, status, prototypes, reference pages
        status: done
        owner: agent
        verify: python -m yss ls pages
      - id: m3-site-prefab
        title: Site-local prefab (prefab-gallery) proving the override/extension path
        status: done
        owner: agent
        verify: python -m yss ls prefabs
      - id: m3-review
        title: Human review of the rendered site for framing gaps (what else a reader needs)
