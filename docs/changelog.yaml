# Changelog - schema: doc.changelog. Newest release first. This is the record of shipped work.
kind: changelog
id: changelog
mnemonic: CHG
title: Changelog
summary: Releases of the yss toolchain.
status: active
updated: 2026-09-07

releases:
  - version: 0.6.0
    date: 2026-09-07
    status: released
    summary: Persistent item handles become a first-class feature, and the contradiction register that consumes them ships as a doc kind, a built-in prefab and a subcommand. Every doc in the site now mints a handle series; a citation carries the cited item's own words as hover text.
    changes:
      - type: added
        text: "Handles: a doc declares `mnemonic:` and its items declare `handle:`, resolving through the same resolver as a `[[doc#item]]` reference, to the same item. Storage is canonically uppercase with case-folding lookup, and only the explicit reference form links (adr-046)."
      - type: added
        text: "`python -m yss handles` prints the mnemonic map with each series' mint pointer and gaps, looks one handle up, lists a series, or sweeps files for handles written outside any doc item (`--mentions`, exit 1 when one names no item)."
      - type: added
        text: "Citations render with the cited item's own words as hover text, in configurable modes - `site.yaml` `handles.tooltip` takes `full`, `compact`, `meta`, `text` or an explicit list of `series`, `handle`, `source`, `text`. Any part with nothing to say drops its own line."
      - type: added
        text: "`doc.register`: the contradiction register as a real kind, with the closed `register_state` vocabulary. A view over handles that live in other files - it answers nothing, carries no `resolution:`, and is never archived (adr-051)."
      - type: added
        text: "The `contradiction-register` prefab: contradictions first, then every handle with a retire marker and a comment box, then a Build the instruction button whose output contains only the rows a human touched."
      - type: added
        text: "`python -m yss live-rules <collection> [--check]` projects a register into the rules that still bind. Verbatim from its source with no second copy, deterministic, and refusing on eleven failure modes rather than dropping a rule (adr-051)."
      - type: added
        text: "A `register:` block in collection.yaml (site.yaml for the root collection) carries the per-collection particulars: series prefixes, per-series strike forms, unminted handles and swept extensions."
      - type: changed
        text: "Every doc in this site declares a mnemonic and every item with an `id` carries a handle - 352 across 18 series, backfilled in file order. An ordinal identifies an item and dates nothing (adr-047)."
      - type: changed
        text: "Archived fragments are indexed at tier `archived`, so a citation to an archived item still resolves and reads as spent rather than dangling. Archived means not loaded into a working agent's context, not absent from the index."
      - type: added
        text: "The `yss-register` skill, and handle sections in `yss` and `yss-doc` where an agent authoring a doc will meet them."
      - type: added
        text: "The demo collection carries a worked register, its generated live-rules list and both pages, private and explicitly so."
  - version: 0.5.1
    date: 2026-09-07
    status: released
    summary: Ten open issues, closed in one sweep. Four gates learn to name what they found instead of counting it, evidence learns to prove a removal, a worksheet learns to publish itself once it is answered, and the contrast rule that had tokens but no values is now measured at build time.
    changes:
      - type: fixed
        text: "Strict mode names every stale evidence claim instead of counting them and deferring to `yss check`, in the same format the build warning already used. Capped at 50 with a tail, so the one branch that hid its hits now reads like its three siblings (gh-33)."
      - type: changed
        text: "The build lock reclaims itself when its owner is provably gone. `_pid_alive` asks the platform properly - `OpenProcess` plus `GetExitCodeProcess` on Windows, never `os.kill`, which terminates there - and unknown counts as alive, so the worst case is the old behaviour (gh-34, adr-040)."
      - type: added
        text: "`yss build --wait [SECONDS]` polls for a lock a live build holds rather than failing at once, bare `--wait` meaning 60. `yss serve` waits ten seconds on its rebuilds: the watcher is the half of the collision that should yield. The refusal names both pids (gh-34, adr-040)."
      - type: changed
        text: "`assets/prefabs.css` and `assets/prefabs.js` are built per target from the prefabs that target rendered, tracked at the single `Renderer.prefab()` choke point so a nested call counts. A prefab only a private page uses ships no styles or selectors to public (gh-39, adr-041)."
      - type: added
        text: "Negative evidence. `{path: ..., not_contains: ...}` proves a removal - a dropped flag, a deleted workaround - which no positive claim can express. Every matched file must lack the text, and the stale detail names the file that still has it (gh-32, adr-042)."
      - type: added
        text: "Anchored evidence. `{path: <yaml>, at: \"components[*].status\", equals: live}` parses the file and judges the leaves at an anchor with `equals`, `in` or `absent`; every leaf must satisfy it. An unparsable file or an anchor resolving to nothing is stale with a reason (gh-32, adr-042)."
      - type: fixed
        text: "A `contains: \"key: value\"` claim whose every match is a top-level line now reports `warn`. It matched the document's own envelope key rather than any item, so it could never fail - the defect it tracked stayed open while the claim stayed green (gh-32, adr-042)."
      - type: added
        text: "`$defs/option` carries `evidence[]` and `notes`, so an alternative can prove `we already tried this` instead of asserting it. Claims report under the enclosing item at `.../options/<n>/evidence/<n>`; the collector needed no change (gh-35)."
      - type: changed
        text: "The six `options:` use sites in `doc.design` stopped repeating the same five-line description and point at `$defs/option`, where the prose now lives once. The referenced `$defs` were already emitted by `yss schema`, so only the duplication was real (gh-35)."
      - type: added
        text: "`yss validate` warns when a `[[ref]]` inside a code span would have resolved. Backticks hid a reference from validator and renderer both, so a literal passed every check. It fires only when doc and item exist, so quoting the syntax stays silent (gh-38, adr-043)."
      - type: fixed
        text: "`task-list` renders a milestone's `notes`. The field is on `item_base` for both, but only the task branch printed it, so a milestone note validated, exported to JSON and vanished from the page. Its indent is now scoped to the task level it was written for (gh-40)."
      - type: added
        text: "A build-time contrast gate. `yss/contrast.py` measures the collection bar's three on-accent pairings for every visible collection in both schemes; under WCAG AA 4.5:1 is a warning and a `--strict` failure naming the colours, the ratio and the token to declare (gh-31, adr-044)."
      - type: fixed
        text: "`examples/demo-musing` declares a dark-mode accent. Its `#7a3e9d` drew 2.29:1 against bamboo's dark `--bg-2`, so the collection the gate was built to protect was the first thing it caught (gh-31)."
      - type: added
        text: "A worksheet can publish itself once it is answered. `visibility: on_resolution` on a `doc.worksheet` is derived, not authored: private while any question that requires an answer lacks a `resolution`, public the moment the last one lands (gh-37, adr-045)."
      - type: added
        text: "What publishes is a projection, not the sheet as written. `resolution.summary`, `agent_notes` and `private_notes` are elided and a `kind: text` answer publishes only as the new `resolution.answered` marker, while the questions, the options as offered and `chose[]` go public (gh-37, adr-045)."
      - type: fixed
        text: "`resolution.chose[]` must name an option `value` of its own question. The schema said so in prose only, so a typo rendered as a plausible answer nothing matched; `yss validate` rejects it now, on every worksheet (gh-37)."
      - type: added
        text: "`tests/test_gh36.py` guards the drift gh-20 could not see: when `yss/` has moved past the newest tag, the declared version must have moved too, so a pinned tag and an editable checkout cannot report one string for two trees. Cutting the tag stays a human call (gh-36)."
      - type: added
        text: "`buildinfo` publishes `yss_ref`, `git describe --tags --always --dirty` from the package's own checkout, so a page says which tree built it, not merely which version claimed to. Stderr is dropped and the output shape-checked: this reaches dist/ and must carry no path (gh-36)."
  - version: 0.5.0
    date: 2026-09-06
    status: released
    summary: The code map reads Rust. One parser per language behind the same resolver, a source pane that highlights and jumps to a definition without leaving the page, and an optional bridge that asks a real editor for the definitions a text scanner can never find.
    changes:
      - type: added
        text: "Rust in the code map. `yss/langs/rust.py` indexes free items, `impl` and `trait` members under their type, enum variants, `use` renames and one level inside an inline `mod` - by blanking every comment, literal and attribute, then walking the braces. Nothing invokes cargo (adr-037)."
      - type: changed
        text: "`yss/symbols.py` is dispatch and cache only; the parsers moved to `yss/langs/`, one module per language declaring its suffixes, package-root stems and member separator. Adding a language is a module and a registry line; the public surface is unchanged (adr-037)."
      - type: fixed
        text: "An `x-evidence: export` claim splits on the first `::` rather than the last. A path never contains one and a Rust member name routinely does, so splitting from the right handed the parser half a path - latent while only Python was parsed."
      - type: fixed
        text: "An export claim resolves from its own collection's root before the repo root, the order path evidence already used. A collection keeping code under its own folder had every export read as missing while all its `path` claims passed."
      - type: fixed
        text: "The symbol index cache is keyed by the spelling as well as the path. One directory reached as `src/` and as its full repo-relative path shared an entry, so the second caller got the first one's file paths."
      - type: added
        text: "The source pane is highlighted, tokenised in the browser because that is where the text arrives on both targets. Six CSS variables carry the token palette in both colour schemes, so a theme restyles code without touching the prefab (adr-038)."
      - type: added
        text: "Seek to definition. The `symbols` source publishes `defs` - every name each cited file defines, spelled as that file spells it - and `langs`, so an identifier in the pane is a link to where it is defined, in this file or another. `defs: false` turns it off (adr-038)."
      - type: added
        text: "`symbolsource` carries whole files on the private target under a per-file and total line budget, so a locally served pane needs no network at all - `whole file` is free and a seek into a neighbour is instant. A file over budget is skipped whole rather than truncated (adr-038)."
      - type: added
        text: "`tools/vscode-yss/`, the editor half of the `yss-code` bridge. Framed by it the pane offers `open in VS Code` and `go to definition`, the second answered by the workspace's own language server. Four messages, repo-relative paths only, nothing that writes (adr-039)."
      - type: added
        text: "`examples/rust-musing/` - a second demo collection whose only job is to be read. Its crate compiles and its three tests pass, and it carries a loop label, a trait impl, an associated const, enum variants and an inline test module because each is a way a brace walker goes wrong."
  - version: 0.4.1
    date: 2026-09-04
    status: released
    summary: A patch release carrying the four audit calls Panda answered - small text stops using a token that failed AA, the nav bar opens on a phone with scripting off, and the symbol-import fallback can be switched off. No new capability beyond that switch.
    changes:
      - type: fixed
        text: "Small text no longer takes `--muted`: it measured 3.32:1 on the stock light palette and 3.34:1 in bamboo light, below AA for normal text. 42 rules across yss.css and fifteen prefabs moved to `--fg-2`; four decorative uses kept the token (call A.3)."
      - type: changed
        text: "`--muted`'s role is narrowed in docs/palettes.yaml to non-text - rules, markers, decorative glyphs - with `--fg-2` named as the small-text token. The theme playground still floors it at 3:1, now under that role. No palette was retuned (call A.3)."
      - type: fixed
        text: "The narrow-viewport nav is a `.nav-drawer` `<details>` whose `<summary>` is the Menu button, so a phone opens the bar with no script. Below 720px `.site-nav` was `display: none` and only yss.js could reveal it, leaving every page but the current one unreachable (call A.4)."
      - type: changed
        text: "Above 720px the drawer's summary is hidden and its content forced visible in both the `::details-content` and the older child form, so the wide bar and the print sheet are unchanged. yss.js dropped its class toggle and only mirrors the open state onto `aria-expanded` (call A.4)."
      - type: added
        text: "`evidence.import_symbols` gates the symbol-import fallback, in site.yaml and a collection.yaml `evidence` block, resolved per doc like `git_recency` and defaulting true. Off, an unresolvable `symbol:` claim reports `skipped` with its reason, not `stale` (call A.5, adr-036)."
      - type: fixed
        text: "`_check_symbol` restores `sys.path` after the import attempt whatever the outcome. It inserted the repo root once per check and never removed it, so a long-lived process such as `yss serve` accumulated an entry per check (adr-036)."
      - type: added
        text: "The 2026-09-04 engineering audit is `docs/audit.yaml` and the `/audit/` page: three of ten dimensions, 29 findings each re-read at its cited location, 14 strengths, and a scorecard naming the seven dimensions nobody looked at."
      - type: added
        text: "`docs/audit-calls.yaml` is the audit's worksheet - the five calls only the maintainer can make. Four are resolved and applied here; A.1 set the schedule for the remaining seven dimensions."
      - type: changed
        text: "The orchestration untangle is scheduled as one dedicated pure-refactor pass rather than folded into future sweeps - the suite green before and after with no test edited to fit the new shape (adr-035, call A.2). m14-orchestration is unblocked, not started."
      - type: changed
        text: "Milestone m14-audit carries the audit's thirteen tasks, and three pieces of 0.4.0 work deferred in ADR prose only - m13-attribution, m7-open-item-checks, m7-on-accent-rest - are now in the plan, where cv-archive says open work lives."
  - version: 0.4.0
    date: 2026-09-04
    status: released
    summary: The third issue sweep - a build that fails still leaves you something to look at, a collection theme reaches dark mode, and every region can say which query filled it.
    changes:
      - type: added
        text: "Doc-source attribution: with `build.attribution` in site.yaml (default off) every section carries a `title` naming the query that filled it, and a footer toggle reveals the same sentence as a printed caption. Computed from the section spec, so all six section types have one (gh-29, adr-033)."
      - type: added
        text: "`yss/attribution.py` - a pure section-spec-to-sentence formatter with its own unit tests, plus an optional `stats` out-parameter on `resolve_binding` so counts cost nothing."
      - type: changed
        text: "Attribution's filter half (`where`, `sort`, `limit`, `group_by`) is private-only; the doc and its path appear on both targets, as they already did in data/docs.json."
      - type: added
        text: "Bound dict items carry `_src` and `_doc` alongside `_type`, stamped onto copies so the JSON exports stay clean. `fields:` drops them by design; virtual roots never have them (gh-30)."
      - type: fixed
        text: "The `table` prefab's derived columns skip `_`-prefixed item metadata, so stamping does not turn `_src` and `_doc` into two visible columns. An explicit `columns:` list is still honoured as written."
      - type: changed
        text: "Strict-mode deletion is recorded as adr-034; gh-14's regression test changed contract with it and now asserts the tree survives."
      - type: changed
        text: "A `--strict` failure no longer deletes `dist/<target>`. The build runs to completion, reports every gate's complaint in one error and leaves the tree for inspection; the forbidden-string scan keeps its containment deletion, because it is the only failure with something to contain (gh-21)."
      - type: fixed
        text: "An evidence row for a root-owned doc linked into the collection it was rendered in: a generated global doc id was being pushed back through a scope-relative resolver. `doc_url`/`ref_url` take `exact=` and four generated-id call sites pass it (gh-23)."
      - type: fixed
        text: "A `nav.groups` list declaring only the reserved `collections` id dropped every page from the top bar with no diagnostic. A page naming an undeclared group is now a build warning, and ungrouped items are drawn in a trailing unlabelled group instead of vanishing (gh-28)."
      - type: changed
        text: "A collection's `theme.accent`/`theme.background` are a generated rule in `assets/collections.css` rather than an inline style on `<body>`, so a collection's own `theme.css` can set `--bg`/`--accent` in a dark-mode media query and win. Both keys are now pattern-checked as colours (gh-24, adr-030)."
      - type: added
        text: "On-accent tokens `--collection-bar-bg`, `--on-accent-2`, `--on-accent-2-muted` and `--on-accent-2-surface`, consumed with the old values as `var()` fallbacks so stock palettes are unchanged. The collection bar previously drew 1.06:1 sub-nav links on a saturated theme (gh-26, adr-031)."
      - type: added
        text: "Tables scroll horizontally inside their own container - all five table-emitting prefabs and the default markdown renderer - instead of overflowing the column or force-wrapping into a stack (gh-25)."
      - type: added
        text: "`options[] {text, why, pros, cons}` on design items, so an item at `status: open` can enumerate what it is open between. A shared `$defs/option` referenced by the six design arrays, not `item_base` - which would break every worksheet (gh-27)."
      - type: changed
        text: "A mount's source `path` may point outside its collection - supported and documented, for migrations that mount another generator's output - but not outside the site root, which is where `include` sections already draw the line (gh-22, adr-032)."
      - type: fixed
        text: "The dead-link gate treated `data-src` as a link, because its word boundary matched across the hyphen."
      - type: added
        text: "`conventions[].enforced_by` in the code map, from a new `enforcement` vocabulary, so a rule nothing checks says so; `convention` is defined in the glossary. `cv-release` and tests/test_gh20.py make a half-bump fail (gh-20)."
      - type: added
        text: "yss.css has an `@media print` block for the first time."
  - version: 0.3.0
    date: 2026-09-04
    status: released
    summary: The card contract - a collection declares what a parent site shows for it, and the landing page renders whatever it finds.
    changes:
      - type: added
        text: "Card contract in collection.yaml: `links` (label, href, kind) and a `hero` flag, carried on `$collections` and rendered by the collection-index prefab (adr-017)."
      - type: added
        text: "collection-index renders a hero panel above the grid and a link row per card; `kind: play` renders as a prototype button."
      - type: changed
        text: "A card link into a mount the target does not carry is dropped rather than rendered dead, so a public landing page never advertises a private playable."
      - type: added
        text: "A worksheet question may carry a `resolution` (summary, chose, applied, by, recorded_in); the worksheet prefab then renders it as a record - the summary replaces the choices and the options move into a foldout with the taken one marked (adr-018)."
      - type: changed
        text: "A worksheet whose questions are all resolved renders without form controls or a Build button, and its blocked-work box becomes the work it released."
      - type: changed
        text: "Link kinds are one vocabulary, `link_kind` (repo, issue, pr, doc, page, play, external, file), resolved from site.yaml for both the doc envelope's `links.kind` and a collection's card contract; `play` is now a doc link kind too (adr-020)."
      - type: added
        text: "`links.href` in collection.yaml carries `x-evidence: route`: a relative card link is a claim that a real route exists, implemented by plan item m7-card-link-routes (adr-021)."
      - type: changed
        text: "An agent may repoint `blocks` and `recorded_in` on an archived worksheet when the item they name has been archived, leaving a dated reference note; the pilot milestone m3-pilot moved to docs/_archive/plan-2026-09-done.yaml under that allowance (adr-019)."
      - type: changed
        text: "The `next` worksheet was applied and kept as the record; the live worksheet is now `later`."
      - type: added
        text: "Nav groups: a page declares `nav.group` from the `nav_group` vocabulary (content, decide, meta) and site.yaml's `nav.groups` names, orders and optionally hides each group behind a disclosure (adr-022)."
      - type: added
        text: "The nav derives what it cannot be told: a page whose docs are all archived leaves the bar, and a page presenting a worksheet shows how many questions still have no resolution."
      - type: fixed
        text: "Eight schema descriptions were unquoted scalars inside flow mappings, so a comma in the prose truncated the description and injected a junk key into the rendered schema (gh-5)."
      - type: fixed
        text: "The timeline prefab crashed on an entry with no `items`: Jinja's subscript and attribute lookups fall back to each other, so both forms reached the `dict.items` method (gh-9)."
      - type: added
        text: "`yss new collection <id>` scaffolds collection.yaml, docs/plan.yaml and pages/index.yaml under the site's collection root (gh-1)."
      - type: fixed
        text: "The `new` subcommand's own `--root` flag was clobbering the top-level `--root`; the collection scaffolder's flag is `--collections-root`."
      - type: added
        text: "The card prefab takes `tone` (a tint without printing a badge) and `kicker` (an eyebrow above the title), and rejects an unknown tone instead of rendering it untoned (gh-10)."
      - type: added
        text: "`yss scan` honours .gitignore by default, takes repeatable `--ignore` globs and `--no-gitignore`, and reports what it skipped as well as what it found (gh-6). The public build's own output scan is unchanged and still scans everything it emits."
      - type: added
        text: "A collection can set its own `id` in collection.yaml instead of inheriting its folder name, so a musing keeps its published slug when it migrates; a clash fails to load naming both folders (gh-2)."
      - type: added
        text: "`at:` on a site.yaml collections entry routes every collection in that group under a URL prefix, e.g. /musings/ (gh-4)."
      - type: added
        text: "Mounts take `include` and `exclude` globs, matched relative to the mount path with pathlib semantics; exclude always wins and a mount with neither still copies the whole tree (gh-3)."
      - type: added
        text: "`redaction.scan_ignore` in site.yaml - a standing ignore list for `yss scan`, on top of .gitignore and the default skip list."
      - type: added
        text: "Any doc item may carry `status`. It is unconstrained on `item_base` on purpose - an allOf enum would also bind items that already have their own status vocabulary - and kinds that want checked values declare it themselves; design claims use the new `claim_status` vocabulary (gh-7)."
      - type: fixed
        text: "`yss new doc` wrote a placeholder its own validator rejected: the scaffolder merged a shared base's properties OVER the kind's own, so a kind-specific `status` lost to the open one it inherits."
      - type: added
        text: "A subject-grouping tier: a doc declares `groups: [{id, title, blurb}]`, an item names one with `group:`, and a binding's `group_by: group` hands a page the authored title and blurb in declaration order instead of a bare key (gh-8). New `group-sections` prefab renders them."
      - type: added
        text: "A rendered `[[doc#item]]` reference is checked against the HTML it produced: prefabs anchor addressable items, the renderer records every link and every emitted anchor, and a reference that did not land is a build warning that `--strict` makes fatal (gh-11, adr-023)."
      - type: fixed
        text: "Ten dead in-page links in this repository - three from prefabs that emitted no anchor, seven from answered plan questions the plan page filtered off itself, which now has an answered-questions section."
      - type: added
        text: "`{{ fail('...') }}` in a prefab template raises a RenderError naming the prefab, replacing the trick of forcing an UndefinedError; `card` and `card-grid` take a `level` so titles nest under a `group-sections` heading."
      - type: fixed
        text: "A collection's card links and `collection_url()` were built from its id rather than its route, so they pointed at the wrong place once a collection sat under a route prefix."
      - type: changed
        text: "Milestones m8-defects and m9-authoring closed and moved to docs/_archive/; every issue in the 2026-09-02 sweep is fixed and closed."
      - type: added
        text: "`<doc>.$items` binding root: every item of every type array in one doc, each tagged `_type`, so one `group_by` can span principles, components and constraints (gh-12, adr-025). The pilot's design page renders each subject group once, with all three kinds of item together."
      - type: fixed
        text: "`group-sections` no longer derives its anchor from the group's label: a declared group anchors under its own group id (`id_prefix` for a deliberate repeat), the build reports `duplicate anchor id` per page and fails on it under `--strict` (gh-12)."
      - type: fixed
        text: "A `group_by` whose buckets all collapsed to `None` now warns and names the page, the section and the `fields:` list that dropped the field it needed - `fields:` runs before `group_by`; `map:` is safe (gh-12, adr-025)."
      - type: changed
        text: "A design component's `status` is `claim_status` (live|decided|open|superseded), not `work_status`, so a component that exists in the code can finally say `live`; the pilot's sixteen components moved `active` -> `live`. Codemap modules keep `work_status` (gh-13, adr-026)."
      - type: changed
        text: "Breaking for existing design docs: restate any component at `planned`, `active`, `blocked`, `done` or `dropped` as a claim, or it now fails validation (gh-13, adr-026)."
      - type: fixed
        text: "A collection declaring `at:` 404'd its own theme.css and emblem: the asset emit and both emblem hrefs were built from the collection id while the stylesheet href was built from the route. `Collection.route_path()` is now the single answer for all of them (gh-14, adr-027)."
      - type: changed
        text: "The resolved `emblem_url` is published on `$collections` (and data/collections.json) instead of being re-derived per template; `emblem` keeps the authored value and a literal glyph resolves to null (gh-14)."
      - type: added
        text: "A dead-local-link gate: every href/src a rendered page emits is checked against the output, absolute paths must sit under `base_url`, and `--strict` makes a dead link fatal. Mounted trees are not checked; a page's link into one is (gh-14, adr-027)."
      - type: fixed
        text: "The page `<title>` was a plain concatenation, so a page titled the same as its collection or the site said it twice (`Demo musing · Demo musing · YamlStaticSite`); the crumbs are now joined with adjacent duplicates dropped (gh-15)."
      - type: fixed
        text: "Collection-index cards pluralise their footer counts: `1 doc` / `1 page` instead of `1 docs` / `1 pages` (gh-16). The counts stay target-filtered, so a collection whose docs and pages are all private reads `0 docs · 0 pages` on the public build by design."
      - type: fixed
        text: "Anchor jumps landed the target heading under the sticky header - the stylesheet had no scroll offset at all. `:root` names the header height as `--header-offset`, `html` spends it as `scroll-padding-top`, and the sticky table of contents spends the same token (gh-17)."
      - type: fixed
        text: "`nav:` in site.yaml had been rejected outright since adr-022 shipped - the site schema has `additionalProperties: false` and no `nav` key - so the knob that ADR documents was never turnable. The schema now carries it (gh-18, adr-028)."
      - type: added
        text: "Collections are a nav group under the reserved id `collections`, so a site labels, reorders or folds its collection pills behind a disclosure like any page group; the default config keeps today's appearance, and a customised nav.groups that omits it still shows them (gh-18, adr-028)."
      - type: fixed
        text: "A build into a `dist/` another process owns no longer reports success after its output was cleared: `yss build` exits 1 and `yss serve` reports the collision instead of writing its error page over the other builder's tree (gh-19)."
      - type: added
        text: "An advisory build lock `dist/.<target>.build-lock`, a sibling of the output so nothing clears it and Pages never carries it, released in a `finally`; a lock older than 600s is replaced with a warning (gh-19, adr-029)."
      - type: changed
        text: "Milestone m13-sweep-two closed and moved to docs/_archive/; every issue in the 2026-09-04 sweep is fixed and closed."
