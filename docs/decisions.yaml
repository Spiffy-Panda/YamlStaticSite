# Decision log - schema: doc.decisions (python -m yss schema doc.decisions --yaml)
# Agents: append; never edit an accepted decision - add a new one with `supersedes`.
kind: decisions
id: decisions
title: Decision log
summary: Why the toolchain is shaped the way it is.
status: active
updated: 2026-09-03
related: [design]

entries:
  - id: adr-001
    date: 2026-09-01
    title: YAML plus JSON Schema instead of XML plus XSLT
    status: accepted
    context: |
      Earlier repositories tried XML documents transformed by XSLT. Agents produced verbose, often
      invalid XML; XSLT made data selection and markdown embedding painful; nothing could host
      runtime JSON.
    decision: |
      Structured files are YAML validated by JSON Schema (draft 2020-12, itself written in YAML).
      Selection is a tiny binding language; presentation is Jinja2.
    consequences:
      - Agents write the same YAML they already read and can print the schema for any kind.
      - Validation errors carry file, path and allowed values.
      - Markdown fields are first-class; the `| md` filter renders them.
    alternatives:
      - XML/XSLT (rejected, see context)
      - TOML (no multi-line lists of mappings that read well)
      - JSON (no comments, painful for humans to edit)

  - id: adr-002
    date: 2026-09-01
    title: Three schema families with a shared doc envelope
    status: accepted
    context: Docs, prefabs and pages have different lifecycles and authors; docs are per-kind.
    decision: |
      One envelope schema (kind, id, title, summary, visibility, status, owners, updated, tags,
      links, related, evidence, private_notes, agent_notes) is folded into every `doc.<kind>` schema
      at load time. Prefabs, pages, collections and the site have their own schemas. Sites can add
      `schemas/doc.<kind>.schema.yaml`.
    consequences:
      - "Kind schemas can be strict (`additionalProperties: false`) without repeating the envelope."
      - "`x-` prefixed keys are always allowed for experiments."

  - id: adr-003
    date: 2026-09-01
    title: Prefabs are Jinja2 templates in YAML with declared params
    status: accepted
    context: Cards and boards must be filled from lists in the docs, composed, and styled consistently.
    decision: |
      A prefab file declares `params` (type, required, default), a `template`, optional `css`/`js`
      and `examples`. Templates call other prefabs with `prefab()`. Built-ins ship in the package;
      a site or collection overrides by name.
    consequences:
      - Missing required params and wrong types fail the build with the prefab and param named.
      - Examples are rendered on the reference page, so a broken prefab is visible.
      - Templates in YAML need discipline; logic belongs in bindings.

  - id: adr-004
    date: 2026-09-01
    title: Privacy by marking, enforced by an output scan
    status: accepted
    context: The public site must not leak personal or private information, and markings can be forgotten.
    decision: |
      Any object with `visibility: private` and any `private_notes` key is removed for public
      targets before rendering. After writing, the public build scans every text file for
      forbidden strings (from gitignored `.yss/local.yaml` or CI secrets) plus the absolute
      checkout path, and deletes its own output on a hit. Flagged strings only warn.
    consequences:
      - Forbidden strings never live in the repository; CI uses secrets.
      - Console output masks matched strings.
      - Private-only nav entries and private collections simply do not exist in the public build.

  - id: adr-005
    date: 2026-09-01
    title: Two named targets, two local ports
    status: accepted
    context: The public preview must behave like GitHub Pages (sub-path base URL) while the private site should feel local.
    decision: |
      `public` builds under `base_url: /RepoName/` and is served on 8801 with that prefix; `private`
      builds under `/` on 8800 with live dynamic refresh and COOP/COEP headers. Both bind 127.0.0.1.
    consequences:
      - Links that work on 8801 work on GitHub Pages.
      - Additional targets (for example `staging`) are just more entries in site.yaml.

  - id: adr-006
    date: 2026-09-01
    title: Dynamic data is JSON with a fixed envelope, rendered client-side
    status: accepted
    context: Test results, git state and prototype data change without a doc edit and may be repo-local.
    decision: |
      A dynamic source is a provider function (including `hooks:<name>`), a shell command or a file,
      collected at build time (and on request by the private server) into `dynamic/<name>.json`
      shaped as `{source, collected_at, ok, data | error}`. Sections choose a view. Sources list the
      targets they are allowed in.
    consequences:
      - Public builds can omit a source; the section shows its `empty` text instead of failing.
      - Providers must avoid absolute paths or the scan fails the public build.

  - id: adr-007
    date: 2026-09-02
    title: Pretty routes, .nojekyll and exported data next to the HTML
    status: accepted
    context: GitHub Pages runs Jekyll by default and hides underscore paths; agents want the data the page shows.
    decision: Every page is `<route>/index.html`; the build writes `.nojekyll`, `data/docs/*.json`, `data/docs.json`, `data/evidence.json`, `schemas/*.json` and `build.json`.
    consequences:
      - A page footer links to the JSON behind it.
      - The output is a complete, self-describing snapshot for other tools.

  - id: adr-008
    date: 2026-09-02
    title: Standard library server and polling watcher
    status: accepted
    context: Keep the dependency list to four packages.
    decision: "`http.server.ThreadingHTTPServer` with a small handler; a one-second mtime poll for rebuilds."
    consequences:
      - No websockets or live reload; refresh the browser after a rebuild message.
      - watchdog support is a planned enhancement (m7-watchdog), not a requirement.

  - id: adr-009
    date: 2026-09-02
    title: Evidence, not status, says whether a doc is current
    status: accepted
    context: |
      The Musings review found that nothing in yss verified a doc's claims: cited paths were never
      checked, and the envelope's `draft` status recreated the "awaiting verification" state that
      rotted the markdown it replaced. Structured docs only beat markdown if they can be proven
      stale.
    decision: |
      Any doc or item may carry `evidence` (paths, globs, symbols, commands), and schema fields that
      hold paths or commands are annotated `x-evidence` so they are checked without extra authoring.
      `yss check` evaluates them, git recency warns when cited code changed after `updated`, the
      build stamps freshness on docs and items, and the Evidence page lists failures. The envelope
      status is lifecycle only (active, stable, deprecated, archived); `draft` is gone.
    consequences:
      - Stale claims fail `yss check` and, with `--strict`, the build.
      - Authors write one more line per cited fact; annotations cover the common fields for free.
      - Re-verifying a doc means bumping `updated`, which clears the git recency warning.
    alternatives:
      - Manual review checklists (what the markdown had; it rotted).
      - Only git recency (cheap but cannot tell a moved file from a rewritten one).

  - id: adr-010
    date: 2026-09-02
    title: Host multi-musing repositories through collections, migrated one musing at a time
    status: accepted
    context: |
      The Musings repository has nine musings, each with isolated docs and prototypes, a landing
      page with per-musing themes, local-only playable mounts, and its own site generator. yss
      assumed one docs folder and one flat id namespace, and two generators cannot own site/.
    decision: |
      `collections[].root` globs in site.yaml discover folders; each is a collection with its own
      docs, pages, prefabs, schemas, assets, `collection.yaml` (title, emblem, theme, order,
      vocabularies, limits, dynamic sources, mounts) and an optional `hooks.py` for anything unique
      to that musing. Ids are prefixed by the folder, routes by `/<folder>/`, and local ids win
      inside a collection. Adoption is full but phased: migrated musings render through yss,
      un-migrated ones are linked until moved, and build_site.py is retired last.
    consequences:
      - One site.yaml and one id namespace shaped like the folders, instead of nine configs.
      - The redaction pipeline covers every musing from day one of the migration.
      - Per-musing features that are generic (themes, mounts, emblems, vocabularies) live upstream; bespoke ones live in that musing's hooks.py.
    alternatives:
      - yss as a library only (keeps build_site.py, loses pages, prefabs and the leak scan).
      - One yss config per musing (nine configs, nine namespaces, no shared landing page).

  - id: adr-011
    date: 2026-09-02
    title: Rules are schema annotations resolved from data, not code
    status: accepted
    context: |
      Eight status vocabularies and no length caps made the schemas both too loose and too rigid;
      and every musing has its own working vocabulary. Hard-coding either in schemas or Python
      would make yss opinionated where the user wants to be.
    decision: |
      Schemas carry `x-vocab: <name>` and `x-limit: <name>`; the loader fills in `enum` and
      `maxLength` from `vocabularies` and `limits` in site.yaml, overridden per collection in
      collection.yaml. `x-ref` marks id fields for the reference checker and `x-evidence` marks
      path and command fields for the evidence checker. Defaults ship in yss/config.py.
    consequences:
      - Vocabulary changes are config edits; the schema never changes.
      - Every limit and vocabulary is visible with `yss ls kinds`.
      - Scaffolds and validation use the resolved schema, so placeholders are always valid.

  - id: adr-012
    date: 2026-09-02
    title: The plan holds open work only; archives are never loaded
    status: accepted
    context: Done milestones left in the plan made agents conflate shipped work with current work, exactly as old plan revisions in markdown did.
    decision: |
      Files and folders whose name starts with `_` are skipped by the loader. Milestones that are
      done and committed move to `docs/_archive/<name>.yaml` in the same commit; the changelog is
      the record of what shipped. Questions only the human can answer go to a worksheet doc, whose
      rendered page builds the instruction an agent applies.
    consequences:
      - "`yss query plan.milestones` returns only live work."
      - Archives are plain YAML for humans and are not validated.
      - Worksheets are written by agents and answered by humans; the verdict block closes the loop.

  - id: adr-013
    date: 2026-09-02
    title: The house palette is a theme package, not a shipped preset
    status: accepted
    context: |
      Palettes were prototyped on a live playground page. The author's own palette is not something
      the toolchain should ship to everyone who installs it, but the sites the author runs - this
      repository's site among them - are theirs to dress. Two separate things had been conflated:
      what yss ships, and what any one site wears.
    decision: |
      yss ships neutral presets in docs/palettes.yaml: ink-blue, high-contrast, lavender-warm and
      trans-pride. A personal palette is a theme package kept out of tree - a sibling folder holding
      a token override stylesheet and the same tokens as a `generic` doc - which a site adopts by
      copying the stylesheet over site/assets/yss.css. The playground prefab renders either source,
      so a theme package can be compared without being installed.
    consequences:
      - Adding a preset to this repository is a claim that it is for everybody; personal palettes are not.
      - A site's own palette is one file copy, and reverting it is deleting that file.
      - Trans-pride is recorded as dark-first - its light set was tried and rejected, and is kept as the record of the attempt.
      - Emblems must be single glyphs older than Emoji 12; ZWJ sequences render as tofu in Chrome and Firefox on Windows.

  - id: adr-014
    date: 2026-09-02
    title: Flow policy is config with CLI overrides, not a hard-coded workflow flag
    status: accepted
    context: |
      Strictness lived in one place only - `--strict` typed into the Pages workflow - so an agent
      could not adjust the flow without editing an audited CI file, and every collection was stuck
      with the site's evidence policy. The 2026-09-02 verdicts classed new schema keys as flag-only,
      so the request was recorded rather than applied; P.1 approved it.
    decision: |
      `build.strict` in site.yaml sets whether a build fails on flagged strings and stale evidence.
      `evidence.git_recency` and `evidence.run_commands` may be overridden per collection in
      collection.yaml. Both are overridden by CLI flags - `build --strict/--no-strict`,
      `check --git/--no-git`, `check --run-commands/--no-run-commands` - and the resolution order is
      CLI flag, then collection.yaml, then site.yaml, then the defaults in yss/config.py.
    consequences:
      - Policy is readable as data instead of inferred from a workflow file.
      - A noisy collection can turn git recency off for its own docs without touching the site.
      - A repository can quietly relax strictness in config; the CI workflow keeps passing --strict so the deploy gate is explicit.
    alternatives:
      - Keep the workflow flag as the only switch (no schema churn, but no per-collection policy and no way for an agent to adjust the flow).

  - id: adr-015
    date: 2026-09-02
    title: Mounts stay private by default; a public playable opts in per mount
    status: accepted
    context: |
      Mounts copy a built folder - a playable, an export, a data drop - into the output. Making them
      public by default would put half-finished builds on the public site and would contradict
      adr-004, where privacy comes from marking rather than from remembering to mark.
    decision: |
      A mount with no `targets` is private only. A collection publishes one by listing the public
      target on that mount. The demo collection's playable does exactly that and is the worked
      example.
    consequences:
      - One extra line per public playable, and nothing reaches the public site by forgetting.
      - Each musing decides per mount rather than per site.
      - A public mount's contents go through the redaction scan like every other output file.
    alternatives:
      - Public by default with private marked explicitly (less config, but a build in progress can reach Pages).

  - id: adr-016
    date: 2026-09-02
    title: Prototypes are exported without threads, and Godot hosting is a late milestone
    status: accepted
    context: |
      Threaded wasm needs COOP/COEP. The private server sends both; GitHub Pages cannot send any
      headers at all. The coi-serviceworker shim restores isolation with a service worker, at the
      cost of a reload on first visit and a vendored script to keep current. Separately, a Godot web
      export is tens of megabytes and Pages bandwidth is metered against the account.
    decision: |
      Godot and wasm prototypes are exported without threads, so one export serves both targets and
      no shim is needed; the coi-serviceworker task is dropped. Prototype hosting moves to the back
      of the plan, and whether any Godot export carries the public target on its mount is a separate,
      explicit call about bandwidth cost.
    consequences:
      - No multithreaded physics or audio, and larger single-thread frame times.
      - Nothing in the output may depend on the private server's headers.
      - The public site cannot serve a Godot export until the bandwidth call is made; private mounts are unaffected.
    alternatives:
      - Ship coi-serviceworker beside each export (keeps threads, adds a first-load reload, a vendored script, and a CSP dependency).

  - id: adr-017
    date: 2026-09-02
    title: A collection declares its own card; the parent page renders whatever it finds
    status: accepted
    context: |
      The 2026-09-02 site review named one gap: a musings landing page draws a card per musing -
      emblem, blurb, and links going both to that musing's pages and straight to its prototypes -
      and some musings sit in a hero panel, but nothing said what a collection must publish for a
      parent to draw that card, or how it asks for the hero slot. The alternative was a hand-written
      list on the parent page, which goes stale the moment a musing is migrated and nobody adds it.
    decision: |
      collection.yaml carries the card contract beside the existing emblem, summary and order:
      `links` (label, href, kind) and a `hero` flag. A relative href resolves under the collection's
      own route, so `play/index.html` reaches its mount; `kind: play` renders as a prototype button
      and everything else as a text link. Both fields ride on `$collections`, and the built-in
      collection-index prefab renders the hero panel above the grid from them.
    consequences:
      - A migrated musing appears on the landing page by existing, with no edit to the parent page.
      - One place per musing holds what the card says, and the hero panel is data rather than page markup.
      - A card link into a mount the target does not carry is dropped rather than rendered dead, so the public site never advertises a private playable.
      - A musing that needs a card the contract has no field for must extend the contract upstream instead of writing its own markup.
    alternatives:
      - A hand-written list on the parent page (no schema change, but a migrated musing stays invisible until someone adds it).
      - Contract plus per-sub-site overrides on the parent page (nothing invisible, but the same fact lives in two places).

  - id: adr-018
    date: 2026-09-03
    title: An applied worksheet keeps the choices but stops offering them
    status: accepted
    context: |
      A worksheet that had been applied still rendered as a form: radio buttons pre-selected, a
      Build button, and a "blocked work waiting on this worksheet" box - on a page whose questions
      had all been answered and whose blocked items had all been released. The only thing saying
      otherwise was hand-written prose in the intro and a warning box, which every applied worksheet
      had to repeat and which no rule kept true. A page named Open read as open work; a page marked
      archived read as still blocking.
    decision: |
      A question may carry a `resolution` - a past-tense summary of what addressed it, plus the
      option values that were taken, the date, who decided, and `recorded_in` references to where
      the verdict landed. Its presence changes what the prefab renders: the choices stop being
      offered, the summary takes their place, and the options move into a foldout underneath with
      the taken one marked. When every question has one, the worksheet renders as a record - no
      form controls, no Build button, and the blocked box becomes "work this worksheet released".
      Whether a worksheet is finished is therefore a property of its data, the same way whether a
      doc is current is an evidence result rather than a status (adr-009).
    consequences:
      - An applied worksheet documents its own outcome; the intro no longer has to repeat what happened, and the warning box telling people not to re-answer it is unnecessary.
      - The record and the choices live together, so why an option was rejected is still readable next to what was chosen.
      - Filling a resolution means editing an archived worksheet, which is exactly what next#n-archive-pilot is about; these edits add what happened rather than changing what was asked, but the collision is real and still needs a verdict.
      - A partly-applied worksheet is possible - resolved questions drop out of the required-answer gate while the rest stay live.
    alternatives:
      - Leave the prose in each intro (nothing to build, but every worksheet repeats it and nothing keeps it true).
      - Drop applied worksheets from the site entirely (no confusion, but the record of what was asked and rejected goes with them).

  - id: adr-019
    date: 2026-09-03
    title: An archived worksheet's reference fields may be repointed when their target is archived
    status: accepted
    context: |
      The pilot milestone closed on 2026-09-02 and could not be archived. adr-012 says a done and
      committed milestone moves to docs/_archive/, but the archived worksheet [[pending]] still
      named `plan/m3-review` in `blocks` and `recorded_in`, both of which are x-ref checked, so
      removing the milestone failed validation. The standing instruction not to touch archived
      worksheets made the two rules deadlock, and adr-018 had already crossed the line once by
      filling in resolutions on those same worksheets.
    decision: |
      An agent may edit `blocks` and `recorded_in` on a worksheet whose status is archived, and only
      when the item they name has itself been archived: the reference is dropped and a dated
      reference note is added under the question saying where the item went. Nothing else on an
      archived worksheet may change - not a lead, an option, a help text or a resolution's account
      of what was decided. Reference checking is unchanged; no schema and no checker gives way.
    consequences:
      - The archive rule works again; m3-pilot moved to docs/_archive/plan-2026-09-done.yaml on 2026-09-03.
      - Every reference in every loaded doc still resolves, so `yss refs` and the rendered links stay honest.
      - An archived worksheet is a record of what was asked and answered, not of which live items were once pending; the reference note carries that difference.
      - The exception is narrow and dated, so a future edit that goes beyond it is visible as a rule break rather than as precedent.
    alternatives:
      - Skip x-ref validation of `blocks` on archived worksheets (the recommended option; leaves the record untouched but lets an archived worksheet point at items that no longer exist).
      - Leave done milestones in the plan until nothing references them (no rule changes, but the plan stops holding open work only).

  - id: adr-020
    date: 2026-09-03
    title: One link vocabulary for doc links and collection card links
    status: accepted
    context: |
      The doc envelope's `links.kind` had been `repo | issue | pr | doc | page | external | file`
      since adr-002. The card contract added by [[#adr-017]] wrote its own, nearly identical list -
      `page | play | doc | external | repo | file` - so `play` existed in one place only and an
      author had to know which kind of link they were writing. Two hard-coded enums also contradict
      [[#adr-011]], which says word lists are data.
    decision: |
      Link kinds are the named vocabulary `link_kind` (repo, issue, pr, doc, page, play, external,
      file). Both the doc envelope's `links.kind` and the collection card contract's `links.kind`
      carry `x-vocab: link_kind` instead of an enum, so the list resolves from site.yaml and a
      collection may override it like any other vocabulary. The default ships in yss/config.py and
      this repository spells it out in site.yaml.
    consequences:
      - This changes the doc envelope, which every doc kind folds in, so every kind gains `play` as a link kind; existing docs still validate because the list only grew.
      - A collection can narrow or extend link kinds for its own docs and its own card in collection.yaml.
      - One list to learn and one place to change it; the card contract stops being a special case.
    alternatives:
      - Keep the two lists separate and document the difference in the yss-publish skill (no envelope change, but two similar lists to remember and no `play` on doc links).

  - id: adr-021
    date: 2026-09-03
    title: A card link to a collection page is checked evidence
    status: accepted
    context: |
      A card link's href was not verified. A link to a page that was renamed, or to a route that
      never existed, renders as a dead link on a parent site's landing page - exactly the kind of
      claim `yss check` exists to catch. Links into a mount the target does not carry are already
      dropped ([[#adr-017]]), so the gap is links that are simply wrong.
    decision: |
      `links.href` in collection.yaml carries `x-evidence: route`: a relative href must resolve to a
      real route in the built site. Mount contents and external hrefs are deliberately not checked -
      a mount folder may be produced by a hook and absent at check time, and fetching external URLs
      would put the network in the middle of `yss check`. Routes exist only after pages load, so the
      check runs late in the pipeline; the annotation records the contract now and
      [[plan#m7-card-link-routes]] implements it.
    consequences:
      - A renamed or deleted collection page fails the check instead of shipping a dead link.
      - Nothing new to author - the href already exists; only its correctness became checkable.
      - The evidence checker gains a claim kind that needs the route table, so it cannot run on docs alone the way path and symbol claims do.
    alternatives:
      - Check mount hrefs as well (catches a deleted export, but the folder may be built by a hook and absent at check time).
      - Fetch external hrefs (finds link rot, at the cost of network access, flakiness and offline failures).

  - id: adr-022
    date: 2026-09-03
    title: The nav declares a category and derives the rest
    status: accepted
    context: |
      The top bar had grown to eighteen flat links and told a reader nothing about what any of them
      was. Content pages, live decision worksheets, applied worksheets kept as records, and
      generated build state all sat in one undifferentiated row, and four of them had "(record)"
      written into their labels by hand because nothing else said so. The site owner also wants the
      wording to follow a site's voice - a technical repository and a public-facing musing do not
      call the same group by the same name - so the taxonomy cannot be hard-coded in the template.
    decision: |
      A page declares one thing, its category: `nav.group`, from the `nav_group` vocabulary that
      ships as `content`, `decide`, `meta` and is data like every other vocabulary (adr-011).
      Everything that changes is derived from the docs the page presents, never declared on the
      page: a page whose docs are all `archived` leaves the bar entirely, and a page presenting a
      worksheet carries a count of the questions that have no `resolution` yet - the calls still
      waiting on a human. That is adr-009 applied to navigation.

      `nav.groups` in site.yaml is an ordered list of `{id, label, menu}`. The label is the voice
      knob: rename `Decide` to whatever a site calls it, or drop a group from the list and its
      pages fall into the first one. `menu: true` puts a group behind a `<details>` disclosure,
      which needs no JavaScript. A group with nothing visible in it renders nothing at all.
    consequences:
      - The bar says what kind of destination each link is, and stops listing pages that are finished.
      - An applied worksheet disappears from the bar without anyone editing it; it is reached from the home page, which lists the records.
      - A worksheet that still needs a human announces how many calls it is holding, and stops as soon as they are applied.
      - Renaming a group is a one-string edit in site.yaml, so the technical/plain voice split needs no second vocabulary.
      - The renderer now reads the doc envelope of every page's docs to build the nav; a page that declares no docs has no derived state and is always shown.
    alternatives:
      - "A `nav.voice: technical | plain` preset (one word to set, but a second vocabulary to document and keep in sync, and it cannot express merging two groups)."
      - Declaring `archived` or `needs attention` on the page (simple, but it is a hand-set state that goes stale - the thing adr-009 exists to prevent).
      - Leaving the bar flat and shortening labels (no machinery, but eighteen links stay eighteen links).

  - id: adr-023
    date: 2026-09-03
    title: A reference is dead until the rendered page proves otherwise
    status: accepted
    context: |
      `[[doc#item]]` references were checked against the data and not against the rendering:
      `check_refs` confirmed an item with that id existed, and nothing confirmed that the page
      presenting it emitted an anchor. A link could pass `yss validate` and still be dead in the
      browser. Two failure modes, not one - a prefab that emits no `id` at all, and an item that a
      binding's `where:` clause filters off its own page, which no prefab change can fix. This
      repository had seven of the second kind and three of the first.
    decision: |
      Anchors are emitted wherever an item is addressable - table rows, timeline entries, bullet
      items, glossary terms and changelog releases join the prefabs that already did - and the
      renderer then checks its own output: every reference it turns into an href is recorded, every
      `id` each page emits is recorded, and after the build it reports the ones that did not land,
      naming the reference, the page that carries the link, the route that should have carried the
      anchor, and where the reference was written. It is a build warning that `--strict` makes
      fatal, matching how stale evidence is already treated (adr-014); validate never renders, so it
      cannot know, and `yss check` proves docs against the repo without rendering.
    consequences:
      - Whether a link works is a checked result about real HTML, so it stays true when a prefab, a binding or a page changes - no prefab has to declare that it anchors.
      - A page that filters items away is now visibly responsible for the references that pointed at them; the plan page gained an answered-questions section for exactly that reason.
      - CI runs the public build with --strict, so a dead reference fails the deploy rather than shipping.
      - The renderer keeps two more indexes for the length of a build.
    alternatives:
      - Anchors everywhere and no check (cheap, but says nothing about an item filtered off its own page).
      - A validate-time error (validate does not render, so it would have to predict the output).
      - Leaving it to review (this is precisely the class of thing adr-009 says should be checked rather than remembered).

