# Decision log - schema: doc.decisions (python -m yss schema doc.decisions --yaml)
# Agents: append; never edit an accepted decision - add a new one with `supersedes`.
kind: decisions
id: decisions
mnemonic: ADR
title: Decision log
summary: Why the toolchain is shaped the way it is.
status: active
updated: 2026-09-07
related: [design]

entries:
  - id: adr-001
    handle: ADR.1
    date: 2026-09-01
    title: YAML plus JSON Schema instead of XML plus XSLT
    status: accepted
    context: |
      Earlier repositories tried XML documents transformed by XSLT. Agents produced verbose, often
      invalid XML; XSLT made data selection and markdown embedding painful; nothing could host
      runtime JSON.
    decision: |
      Structured files are YAML validated by JSON Schema (draft 2020-12, itself written in YAML).
      Selection is a tiny binding language; presentation is Jinja2.
    consequences:
      - Agents write the same YAML they already read and can print the schema for any kind.
      - Validation errors carry file, path and allowed values.
      - Markdown fields are first-class; the `| md` filter renders them.
    alternatives:
      - XML/XSLT (rejected, see context)
      - TOML (no multi-line lists of mappings that read well)
      - JSON (no comments, painful for humans to edit)

  - id: adr-002
    handle: ADR.2
    date: 2026-09-01
    title: Three schema families with a shared doc envelope
    status: accepted
    context: Docs, prefabs and pages have different lifecycles and authors; docs are per-kind.
    decision: |
      One envelope schema (kind, id, title, summary, visibility, status, owners, updated, tags,
      links, related, evidence, private_notes, agent_notes) is folded into every `doc.<kind>` schema
      at load time. Prefabs, pages, collections and the site have their own schemas. Sites can add
      `schemas/doc.<kind>.schema.yaml`.
    consequences:
      - "Kind schemas can be strict (`additionalProperties: false`) without repeating the envelope."
      - "`x-` prefixed keys are always allowed for experiments."

  - id: adr-003
    handle: ADR.3
    date: 2026-09-01
    title: Prefabs are Jinja2 templates in YAML with declared params
    status: accepted
    context: Cards and boards must be filled from lists in the docs, composed, and styled consistently.
    decision: |
      A prefab file declares `params` (type, required, default), a `template`, optional `css`/`js`
      and `examples`. Templates call other prefabs with `prefab()`. Built-ins ship in the package;
      a site or collection overrides by name.
    consequences:
      - Missing required params and wrong types fail the build with the prefab and param named.
      - Examples are rendered on the reference page, so a broken prefab is visible.
      - Templates in YAML need discipline; logic belongs in bindings.

  - id: adr-004
    handle: ADR.4
    date: 2026-09-01
    title: Privacy by marking, enforced by an output scan
    status: accepted
    context: The public site must not leak personal or private information, and markings can be forgotten.
    decision: |
      Any object with `visibility: private` and any `private_notes` key is removed for public
      targets before rendering. After writing, the public build scans every text file for
      forbidden strings (from gitignored `.yss/local.yaml` or CI secrets) plus the absolute
      checkout path, and deletes its own output on a hit. Flagged strings only warn.
    consequences:
      - Forbidden strings never live in the repository; CI uses secrets.
      - Console output masks matched strings.
      - Private-only nav entries and private collections simply do not exist in the public build.

  - id: adr-005
    handle: ADR.5
    date: 2026-09-01
    title: Two named targets, two local ports
    status: accepted
    context: The public preview must behave like GitHub Pages (sub-path base URL) while the private site should feel local.
    decision: |
      `public` builds under `base_url: /RepoName/` and is served on 8801 with that prefix; `private`
      builds under `/` on 8800 with live dynamic refresh and COOP/COEP headers. Both bind 127.0.0.1.
    consequences:
      - Links that work on 8801 work on GitHub Pages.
      - Additional targets (for example `staging`) are just more entries in site.yaml.

  - id: adr-006
    handle: ADR.6
    date: 2026-09-01
    title: Dynamic data is JSON with a fixed envelope, rendered client-side
    status: accepted
    context: Test results, git state and prototype data change without a doc edit and may be repo-local.
    decision: |
      A dynamic source is a provider function (including `hooks:<name>`), a shell command or a file,
      collected at build time (and on request by the private server) into `dynamic/<name>.json`
      shaped as `{source, collected_at, ok, data | error}`. Sections choose a view. Sources list the
      targets they are allowed in.
    consequences:
      - Public builds can omit a source; the section shows its `empty` text instead of failing.
      - Providers must avoid absolute paths or the scan fails the public build.

  - id: adr-007
    handle: ADR.7
    date: 2026-09-02
    title: Pretty routes, .nojekyll and exported data next to the HTML
    status: accepted
    context: GitHub Pages runs Jekyll by default and hides underscore paths; agents want the data the page shows.
    decision: Every page is `<route>/index.html`; the build writes `.nojekyll`, `data/docs/*.json`, `data/docs.json`, `data/evidence.json`, `schemas/*.json` and `build.json`.
    consequences:
      - A page footer links to the JSON behind it.
      - The output is a complete, self-describing snapshot for other tools.

  - id: adr-008
    handle: ADR.8
    date: 2026-09-02
    title: Standard library server and polling watcher
    status: accepted
    context: Keep the dependency list to four packages.
    decision: "`http.server.ThreadingHTTPServer` with a small handler; a one-second mtime poll for rebuilds."
    consequences:
      - No websockets or live reload; refresh the browser after a rebuild message.
      - watchdog support is a planned enhancement (m7-watchdog), not a requirement.

  - id: adr-009
    handle: ADR.9
    date: 2026-09-02
    title: Evidence, not status, says whether a doc is current
    status: accepted
    context: |
      The Musings review found that nothing in yss verified a doc's claims: cited paths were never
      checked, and the envelope's `draft` status recreated the "awaiting verification" state that
      rotted the markdown it replaced. Structured docs only beat markdown if they can be proven
      stale.
    decision: |
      Any doc or item may carry `evidence` (paths, globs, symbols, commands), and schema fields that
      hold paths or commands are annotated `x-evidence` so they are checked without extra authoring.
      `yss check` evaluates them, git recency warns when cited code changed after `updated`, the
      build stamps freshness on docs and items, and the Evidence page lists failures. The envelope
      status is lifecycle only (active, stable, deprecated, archived); `draft` is gone.
    consequences:
      - Stale claims fail `yss check` and, with `--strict`, the build.
      - Authors write one more line per cited fact; annotations cover the common fields for free.
      - Re-verifying a doc means bumping `updated`, which clears the git recency warning.
    alternatives:
      - Manual review checklists (what the markdown had; it rotted).
      - Only git recency (cheap but cannot tell a moved file from a rewritten one).

  - id: adr-010
    handle: ADR.10
    date: 2026-09-02
    title: Host multi-musing repositories through collections, migrated one musing at a time
    status: accepted
    context: |
      The Musings repository has nine musings, each with isolated docs and prototypes, a landing
      page with per-musing themes, local-only playable mounts, and its own site generator. yss
      assumed one docs folder and one flat id namespace, and two generators cannot own site/.
    decision: |
      `collections[].root` globs in site.yaml discover folders; each is a collection with its own
      docs, pages, prefabs, schemas, assets, `collection.yaml` (title, emblem, theme, order,
      vocabularies, limits, dynamic sources, mounts) and an optional `hooks.py` for anything unique
      to that musing. Ids are prefixed by the folder, routes by `/<folder>/`, and local ids win
      inside a collection. Adoption is full but phased: migrated musings render through yss,
      un-migrated ones are linked until moved, and build_site.py is retired last.
    consequences:
      - One site.yaml and one id namespace shaped like the folders, instead of nine configs.
      - The redaction pipeline covers every musing from day one of the migration.
      - Per-musing features that are generic (themes, mounts, emblems, vocabularies) live upstream; bespoke ones live in that musing's hooks.py.
    alternatives:
      - yss as a library only (keeps build_site.py, loses pages, prefabs and the leak scan).
      - One yss config per musing (nine configs, nine namespaces, no shared landing page).

  - id: adr-011
    handle: ADR.11
    date: 2026-09-02
    title: Rules are schema annotations resolved from data, not code
    status: accepted
    context: |
      Eight status vocabularies and no length caps made the schemas both too loose and too rigid;
      and every musing has its own working vocabulary. Hard-coding either in schemas or Python
      would make yss opinionated where the user wants to be.
    decision: |
      Schemas carry `x-vocab: <name>` and `x-limit: <name>`; the loader fills in `enum` and
      `maxLength` from `vocabularies` and `limits` in site.yaml, overridden per collection in
      collection.yaml. `x-ref` marks id fields for the reference checker and `x-evidence` marks
      path and command fields for the evidence checker. Defaults ship in yss/config.py.
    consequences:
      - Vocabulary changes are config edits; the schema never changes.
      - Every limit and vocabulary is visible with `yss ls kinds`.
      - Scaffolds and validation use the resolved schema, so placeholders are always valid.

  - id: adr-012
    handle: ADR.12
    date: 2026-09-02
    title: The plan holds open work only; archives are never loaded
    status: accepted
    context: Done milestones left in the plan made agents conflate shipped work with current work, exactly as old plan revisions in markdown did.
    decision: |
      Files and folders whose name starts with `_` are skipped by the loader. Milestones that are
      done and committed move to `docs/_archive/<name>.yaml` in the same commit; the changelog is
      the record of what shipped. Questions only the human can answer go to a worksheet doc, whose
      rendered page builds the instruction an agent applies.
    consequences:
      - "`yss query plan.milestones` returns only live work."
      - Archives are plain YAML for humans and are not validated.
      - Worksheets are written by agents and answered by humans; the verdict block closes the loop.

  - id: adr-013
    handle: ADR.13
    date: 2026-09-02
    title: The house palette is a theme package, not a shipped preset
    status: accepted
    context: |
      Palettes were prototyped on a live playground page. The author's own palette is not something
      the toolchain should ship to everyone who installs it, but the sites the author runs - this
      repository's site among them - are theirs to dress. Two separate things had been conflated:
      what yss ships, and what any one site wears.
    decision: |
      yss ships neutral presets in docs/palettes.yaml: ink-blue, high-contrast, lavender-warm and
      trans-pride. A personal palette is a theme package kept out of tree - a sibling folder holding
      a token override stylesheet and the same tokens as a `generic` doc - which a site adopts by
      copying the stylesheet over site/assets/yss.css. The playground prefab renders either source,
      so a theme package can be compared without being installed.
    consequences:
      - Adding a preset to this repository is a claim that it is for everybody; personal palettes are not.
      - A site's own palette is one file copy, and reverting it is deleting that file.
      - Trans-pride is recorded as dark-first - its light set was tried and rejected, and is kept as the record of the attempt.
      - Emblems must be single glyphs older than Emoji 12; ZWJ sequences render as tofu in Chrome and Firefox on Windows.

  - id: adr-014
    handle: ADR.14
    date: 2026-09-02
    title: Flow policy is config with CLI overrides, not a hard-coded workflow flag
    status: accepted
    context: |
      Strictness lived in one place only - `--strict` typed into the Pages workflow - so an agent
      could not adjust the flow without editing an audited CI file, and every collection was stuck
      with the site's evidence policy. The 2026-09-02 verdicts classed new schema keys as flag-only,
      so the request was recorded rather than applied; P.1 approved it.
    decision: |
      `build.strict` in site.yaml sets whether a build fails on flagged strings and stale evidence.
      `evidence.git_recency` and `evidence.run_commands` may be overridden per collection in
      collection.yaml. Both are overridden by CLI flags - `build --strict/--no-strict`,
      `check --git/--no-git`, `check --run-commands/--no-run-commands` - and the resolution order is
      CLI flag, then collection.yaml, then site.yaml, then the defaults in yss/config.py.
    consequences:
      - Policy is readable as data instead of inferred from a workflow file.
      - A noisy collection can turn git recency off for its own docs without touching the site.
      - A repository can quietly relax strictness in config; the CI workflow keeps passing --strict so the deploy gate is explicit.
    alternatives:
      - Keep the workflow flag as the only switch (no schema churn, but no per-collection policy and no way for an agent to adjust the flow).

  - id: adr-015
    handle: ADR.15
    date: 2026-09-02
    title: Mounts stay private by default; a public playable opts in per mount
    status: accepted
    context: |
      Mounts copy a built folder - a playable, an export, a data drop - into the output. Making them
      public by default would put half-finished builds on the public site and would contradict
      adr-004, where privacy comes from marking rather than from remembering to mark.
    decision: |
      A mount with no `targets` is private only. A collection publishes one by listing the public
      target on that mount. The demo collection's playable does exactly that and is the worked
      example.
    consequences:
      - One extra line per public playable, and nothing reaches the public site by forgetting.
      - Each musing decides per mount rather than per site.
      - A public mount's contents go through the redaction scan like every other output file.
    alternatives:
      - Public by default with private marked explicitly (less config, but a build in progress can reach Pages).

  - id: adr-016
    handle: ADR.16
    date: 2026-09-02
    title: Prototypes are exported without threads, and Godot hosting is a late milestone
    status: accepted
    context: |
      Threaded wasm needs COOP/COEP. The private server sends both; GitHub Pages cannot send any
      headers at all. The coi-serviceworker shim restores isolation with a service worker, at the
      cost of a reload on first visit and a vendored script to keep current. Separately, a Godot web
      export is tens of megabytes and Pages bandwidth is metered against the account.
    decision: |
      Godot and wasm prototypes are exported without threads, so one export serves both targets and
      no shim is needed; the coi-serviceworker task is dropped. Prototype hosting moves to the back
      of the plan, and whether any Godot export carries the public target on its mount is a separate,
      explicit call about bandwidth cost.
    consequences:
      - No multithreaded physics or audio, and larger single-thread frame times.
      - Nothing in the output may depend on the private server's headers.
      - The public site cannot serve a Godot export until the bandwidth call is made; private mounts are unaffected.
    alternatives:
      - Ship coi-serviceworker beside each export (keeps threads, adds a first-load reload, a vendored script, and a CSP dependency).

  - id: adr-017
    handle: ADR.17
    date: 2026-09-02
    title: A collection declares its own card; the parent page renders whatever it finds
    status: accepted
    context: |
      The 2026-09-02 site review named one gap: a musings landing page draws a card per musing -
      emblem, blurb, and links going both to that musing's pages and straight to its prototypes -
      and some musings sit in a hero panel, but nothing said what a collection must publish for a
      parent to draw that card, or how it asks for the hero slot. The alternative was a hand-written
      list on the parent page, which goes stale the moment a musing is migrated and nobody adds it.
    decision: |
      collection.yaml carries the card contract beside the existing emblem, summary and order:
      `links` (label, href, kind) and a `hero` flag. A relative href resolves under the collection's
      own route, so `play/index.html` reaches its mount; `kind: play` renders as a prototype button
      and everything else as a text link. Both fields ride on `$collections`, and the built-in
      collection-index prefab renders the hero panel above the grid from them.
    consequences:
      - A migrated musing appears on the landing page by existing, with no edit to the parent page.
      - One place per musing holds what the card says, and the hero panel is data rather than page markup.
      - A card link into a mount the target does not carry is dropped rather than rendered dead, so the public site never advertises a private playable.
      - A musing that needs a card the contract has no field for must extend the contract upstream instead of writing its own markup.
    alternatives:
      - A hand-written list on the parent page (no schema change, but a migrated musing stays invisible until someone adds it).
      - Contract plus per-sub-site overrides on the parent page (nothing invisible, but the same fact lives in two places).

  - id: adr-018
    handle: ADR.18
    date: 2026-09-03
    title: An applied worksheet keeps the choices but stops offering them
    status: accepted
    context: |
      A worksheet that had been applied still rendered as a form: radio buttons pre-selected, a
      Build button, and a "blocked work waiting on this worksheet" box - on a page whose questions
      had all been answered and whose blocked items had all been released. The only thing saying
      otherwise was hand-written prose in the intro and a warning box, which every applied worksheet
      had to repeat and which no rule kept true. A page named Open read as open work; a page marked
      archived read as still blocking.
    decision: |
      A question may carry a `resolution` - a past-tense summary of what addressed it, plus the
      option values that were taken, the date, who decided, and `recorded_in` references to where
      the verdict landed. Its presence changes what the prefab renders: the choices stop being
      offered, the summary takes their place, and the options move into a foldout underneath with
      the taken one marked. When every question has one, the worksheet renders as a record - no
      form controls, no Build button, and the blocked box becomes "work this worksheet released".
      Whether a worksheet is finished is therefore a property of its data, the same way whether a
      doc is current is an evidence result rather than a status (adr-009).
    consequences:
      - An applied worksheet documents its own outcome; the intro no longer has to repeat what happened, and the warning box telling people not to re-answer it is unnecessary.
      - The record and the choices live together, so why an option was rejected is still readable next to what was chosen.
      - Filling a resolution means editing an archived worksheet, which is exactly what next#n-archive-pilot is about; these edits add what happened rather than changing what was asked, but the collision is real and still needs a verdict.
      - A partly-applied worksheet is possible - resolved questions drop out of the required-answer gate while the rest stay live.
    alternatives:
      - Leave the prose in each intro (nothing to build, but every worksheet repeats it and nothing keeps it true).
      - Drop applied worksheets from the site entirely (no confusion, but the record of what was asked and rejected goes with them).

  - id: adr-019
    handle: ADR.19
    date: 2026-09-03
    title: An archived worksheet's reference fields may be repointed when their target is archived
    status: accepted
    context: |
      The pilot milestone closed on 2026-09-02 and could not be archived. adr-012 says a done and
      committed milestone moves to docs/_archive/, but the archived worksheet [[pending]] still
      named `plan/m3-review` in `blocks` and `recorded_in`, both of which are x-ref checked, so
      removing the milestone failed validation. The standing instruction not to touch archived
      worksheets made the two rules deadlock, and adr-018 had already crossed the line once by
      filling in resolutions on those same worksheets.
    decision: |
      An agent may edit `blocks` and `recorded_in` on a worksheet whose status is archived, and only
      when the item they name has itself been archived: the reference is dropped and a dated
      reference note is added under the question saying where the item went. Nothing else on an
      archived worksheet may change - not a lead, an option, a help text or a resolution's account
      of what was decided. Reference checking is unchanged; no schema and no checker gives way.
    consequences:
      - The archive rule works again; m3-pilot moved to docs/_archive/plan-2026-09-done.yaml on 2026-09-03.
      - Every reference in every loaded doc still resolves, so `yss refs` and the rendered links stay honest.
      - An archived worksheet is a record of what was asked and answered, not of which live items were once pending; the reference note carries that difference.
      - The exception is narrow and dated, so a future edit that goes beyond it is visible as a rule break rather than as precedent.
    alternatives:
      - Skip x-ref validation of `blocks` on archived worksheets (the recommended option; leaves the record untouched but lets an archived worksheet point at items that no longer exist).
      - Leave done milestones in the plan until nothing references them (no rule changes, but the plan stops holding open work only).

  - id: adr-020
    handle: ADR.20
    date: 2026-09-03
    title: One link vocabulary for doc links and collection card links
    status: accepted
    context: |
      The doc envelope's `links.kind` had been `repo | issue | pr | doc | page | external | file`
      since adr-002. The card contract added by [[#adr-017]] wrote its own, nearly identical list -
      `page | play | doc | external | repo | file` - so `play` existed in one place only and an
      author had to know which kind of link they were writing. Two hard-coded enums also contradict
      [[#adr-011]], which says word lists are data.
    decision: |
      Link kinds are the named vocabulary `link_kind` (repo, issue, pr, doc, page, play, external,
      file). Both the doc envelope's `links.kind` and the collection card contract's `links.kind`
      carry `x-vocab: link_kind` instead of an enum, so the list resolves from site.yaml and a
      collection may override it like any other vocabulary. The default ships in yss/config.py and
      this repository spells it out in site.yaml.
    consequences:
      - This changes the doc envelope, which every doc kind folds in, so every kind gains `play` as a link kind; existing docs still validate because the list only grew.
      - A collection can narrow or extend link kinds for its own docs and its own card in collection.yaml.
      - One list to learn and one place to change it; the card contract stops being a special case.
    alternatives:
      - Keep the two lists separate and document the difference in the yss-publish skill (no envelope change, but two similar lists to remember and no `play` on doc links).

  - id: adr-021
    handle: ADR.21
    date: 2026-09-03
    title: A card link to a collection page is checked evidence
    status: accepted
    context: |
      A card link's href was not verified. A link to a page that was renamed, or to a route that
      never existed, renders as a dead link on a parent site's landing page - exactly the kind of
      claim `yss check` exists to catch. Links into a mount the target does not carry are already
      dropped ([[#adr-017]]), so the gap is links that are simply wrong.
    decision: |
      `links.href` in collection.yaml carries `x-evidence: route`: a relative href must resolve to a
      real route in the built site. Mount contents and external hrefs are deliberately not checked -
      a mount folder may be produced by a hook and absent at check time, and fetching external URLs
      would put the network in the middle of `yss check`. Routes exist only after pages load, so the
      check runs late in the pipeline; the annotation records the contract now and
      [[plan#m7-card-link-routes]] implements it.
    consequences:
      - A renamed or deleted collection page fails the check instead of shipping a dead link.
      - Nothing new to author - the href already exists; only its correctness became checkable.
      - The evidence checker gains a claim kind that needs the route table, so it cannot run on docs alone the way path and symbol claims do.
    alternatives:
      - Check mount hrefs as well (catches a deleted export, but the folder may be built by a hook and absent at check time).
      - Fetch external hrefs (finds link rot, at the cost of network access, flakiness and offline failures).

  - id: adr-022
    handle: ADR.22
    date: 2026-09-03
    title: The nav declares a category and derives the rest
    status: accepted
    context: |
      The top bar had grown to eighteen flat links and told a reader nothing about what any of them
      was. Content pages, live decision worksheets, applied worksheets kept as records, and
      generated build state all sat in one undifferentiated row, and four of them had "(record)"
      written into their labels by hand because nothing else said so. The site owner also wants the
      wording to follow a site's voice - a technical repository and a public-facing musing do not
      call the same group by the same name - so the taxonomy cannot be hard-coded in the template.
    decision: |
      A page declares one thing, its category: `nav.group`, from the `nav_group` vocabulary that
      ships as `content`, `decide`, `meta` and is data like every other vocabulary (adr-011).
      Everything that changes is derived from the docs the page presents, never declared on the
      page: a page whose docs are all `archived` leaves the bar entirely, and a page presenting a
      worksheet carries a count of the questions that have no `resolution` yet - the calls still
      waiting on a human. That is adr-009 applied to navigation.

      `nav.groups` in site.yaml is an ordered list of `{id, label, menu}`. The label is the voice
      knob: rename `Decide` to whatever a site calls it, or drop a group from the list and its
      pages fall into the first one. `menu: true` puts a group behind a `<details>` disclosure,
      which needs no JavaScript. A group with nothing visible in it renders nothing at all.
    consequences:
      - The bar says what kind of destination each link is, and stops listing pages that are finished.
      - An applied worksheet disappears from the bar without anyone editing it; it is reached from the home page, which lists the records.
      - A worksheet that still needs a human announces how many calls it is holding, and stops as soon as they are applied.
      - Renaming a group is a one-string edit in site.yaml, so the technical/plain voice split needs no second vocabulary.
      - The renderer now reads the doc envelope of every page's docs to build the nav; a page that declares no docs has no derived state and is always shown.
    alternatives:
      - "A `nav.voice: technical | plain` preset (one word to set, but a second vocabulary to document and keep in sync, and it cannot express merging two groups)."
      - Declaring `archived` or `needs attention` on the page (simple, but it is a hand-set state that goes stale - the thing adr-009 exists to prevent).
      - Leaving the bar flat and shortening labels (no machinery, but eighteen links stay eighteen links).

  - id: adr-023
    handle: ADR.23
    date: 2026-09-03
    title: A reference is dead until the rendered page proves otherwise
    status: accepted
    context: |
      `[[doc#item]]` references were checked against the data and not against the rendering:
      `check_refs` confirmed an item with that id existed, and nothing confirmed that the page
      presenting it emitted an anchor. A link could pass `yss validate` and still be dead in the
      browser. Two failure modes, not one - a prefab that emits no `id` at all, and an item that a
      binding's `where:` clause filters off its own page, which no prefab change can fix. This
      repository had seven of the second kind and three of the first.
    decision: |
      Anchors are emitted wherever an item is addressable - table rows, timeline entries, bullet
      items, glossary terms and changelog releases join the prefabs that already did - and the
      renderer then checks its own output: every reference it turns into an href is recorded, every
      `id` each page emits is recorded, and after the build it reports the ones that did not land,
      naming the reference, the page that carries the link, the route that should have carried the
      anchor, and where the reference was written. It is a build warning that `--strict` makes
      fatal, matching how stale evidence is already treated (adr-014); validate never renders, so it
      cannot know, and `yss check` proves docs against the repo without rendering.
    consequences:
      - Whether a link works is a checked result about real HTML, so it stays true when a prefab, a binding or a page changes - no prefab has to declare that it anchors.
      - A page that filters items away is now visibly responsible for the references that pointed at them; the plan page gained an answered-questions section for exactly that reason.
      - CI runs the public build with --strict, so a dead reference fails the deploy rather than shipping.
      - The renderer keeps two more indexes for the length of a build.
    alternatives:
      - Anchors everywhere and no check (cheap, but says nothing about an item filtered off its own page).
      - A validate-time error (validate does not render, so it would have to predict the output).
      - Leaving it to review (this is precisely the class of thing adr-009 says should be checked rather than remembered).


  - id: adr-024
    handle: ADR.24
    date: 2026-09-03
    title: Code map exports deep-link by parsed line range, pinned to a commit
    status: accepted
    context: |
      The code map lists every module's exports, but a reader who wants to see one has only a name
      and a file. The obvious fix - embed the hosting service's blob page in an iframe - is not
      available: `github.com` sends `x-frame-options: deny` and `frame-ancestors 'none'`, so a
      framed blob renders an empty box. Rendering our own copy of the tree into `dist/` would work
      offline and need no network, but it duplicates the whole package into the public build and
      pushes every source line through the redaction scan.

      Two smaller problems sit underneath. Nothing in the pipeline knew which commit a build
      represented, and a line number is only true of one revision. And `_check_symbol` proved a
      symbol by importing its module and calling `hasattr`, which runs module-level code and is
      always false for a dotted member such as `Config.evidence_for` - half the code map's exports
      were unprovable.
    decision: |
      Resolve each export to a line range by parsing the module with `ast` (yss/symbols.py), never
      by importing it, and pin the resulting link to a commit. The range is resolved at render time
      through a `symbol_range` template global, so the static HTML carries a real
      `<repo>/blob/<sha>/<path>#L<start>-L<end>` anchor and the page is complete with JavaScript
      off (p-static-first). The `module-list` prefab's own `js:` block then upgrades that anchor
      into an in-page source pane, and lets the click through to the link on any failure.

      The source text comes from whichever origin the target has: the private build reads the
      working tree through a `symbolsource` dynamic source declared `targets: [private]`, and the
      public build fetches `raw.githubusercontent.com` at the pinned commit, which sends
      `access-control-allow-origin: *`. A `symbols` source publishes the index itself on both
      targets. `GITHUB_SHA` names the commit in CI; locally `git rev-parse HEAD` does, and a dirty
      tree is reported so the prefab falls back to a `main` link with no line anchor rather than
      publishing a number measured against uncommitted work.

      The same resolver now backs `x-evidence: export` on `exports[].name` and is tried before the
      import in `_check_symbol`, so a vanished or moved export is a stale claim rather than a dead
      link.
    consequences:
      - Every code map export is proved by `yss check` - 89 claims where there were 26 - including dotted class members that `hasattr` can never answer.
      - The public reader depends on a third-party origin at runtime, which is new for this site - it fails when the repo is private, offline, or under `file://`, and falls back to the permalink every time.
      - Line anchors are only published when the build is pinned and clean, so a local preview of the public target links to `main` without a range.
      - "Providers now receive `_target` alongside `_collection`, so a module marked private is absent from the public index."
      - Only Python is parsed. A javascript or jinja module in the code map gets a plain file link and no range.
    alternatives:
      - An iframe of the hosting service's blob page (impossible - framing is denied).
      - A generated static mirror of the tree in dist/ (works offline and needs no network, but duplicates the package into the public build and sends every source line through the redaction scan; kept as the fallback if the repo goes private).
      - A `/_source` endpoint on the dev server (rejected - `serve.watch` already rebuilds the index when a cited file changes, and reading arbitrary paths from disk is a traversal surface for a feature two dynamic sources already cover).
      - "`importlib` plus `inspect.getsourcelines` (runs module-level code, and answers for neither constants nor dotted members)."

  - id: adr-025
    handle: ADR.25
    date: 2026-09-04
    title: A doc-local `$items` root, and anchors that belong to the item rather than the label
    status: accepted
    context: |
      A binding reads one array. A subject group in design.yaml owns principles, components and
      constraints at once, so presenting one group meant three `group-sections` blocks - and each
      emitted `id="group-<slugged title>"` for the same group, so one page carried the same anchor
      three times. Nothing complained: `Renderer.dead_refs()` (adr-023) asks whether an anchor is
      *present*, a set membership test, and a duplicated anchor is present three times over. A
      reader following `[[design#g-sources]]` landed on whichever copy the browser met first.

      Underneath sat a second trap. The binding ops run in the order where, sort, limit, map,
      fields, group_by, so `fields: [name]` with `group_by: group` drops the field the grouping
      needs and buckets everything under `None`; the page then renders one unnamed section instead
      of the authored groups, silently. The issue blamed `map:` for this, wrongly - `map_items`
      starts from `dict(item)`, so `map` keeps the original fields. Only `fields:` drops them.
    decision: |
      Three changes, one per hole.

      `<doc>.$items` is a doc-local virtual root: every item of every top-level type array, in
      authored key order, each carrying `_type: <array name>`. It skips `_`-prefixed loader
      metadata and the envelope lists (groups, links, evidence, tags, owners, related), which
      describe the doc rather than its subject. `_type` follows the existing metadata convention,
      so it filters and maps with no new syntax and one `group_by` can finally span type arrays.
      Only the exact suffix is a root; `$items.0` is an error that says so.

      `group-sections` anchors a group declared in the doc's `groups:` under that group's own id
      verbatim - the rule adr-023 already set for table rows. An undeclared bucket has no id to be
      faithful to and keeps `group-<slug>`. `id_prefix` covers the deliberate case of one page
      rendering the same group twice.

      The build counts `id=` attributes per rendered page and reports every repeat as
      `duplicate anchor id 'x' on page /route/ (n times)`, fatal under `--strict` alongside dead
      references, stale evidence and flagged strings. A binding whose `group_by` collapses every
      bucket to `None` warns and names the page, the section, the field and the source - and says
      that `fields:` dropped it when `fields:` is present.
    consequences:
      - The pilot's design page is the demonstration - one section per subject holding that subject's principles, components and constraints together, each card kickered with its `_type`.
      - The check found five real offenders on /plan/ at once - the board and the task list anchored the same milestones; the board's cards moved to `board-<id>`, so the plain id belongs to the detail entry a reference means.
      - "`$items` is only as good as a doc's top-level shape: a doc hiding its items under `data:` (kind generic) sees nothing."
      - "`_type` is now a reserved item field name, and a page that deliberately repeats a group must say so with `id_prefix` rather than getting a silently mangled anchor."
    alternatives:
      - "A list-valued `from:` (makes `from` two types everywhere a binding is touched, records nowhere which list an item came from, and still makes the author enumerate the arrays `$items` finds on its own)."
      - "A site-wide `$items` alongside `$docs` (loses the doc that `group_by` resolves its authored `groups:` against, which is the whole point, and makes an unfiltered binding a firehose across the site)."
      - Anchoring on the group's label and accepting the collisions (the state being fixed; a renamed heading also breaks every inbound reference).

  - id: adr-026
    handle: ADR.26
    date: 2026-09-04
    title: A design component's status is a claim, not a unit of work
    status: accepted
    context: |
      `components[].status` was pinned to `work_status` (planned, active, blocked, done, dropped) -
      the vocabulary for things an agent is doing. A component is a claim about the architecture as
      it stands, so `live` was unsayable and all sixteen of the pilot's components sat at `active`:
      a work word doing a claim's job, and indistinguishable from a half-finished component. Every
      sibling array in the same doc - principles, interfaces, flows, constraints, alternatives -
      already used the `claim_status` vocabulary that gh-7 added.
    decision: |
      `components[].status` declares `x-vocab: claim_status`. `item_base.status` stays
      un-enumerated for the reason gh-7 recorded - `allOf` composes by intersection, so an enum
      there would also constrain codemap modules and plan items - which is why this is an explicit
      per-kind declaration rather than a deleted property. Codemap `modules[].status` keeps
      `work_status`: a module genuinely is work in progress or dropped. The pilot migrated its
      sixteen components from `active` to `live`.
    consequences:
      - One vocabulary per design doc - every list in it now answers the same question, "is this claim still true?"
      - Breaking for existing design docs - a component at a work_status value now fails validation. Taken deliberately while the pilot is the only design doc in existence, ahead of the Musings migration.
      - A collection that overrides `claim_status` in its collection.yaml now governs its components too.
      - "`yss new doc design` is unaffected: the scaffold writes only required fields and never a status."
    alternatives:
      - Drop `status` from components and let the envelope's open `item_base.status` carry it (rejected - the field stops being enum-checked, so a typo or a work word validates silently, and it is no longer overridable per collection).
      - Add `live` to `work_status` (rejected - it lets every plan milestone and codemap module be `live` to fix one kind's problem, and leaves the two meanings fused).

  - id: adr-027
    handle: ADR.27
    date: 2026-09-04
    title: A collection's files are addressed by its route, and a page's local links are checked
    status: accepted
    context: |
      Four call sites answered "where do this collection's files live" and only one honoured `at:`.
      `collection_url()` prefixed `route_prefix`, so a musing's theme.css href was right; the asset
      emit, the collection-bar emblem, the landing-card emblem and `Collection.summary()` all built
      from the collection id instead. The emblems worked only because the emit and the href were
      wrong in the same direction - fixing the emit alone would have broken them.

      Nothing noticed. validate, check, scan and build were all green over a page whose own
      stylesheet 404'd, because `dead_refs` (adr-023) asks whether an *anchor* was emitted - a set
      membership test over rendered HTML - and nothing asked whether a *file* was.
    decision: |
      `Collection.route_path(rel)` is the single answer, and every caller goes through it: the
      asset emit, the mount prefix, `collection_url`, the card links and the emblem urls. The
      resolved `emblem_url` is computed once and published on `$collections` (and
      data/collections.json) so no consumer re-derives a base; `emblem` keeps the authored value,
      and a literal glyph yields `emblem_url: null` so the glyph branch survives.

      `_dead_links` then asks of a page's links what `dead_refs` asks of its references. Every
      href/src on a rendered page, skipping off-site and fragment-only forms, query and fragment
      stripped: an absolute path must sit under `base_url`, a relative one resolves against the
      page's own directory, and either way it has to reach a file or a directory carrying
      index.html. Warnings by default, fatal under `--strict` with the rmtree-then-raise shape the
      other output gates use. It runs after the manifest and immediately before the leak scan: it
      is the only gate that asks about files, so it has to see everything the build emits - the
      hooks' artefacts, and the `build.json` every footer links to.
    consequences:
      - A collection under a route prefix serves its own stylesheet and emblem, and the four call sites cannot drift apart again.
      - Mount contents are not checked (adr-021 - a mount is the collection's business), but a page's link into a mount is, so a public build that drops a private playable says so.
      - An href outside `base_url` is dead by definition on a redacting target, which catches a hand-written absolute link that would otherwise only 404 once it reached Pages.
      - The gate stats the filesystem once per link per page - the cost of the only check that can see a 404.
    alternatives:
      - Fixing the asset emit alone (rejected - it breaks both emblems, which depended on the matching error).
      - Publishing the emblem path and letting each template resolve it (that is the failure mode being fixed; it re-breaks on every new consumer).
      - Checking mounted trees too (rejected - hand-authored links inside a mount are not ours to police).
      - Running the gate before the manifest (rejected - build.json is a real output every footer links to, and it reported eighteen false positives per target).

  - id: adr-028
    handle: ADR.28
    date: 2026-09-04
    title: Collections are a nav group like any other, under a reserved id
    status: accepted
    context: |
      Every collection got an unconditional pill in a hard-coded
      `<span class="nav-group nav-group-collections">` - no label, no menu branch, no ordering
      hook, no suppression - while page groups had all of that through site.yaml's `nav.groups`
      (adr-022). At nine musings the bar wraps onto a second row and nothing can be done about it.

      The reason nobody had hit this from the config side: site.schema.yaml has
      `additionalProperties: false` and shipped with no `nav` key at all, and `load_all` validates
      the raw site.yaml - so `nav:` had always been rejected with "Additional properties are not
      allowed ('nav' was unexpected)". adr-022's stated consequence, that a site renames or folds
      away a group in site.yaml, was never true of any build: the knob has been documented and
      unturnable since it shipped.
    decision: |
      `nav` joins the site schema (groups of `{id required, label, menu}`), and `collections`
      becomes a reserved group id whose members are the site's collections rather than its pages.
      It joins the DEFAULTS group list last, so today's appearance is unchanged.

      `_collection_nav` builds the items - sorted by the collection's own (order, title), each
      carrying `active` explicitly, because a reader is inside a collection on all of its pages and
      not only its landing page - and the shared link macro draws pages and collections alike. A
      customised `nav.groups` predating this change has no `collections` entry, so the group is
      appended after the page groups, which is where it always was.

      Reserved rather than vocabulary: `nav.group` on a page is a plain string with no `x-vocab`,
      so a page could otherwise declare `collections` and land among the musings. It falls back to
      the default page group instead. No suppression knob - `menu: true` already folds the group
      away, and nobody asked to hide collections entirely.
    consequences:
      - A repo with nine musings labels, reorders or folds its collection pills from site.yaml like any other group.
      - "`nav:` in site.yaml validates for the first time, so adr-022's consequence becomes true retroactively rather than newly."
      - "A page declaring `nav.group: collections` is silently redirected to the default group rather than erroring - the id is reserved, not rejected."
      - The collections group is drawn by the same macro as the pages, so a future nav feature lands on both at once.
    alternatives:
      - Adding `collections` to the `nav_group` vocabulary (rejected - it would let a page declare it, and that vocabulary is about what a page may say about itself).
      - "A `nav.collections: false` suppression knob (not asked for; `menu: true` covers the wrapping problem)."
      - Leaving the hard-coded span and capping the pill count (treats the symptom and keeps the group unconfigurable).

  - id: adr-029
    handle: ADR.29
    date: 2026-09-04
    title: An advisory lock and an output check make concurrent builds loud
    status: accepted
    context: |
      `dist/<target>/` has one owner and nothing enforced it. `yss build --target public` run while
      `yss serve` watched the same tree printed its success line and left no dist/public behind:
      the server's rebuild called `_safe_clear` on the directory the CLI build was still filling.
      `BuildReport.summary()` is composed purely from in-memory counts and never stats the
      filesystem, so the report cannot notice its own output disappearing.
    decision: |
      Two layers.

      After `build()` returns, `cmd_build` and `server.rebuild` require the build's own
      `build.json` to exist; if it does not, they say so and fail (exit 1, or ok=False). The server
      does not write its error page in that case - that would clobber the other builder's output in
      turn.

      `build()` takes an advisory lock `dist/.<target>.build-lock` with `O_CREAT|O_EXCL`, holding
      `{pid, target, started_at}` and released in a `finally` that covers every early-exit path. It
      is a *sibling* of the output, so `_safe_clear` never deletes it and the Pages artefact never
      carries it. A lock younger than `LOCK_STALE_SECONDS` (600) refuses the build by name; an
      older one is replaced with a warning.
    consequences:
      - A collision is an error at the start of a build rather than a silent empty dist/.
      - A hard-killed build leaves a lock that blocks the next build for at most ten minutes and then self-heals.
      - The lock lives inside gitignored dist/, so it can never be committed; the pid in the message is diagnostic only.
    alternatives:
      - "Liveness-checking the recorded pid with `os.kill(pid, 0)` (rejected outright - on Windows that terminates the process, and k-windows says this pipeline is developed there)."
      - "A lock file inside `dist/<target>/` (rejected - `_safe_clear` deletes it, and it would ship to Pages)."
      - Per-target output directories per process (rejected - the server and the CLI are meant to share one preview tree).

  - id: adr-030
    handle: ADR.30
    date: 2026-09-04
    title: A collection's two theme colours are a generated stylesheet rule, not an inline style
    status: accepted
    context: |
      `collection.yaml`'s `theme.accent` and `theme.background` were emitted as a `style` attribute
      on `<body>`. An inline style attribute outranks every author stylesheet, media queries
      included, so a collection shipping both keys and a `theme.css` got a half-applied theme: a
      light `--bg` and `--accent` from the attribute underneath a dark `--fg` and `--bg-2` from the
      stylesheet. Near-white text on a near-white ground, and `<code>` chips as black boxes - less
      usable than either theme applied consistently.

      The two keys were a trap for exactly the author who needed them most. Someone whose palette
      outgrows two colours adds a `theme.css`; the keys they already had set sabotage its dark half
      for those two tokens only, in a way that looks like a broken stylesheet rather than a
      conflict. `examples/demo-musing/collection.yaml` has the same shape and escaped it only by
      declaring no `prefers-color-scheme` block.
    decision: |
      The colours are emitted as `.collection-<id> { --accent: ...; --bg: ...; }` into a generated
      `assets/collections.css`, built by `Renderer.collection_css()` alongside `prefab_css()` and
      linked after `prefabs.css` and before every `css_links` entry. A collection's own `theme.css`
      is already linked last, so ordinary cascade order gives it the win - which is the precedence
      that was wanted. The `style` attribute is gone from the template.

      Because the value now reaches a stylesheet rather than an autoescaped attribute, both keys
      are pattern-constrained in `collection.schema.yaml` to a colour value: a hex, a bare keyword
      or a single functional notation, with no semicolons or braces. `collection_css()` is built
      from the renderer's already target-filtered collection list, so a private collection's
      colours never appear in the public build.
    consequences:
      - "A collection's theme.css can now set --bg and --accent in a dark-mode media query and have it apply; the two keys become defaults rather than an override nothing can beat."
      - "The emitted HTML changes for every collection page: `<body>` no longer carries a style attribute."
      - "A theme.accent that was previously any string is now validated; a value that would break out of the rule fails to load."
      - "One more stylesheet request per page, generated even when it is empty, so the link in the template is unconditional."
    alternatives:
      - "Keep the attribute and document the two keys as light-mode-only and unoverridable (rejected - it documents a trap instead of removing it, and would need a build warning to be safe at all)."
      - "Emit the rule into prefabs.css (rejected - that file is prefab CSS by name and by contract; collection colours are not a prefab)."
      - "Drop the two keys and require a theme.css (rejected - two colours is the right amount of ceremony for a collection that only wants a tint)."

  - id: adr-031
    handle: ADR.31
    date: 2026-09-04
    title: Text on an accent surface takes an on-accent token, defaulted at the point of use
    status: accepted
    context: |
      `.collection-bar` paints a full-width surface with `--accent-2` and coloured everything on it
      with `--fg` and `--fg-2`, which the token set defines for use against `--bg`. No on-accent
      foreground existed; the only on-accent colour in the stylesheet was a hard-coded `#fff` on
      `.nav-count`. The stock palettes hid the problem because both default `--accent-2` values are
      near-neutral tints, measuring around 6:1. A theme using `--accent-2` as an actual secondary
      accent measured 1.06:1 for sub-nav links and 1.63:1 for the collection title, in both colour
      schemes - and every page inside a collection carries this bar.

      The active pill is a separate failure of the same kind. Its own text-on-pill pair is fine at
      8.54:1; the problem is that `--bg-2` is the *page* surface, so the pill is a barely-visible
      tint on a `--bg` page and a near-black hole punched in a saturated bar. It was specified
      against a surface it is not on.
    decision: |
      Four optional tokens - `--collection-bar-bg`, `--on-accent-2`, `--on-accent-2-muted` and
      `--on-accent-2-surface` - consumed as `var(--token, var(--old-value))` at each use site.

      The fallback lives at the point of use and the tokens are *not* declared on `:root`. A custom
      property resolves its `var()` on the element that declares it, so `:root { --on-accent-2:
      var(--fg) }` would compute the site's `--fg` once and inherit that literal colour, ignoring a
      collection that themes `--fg` on its own body class - which is precisely the case the token
      exists to serve. Declared defaults would have looked correct and quietly broken collection
      theming.

      They are recorded in `docs/palettes.yaml` under `optional_tokens`, kept out of the `tokens`
      roster that drives the theme playground, since a palette need not declare any of them.
    consequences:
      - A theme has one place to say what reads on its accent, and the stock palettes render exactly as before.
      - "A theme that overrides --on-accent-2-surface may also want its own colour for the pill text, which still takes --accent; that is a stylesheet line, not another token."
      - "`.nav-count`'s hard-coded #fff is the same class of defect in a different component and is left for a follow-up; nothing has reported it."
    alternatives:
      - "Declaring the tokens on :root with var() defaults (rejected on the substitution rule above - it defeats collection theming, which is the only case that fails today)."
      - "Stop painting the bar with --accent-2 entirely (rejected as the whole answer - --collection-bar-bg makes the role explicit and separately themeable while keeping the current look)."
      - "Hard-code a contrast-safe colour per bar (rejected - a theme author must be able to choose, and no formula survives every palette)."

  - id: adr-032
    handle: ADR.32
    date: 2026-09-04
    title: A mount source may leave its collection and may not leave the site
    status: accepted
    context: |
      `_mount` validated the mount *destination* against the output root and had no counterpart
      check for the *source*, so a collection could mount a folder outside its own root and it
      worked silently. The schema description said "Folder relative to the collection root", which
      reads as *within*, but nothing enforced that reading.

      The behaviour existed by the absence of a check rather than by a decision, which is what made
      it worth ruling on. A hardening commit adding the symmetric check would have looked obviously
      correct in review and would have broken any downstream site relying on the escape with no
      deprecation window - and the flagship consumer now does rely on it: all eight of its
      not-yet-ported collections carry a `path: ../site/musings/<slug>` mount on the public target,
      so that the strict build's dead-link gate sees a complete tree instead of 34 dead links.
      Without it that repo either publishes a knowingly incomplete tree with dead-link checking
      switched off, or copies megabytes of generated output under source-control paths.
    decision: |
      Bless the escape from the collection root and draw the line at the *site* root instead.
      `_mount` resolves the source and requires it to sit under `cfg.root`, raising with both the
      offending path and the rule when it does not. The schema description says outright that
      pointing outside the collection is supported and deliberate.

      The site root is the boundary because a mount is a copy instruction whose bytes are
      published, and `include` sections already draw the line in exactly that place
      (`render.py`: "path escapes the site root"). The two now match, which is the symmetry worth
      having - not the one between source and destination, which are guarding different things.

      No build warning for an escaping mount: eight collections times every build is noise, and
      noise trains people past warnings.
    consequences:
      - The migration shape the consumer depends on is supported by decision and pinned by a test, so a future hardening pass fails loudly instead of silently breaking it.
      - "An absolute path, or `../../outside`, now fails the build; that was previously silent and copied whatever it found."
      - "The redaction scan is unchanged and still covers the whole output tree, so it remains the backstop for mount *contents* regardless of where they came from."
    alternatives:
      - "Bless it unconditionally with no source check (rejected - it leaves any folder on the machine mountable, and the redaction scan catches forbidden strings, not arbitrary contents)."
      - "Reject the escape symmetrically with the destination check (rejected - it breaks eight shipped collections and needs a replacement that does not exist)."
      - "Warn on every escaping mount (rejected - see above; the affordance is documented instead)."

  - id: adr-033
    handle: ADR.33
    date: 2026-09-04
    title: A region says where it came from in a title attribute and an opt-in caption, not a hover pill
    status: accepted
    context: |
      A reader looking at a rendered region had no way to see which structured query produced it.
      The page header prints the doc set, which is per-page and cannot answer "why these four?".

      The original proposal was a fixed bottom-left pill updated on hover. It does not survive
      contact with the requirements: there is no `mouseover` on touch; `focusin` fires only on
      focusable elements and `<section>`, `.card` and `<tr>` are not, so adding `tabindex` to make
      them so would wreck the tab order; a `pointer-events: none` pill is invisible to assistive
      tech unless it is an `aria-live` region, and a live region updating on every mouse movement
      is an anti-pattern; `yss.css` had no `@media print` at all, so it would print as a page-one
      artefact; and it would have been the first `position: fixed` rule in the stylesheet, fighting
      the sticky header below 720px and overlapping the prototype embeds.
    decision: |
      Attribution is computed in `render_section` from the section spec, not in `_bind` - which is
      not the chokepoint it looks like, since four of the six section types never reach it. The
      phrasing lives in `yss/attribution.py` as a pure function, unit tested without rendering.

      Two presentations, both static. The baseline is a `title=""` on the section wrapper: a native
      tooltip, harmless on touch, present with JavaScript off, which p-static-first requires. The
      opt-in is a "show sources" button in the footer that reveals a printed caption per section,
      persisted in localStorage and defaulting on for the private target. The captions are emitted
      with `hidden`, so nothing shifts when JavaScript is unavailable.

      Region-level, with doc-level as an automatic fallback rather than a superseded alternative: a
      section binding only scalars, or several docs, has no single query to name. A section binding
      two docs names both and stops - a confidently wrong attribution is worse than none.

      `build.attribution` in site.yaml gates it, defaulting off.
    consequences:
      - "The filter half is private-only: `where`, `sort`, `limit` and `group_by` are authored in page YAML and had never reached dist/, and one naming a person would have started to. The doc and its path were already public in data/docs.json."
      - "`resolve_binding` takes an optional `stats` dict so counts are free rather than a second resolution."
      - "`data-src` on a section made the dead-link gate chase a repo-relative source path, because LINK_RE's word boundary matched across a hyphen; the boundary is now explicit, which also protects the `data-src` convention gh-30 reserved."
      - yss.css has an @media print block for the first time.
    alternatives:
      - "A fixed hover pill (rejected for the six reasons above; the issue itself reversed on it)."
      - "Recording provenance inside `_bind` (rejected - it is reached only by the markdown and prefab handlers, so dynamic, include, embed and html would silently have no attribution)."
      - "Per-item attribution on every card (deferred - gh-30 reserves `_src`/`_doc` so prefabs written meanwhile stay compatible; the eleven-prefab emission waits until a $docs-fed grid needs it)."

  - id: adr-034
    handle: ADR.34
    date: 2026-09-04
    title: Only a leak deletes the output; every other strict failure leaves the tree
    status: accepted
    context: |
      Six failure paths in `build_target` each did the same two lines - `rmtree` the output, then
      raise. Only one of them had anything to contain. A forbidden string in `dist/` is material
      that must not sit on disk where a later step could upload it. A duplicate anchor id, a dead
      reference, a dead link, a flagged string or a stale evidence claim produces output that is
      merely *wrong*, and deleting it removes the one artefact needed to diagnose the failure.

      The deletion bought nothing in either environment. In CI the non-zero exit gates the upload,
      not the tree's existence. Locally, a strict failure is the moment you most want to open the
      emitted HTML, and it was the one moment yss guaranteed you could not.
    decision: |
      Strict failures are collected and raised once at the end, over an output tree that is whole
      and has been scanned. The forbidden-string branch keeps its `rmtree` and still raises on the
      spot, before the combined report.

      The obvious version of this fix - deleting the five `rmtree` calls - would have been wrong.
      The duplicate-id and dead-reference gates fire *before* the data export, the assets, the
      mounts and the leak scan, so raising there leaves a partial tree that `scan_tree` never
      looked at. On the public target that is precisely the tree the deletion exists to prevent.
      Running to completion is what makes leaving the tree safe.
    consequences:
      - A failing strict build leaves dist/<target> to inspect, and the error says so.
      - Every gate's complaint is reported in one error instead of one per re-run, because later gates are now reachable.
      - "A build that is both wrong and leaking is still contained: the leak scan runs before the combined raise."
      - "gh-14's test changed contract deliberately: it now asserts the tree survives."
    alternatives:
      - "Dropping the five rmtree calls where they stand (rejected - two gates fire before the leak scan, so a public build could be left partial and unscanned)."
      - "Gating the deletion on the target rather than the failure (rejected - it keeps the local loop's worst case for no gain; the failure kind is what determines whether anything is hazardous)."

  - id: adr-035
    handle: ADR.35
    date: 2026-09-04
    title: The orchestration untangle is one dedicated pure-refactor pass, not a background habit
    status: accepted
    context: |
      The 2026-09-04 engineering audit ([[audit]]) found `build()` to be a single 251-line
      function and `Renderer` a 900-line class carrying ambient per-page state
      (`arch-build-monolith`, `arch-renderer-god-object`, `arch-refs-logic-in-cli`). Both work,
      and neither is a defect. The cost is structural: every gate test runs the whole pipeline
      (91 `build(` calls, 573 seconds), adding a gate means editing the middle of `build()`, the
      pure derivations - nav groups, card links, emblem url - cannot be called without a full
      renderer, and the ambient state is a reentrancy hazard that [[plan#m7-watchdog]] would
      inherit.

      The alternative on the table was to fold the moves into the next issue sweeps, one seam at
      a time as an issue happens to touch it. That costs nothing to schedule, and it is how the
      two conventions end up living side by side for months: a half-extracted `build()` is worse
      to read than either the monolith or the staged version, and the slow suite is paid on every
      run in the meantime.
    decision: |
      Do it once, deliberately, as a pass with nothing else in flight: stage `build()` into
      functions with one signature under the existing lock, pass a `PageContext` explicitly
      instead of setting per-page attributes on the renderer, extract stateless `nav` and
      `collections_view` modules, and move the `yss refs` walk out of cli.py into loader.py.

      The pass is a pure move. The test suite is the net and must be green before and after with
      no test edited to accommodate the new shape; a test that has to change is evidence that the
      move was not pure. Any behaviour change noticed along the way - a bug, a missing gate, a
      better default - is written down as its own task and done outside this pass, never folded
      into the diff.

      It is scheduled between sweeps, never during one, because it touches the two files every
      open milestone also touches.
    consequences:
      - Gate tests can call one stage over a prepared tree instead of running the whole pipeline, which is what makes the 573-second suite tractable.
      - The reentrancy and thread-safety hazard in `Renderer` is gone before [[plan#m7-watchdog]] builds on it.
      - Every open branch touching build.py or render.py rebases once, so the pass is announced before it starts.
      - "Days of work produce no visible feature; the reviewable artefact is a diff that moves code and changes no behaviour."
      - "A behaviour change inside the pass is a defect in the pass, not a bonus."
    alternatives:
      - "Fold the moves into issue sweeps one seam at a time (rejected - two conventions side by side for months, and the suite stays slow throughout)."
      - "Leave both as they are and record them in the design as deliberately monolithic (rejected - the slow suite is then the standing price of every future gate, and ambient state blocks any parallel build)."

  - id: adr-036
    handle: ADR.36
    date: 2026-09-04
    title: Symbol evidence may import a module, but only where the site says so
    status: accepted
    context: |
      [[decisions#adr-024]] moved symbol proof to parsing and kept `importlib.import_module` as
      the fallback, so a name the parser cannot resolve - a re-export, a generated attribute -
      still checks out. The 2026-09-04 audit found what that costs
      (`arch-evidence-import-fallback-side-effects`): a `symbol:` claim the parser misses runs
      module-level code during `yss check` and during every build's evidence pass, and the
      checker inserted the repo root into `sys.path` and never removed it, so a long-lived
      process accumulates entries.

      The trust cost is small in a repository that already runs its own hooks.py by design. The
      architectural cost is the part that matters: a proof step that executes the thing it is
      proving is not read-only, and there was no way to ask for one that is - an untrusted
      collection, or a CI job that wants evidence checking to touch nothing.
    decision: |
      Keep the fallback and bound it. `evidence.import_symbols` is a policy key in site.yaml and
      in a collection.yaml `evidence` block, resolved per doc like `git_recency` and
      `run_commands` - collection wins over site, and site over the default, which is `true`. No
      existing claim changes status.

      When it is off, a symbol the parser cannot resolve reports `skipped` with the reason rather
      than `stale`: the claim is unproven, not disproven, and `skipped` is the status that
      already means "policy declined to run this". `sys.path` is restored after the attempt
      whatever the outcome.

      This does not supersede adr-024. The fallback it chose is still there and still the
      default; all that is new is a switch and a cleanup.
    consequences:
      - "Behaviour is unchanged for every repository that does not set the key."
      - "A collection whose code should never be imported can set `evidence.import_symbols: false` and see which claims that costs."
      - "`sys.path` no longer grows once per check in a long-lived process such as `yss serve`."
      - "The residual is honest and unfixed: with the default on, `yss check` and the build's evidence pass can still run project code, and a `symbol:` claim is the only evidence kind that can."
      - One more key to document in the site and collection schemas.
    alternatives:
      - "Default the key to false (rejected - existing runtime-only claims would flip to `skipped` on upgrade, which supersedes part of adr-024 for a benefit only a few repositories want)."
      - "Leave the fallback unbounded and add a consequence note (rejected - it leaves a proof step with interpreter-wide side effects and no way to opt out)."
      - "Reuse `evidence.run_commands` as the gate (rejected - running a doc's declared command is a different consent from importing a module the doc only names)."

  - id: adr-037
    handle: ADR.37
    date: 2026-09-06
    title: A language is a parser module and one registry line, and Rust's is a scanner
    status: accepted
    context: |
      [[decisions#adr-024]] shipped code map deep links and closed with a stated limit: "Only
      Python is parsed. A javascript or jinja module in the code map gets a plain file link and
      no range." The first musing to want otherwise is a bevy prototype - eight Rust files whose
      exports a code map can name and cannot prove, so every one of them is a link to a file and
      a promise that the reader will scroll.

      `yss/symbols.py` was one module doing three jobs: dispatch, cache, and the `ast` walk
      itself. `SUPPORTED_SUFFIXES` was a set holding one suffix and the directory index globbed
      for it, so "which files does a directory contribute" was a Python fact stated in the
      dispatcher.

      Rust has no parser in the standard library, and the two ways to get one are both worse than
      the problem. A dependency (tree-sitter, or syn through a shelled-out helper) puts a native
      build between a reader and a line number. Invoking cargo - `cargo metadata`, rustdoc JSON -
      makes the code map need a toolchain, so it renders on a machine that has Rust and goes
      stale on a CI runner that does not, which is the opposite of what evidence is for.
    decision: |
      Split the resolver. `yss/langs/` holds one module per language, each exporting `SUFFIXES`,
      `PACKAGE_STEMS`, `MEMBER_SEP`, `ALIAS_SEPS`, `LABEL` and `file_index(path, rel)`;
      `yss/symbols.py` keeps its public surface and becomes dispatch and cache only. Adding a
      language is adding a module and one entry in `REGISTRY` - the directory rule follows from
      `PACKAGE_STEMS`, so `mod.rs`, `lib.rs` and `main.rs` contribute bare names the way
      `__init__.py` does, without the dispatcher learning what a crate is.

      Rust is read by scanning, in two stages: blank out every comment, literal body and attribute
      while preserving offsets, then walk the braces. It indexes free items, `impl` and `trait`
      members under the type, enum variants, `use` renames, and one level inside an inline `mod`;
      it indexes nothing inside a function body and no struct fields. A member is `Type::method`,
      and `Type.method` resolves to the same lines so a code map written in the Python house style
      is not a wall of false staleness.

      The `x-evidence: export` claim now splits on the *first* separator rather than the last,
      because a Rust member name contains one and a path never does; and an export claim resolves
      from its own collection's root before the repo root, the order path evidence already used.
      Both were latent - the first unreachable while only Python was parsed, the second while only
      the root code map had exports.
    consequences:
      - Every Rust export in a code map is proved by `yss check` and deep-links to its own lines, on both targets, exactly as a Python one does.
      - Nothing invokes cargo, so the index is identical on a machine with no Rust toolchain, and an unbuildable working tree still maps.
      - "A scanner is not a compiler: macro-generated items are invisible, and two `impl` blocks defining the same method name resolve to the first. Both are silent, which is why the fixture crate exists."
      - "`yss/symbols.py` shrank to a dispatcher; `file_index`, `index_for`, `lookup` and `supported` mean what they meant."
      - The index cache is keyed by the spelling as well as the path - the same directory reached two ways stores two sets of file paths, and one key handed the second caller the first one's.
      - "`examples/rust-musing/` is a second demo collection whose only job is to be read: a crate carrying a loop label, a trait impl, an associated const and an inline test module - each a way a brace walker goes wrong."
    alternatives:
      - A parser dependency, tree-sitter or a shelled-out syn helper (rejected - a native build between a reader and a line number, for a feature whose whole point is that it needs nothing).
      - "`cargo metadata` or rustdoc JSON (rejected - the code map would then need a toolchain, so it would be true on a developer's machine and stale on any runner without Rust; evidence that depends on the environment is not evidence)."
      - A regex over the whole file (rejected - a brace in a string or a doc comment ends an item, and a loop label reads as an unterminated character literal that swallows the rest of the file).
      - Leave Rust unparsed and link whole files (rejected - it is the limit adr-024 wrote down as a limit, and the first real musing hit it immediately).

  - id: adr-038
    handle: ADR.38
    date: 2026-09-06
    title: The source pane highlights and seeks in the browser, from an index the build publishes
    status: accepted
    context: |
      The pane [[decisions#adr-024]] built shows the right lines as plain text. Reading Rust that
      way is worse than reading Python that way - one function in the prototype that prompted this
      is a hundred lines of physics - and the question a reader has next is almost always "where
      is that defined", which the pane could answer and did not.

      Two constraints decide the shape. The source text arrives at *runtime* on both targets (the
      private build reads its working tree, the public one fetches the pinned commit), so
      highlighting at build time would colour text the build does not have. And the symbol table
      that could answer "where is this defined" already exists - it is the same parse that
      resolves an export - but the `symbols` source published only the handful of names the code
      map happened to cite.
    decision: |
      Highlight in the browser, and seek from a published index.

      The `module-list` prefab tokenises a whole chunk at once - not line by line, because a doc
      comment spans lines and a per-line tokeniser restarts inside one and paints the rest as code
      - with a small per-language spec. It is not a parser and does not need to be: the line
      ranges and the symbol table come from the real parser, and this only decides what to paint.

      The `symbols` source gains `defs` - every name each cited file defines, spelled as that file
      spells it, because a bare constant name is what a reader clicks on and its directory-prefixed
      form appears nowhere in the text - plus `langs`, so the page picks a highlighter rather than
      guessing from a suffix. An identifier the index knows becomes a link; the same file wins over
      another one, because a method and a free function of the same name are a real ambiguity and
      the one you are reading is the one you meant.

      `symbolsource`, already private-only, gains whole files under a line budget. That is what
      local-first buys: served from `yss serve`, the pane needs no network at all, `whole file` is
      free, and a seek into a neighbouring file is instant. The public target keeps exactly the
      behaviour adr-024 gave it.
    consequences:
      - The pane is legible in a language nobody on the project reads fluently, and a reader can follow a call without leaving the page.
      - "`defs` publishes every name in a cited file, not only the cited ones. That is names and line numbers, never text, and `defs: false` on the source turns it off for a repository that would rather publish only what its code map names."
      - "`dynamic/symbolsource.json` grew to roughly 640KB for this repository. It is private, local, and capped per file and in total; a file over the budget is skipped whole rather than truncated into a lie."
      - Highlighting is approximate by construction. It is decoration over text whose line numbers are proved, so being wrong about a token costs a colour and never a link.
      - Six CSS variables carry the token palette, defined for both schemes, so a theme restyles code without touching the prefab.
    alternatives:
      - Highlight at build time with Pygments (rejected - a dependency, and it cannot colour text the build never sees; the public target fetches its source at runtime).
      - Ship a highlighter from a CDN (rejected - the site is readable offline and under file://, and this is the one feature that must not need the network on the private target).
      - Seek by re-parsing the file in the browser (rejected - a second implementation of the resolver, free to disagree with the one that proved the line numbers).
      - "Publish whole files on both targets (rejected - adr-024's declined source mirror in a different hat: every source line through the redaction scan)."

  - id: adr-039
    handle: ADR.39
    date: 2026-09-06
    title: The editor is asked for what a published page cannot know, over a four-message bridge
    status: accepted
    context: |
      [[decisions#adr-038]] answers "where is this defined" for every name the build-time index
      holds. It cannot answer for the rest, and the rest is most of a file: a local binding, a
      method on a type from a dependency, anything a macro generated. A text scanner will never
      see those. A language server already has.

      There is a second thing the page cannot do at all. A reader who has found the line usually
      wants to edit it, and the page has no way to open a file - an editor URL scheme needs an
      absolute path, which must never be written into a build ([[decisions#adr-004]]), and the
      private server has no business shelling out to a local program on a page request.
    decision: |
      When the page is framed by a host that answers a handshake, offer the two things only the
      host can do. The protocol is four messages: the page posts `hello`, a host replies `ready`,
      and the page may then post `open` or `reveal`, and `definition` - to which the host may reply
      with a resolved location, so the pane follows the editor.

      `tools/vscode-yss/` is that host: a webview framing the private preview, relaying messages to
      the editor's own definition provider, which is answered by whatever language server the
      workspace already has.

      Every path the page sends is repo-relative, and the host resolves it against its own
      workspace. That is what keeps [[decisions#adr-004]] intact - no absolute path is written
      anywhere - and it is also the trust boundary: the page is framed content, so the extension
      refuses absolute paths, drive letters, URL schemes and parent-directory segments, then
      re-tests the resolved path against the root. The bridge has no message that writes, saves or
      runs.
    consequences:
      - The fullest form of the reader needs an editor, and every lesser form still works - no host means no buttons, and nothing else about the page changes.
      - "`go to definition` answers for names the index never held, which is most of what a reader clicks on."
      - "A second surface to keep working: a couple of hundred lines of JavaScript with no build step that no test here can exercise. The suite asserts only that the page treats it as optional."
      - Detection is a handshake rather than an assumption about being framed, so an unrelated host embedding the site sees nothing new.
    alternatives:
      - An editor URL scheme in the page (rejected - the absolute path would be written into dist/, which the public build fails on and the private build should not carry either).
      - "An open endpoint on the dev server that shells out to the editor (rejected for the reason adr-024 rejected a source endpoint: a local program run from a page request)."
      - A language server in the page over a WebSocket (rejected - it is the editor, rebuilt, for a site whose main content is static HTML).
      - "Nothing, and let the reader copy `file:line` (rejected only once the bridge turned out to be four messages; the copy is still the fallback in any browser)."
  - id: adr-040
    handle: ADR.40
    date: 2026-09-07
    title: The build lock checks liveness properly, and callers may wait for it
    status: accepted
    context: |
      [[decisions#adr-019]]'s advisory lock could not tell a held lock from an abandoned one. A
      build stopped with ctrl-c left its file behind, and every build for the next ten minutes was
      refused on behalf of a process that no longer exists - recoverable only by deleting the file
      by hand, which is exactly the state the lock exists to make unnecessary (gh-34).

      The original declined to liveness-check for a real reason, written into its docstring:
      `os.kill(pid, 0)` is the POSIX idiom, and on Windows it terminates the process. So the choice
      looked like a bad check or no check, and no check won.
    decision: |
      Ask the platform properly. `_pid_alive` uses `os.kill(pid, 0)` on POSIX and `OpenProcess`
      with PROCESS_QUERY_LIMITED_INFORMATION plus `GetExitCodeProcess` on Windows, and returns
      None when it cannot tell. A fresh lock whose pid is provably dead is reclaimed with a
      warning; unknown counts as alive, so the worst case is the behaviour we already had.

      Liveness does not help against a live process holding a lock, so `build(..., wait=)` and
      `yss build --wait [SECONDS]` poll every half second before giving up, bare `--wait` meaning
      sixty. `yss serve` waits ten seconds on its own rebuilds: a human running `yss build` by hand
      while the watcher runs is the common collision, and of the two the rebuild is the one that
      can be postponed for free.
    consequences:
      - A crashed build no longer costs ten minutes or a manual deletion.
      - The refusal names the holder's pid and our own, so the operator can check the claim rather than trust it.
      - "Reclaiming is bounded to three attempts and waiting is bounded by `wait`, so neither path can hang."
      - "A pid recycled onto a live unrelated process reads as alive, which fails safe - the lock is refused, not stolen."
      - "A live process that leaks a lock is still unrecoverable by liveness alone; `--wait` bounds how long you find that out for, and the message says which pid to look at."
    alternatives:
      - "`os.kill(pid, 0)` everywhere (rejected - it terminates the process on Windows, which is the reason the original check was omitted)."
      - A lock timeout after which any lock is stale (rejected - it either steals a slow build's lock or leaves a dead one held; liveness answers the actual question).
      - Waiting forever by default (rejected - a build that never returns is worse than one that says why it will not start).
  - id: adr-041
    handle: ADR.41
    date: 2026-09-07
    title: The prefab asset bundle is per target, not per registry
    status: accepted
    context: |
      `prefab_css` and `prefab_js` iterated the whole prefab registry, so `dist/public` carried the
      css and js of every prefab, including ones no public page renders. That is dead weight for
      every visitor, and a small disclosure besides: a selector set describes markup, and the
      markup of a `visibility: private` page is private (gh-39).
    decision: |
      `Renderer.prefab()` is the single choke point every prefab render passes through, including
      a nested `prefab('badge', ...)` call from inside another template. It records the name in
      `Renderer.used_prefabs`, and the two bundle writers filter on that set. Both files are always
      written, even when the set is empty, so the layout's link and script tags never 404.
    consequences:
      - Visibility reaches the asset bundle, not only the markup.
      - "A prefab reached only at runtime by client-side js would be missed. No such prefab exists, and `Renderer.prefab()` is the place to revisit if one appears."
      - "On this pilot the bundle is unchanged, because the prefab gallery renders every prefab on both targets. The mechanism is asserted by a synthetic test instead."
    alternatives:
      - Declaring used prefabs per page in the page YAML (rejected - a second list to keep in sync with the templates that actually call them).
      - Static analysis of the templates (rejected - `prefab()` is called with computed names, so only the render knows).
  - id: adr-042
    handle: ADR.42
    date: 2026-09-07
    title: An evidence claim may be negative, and may anchor into a document instead of its bytes
    status: accepted
    context: |
      Every `path` claim was a whole-file substring test, and two failures followed from that.

      Nothing could prove a removal. "The workaround is gone", "no TODO is left in this module",
      "the flag no longer appears" are the claims most worth checking after a cleanup, and a
      positive `contains` cannot express any of them. The best an author could do was leave the
      claim off, which reads exactly like never having made it.

      Worse, a claim about a value could be satisfied by an unrelated line. A claim written as
      `{path: docs/design.yaml, contains: "status: open"}`, to hold a defect open until the item
      closed, matched the document's own top-level `status:` key. It reported ok from the day it
      was written and could never have reported anything else. A claim structurally incapable of
      failing is worse than no claim, because the report then says the doc is proved (gh-32).
    decision: |
      Three additions, all on `$defs/evidence_item`, so every kind and every item gets them at once.

      `not_contains:` is the negative form: with `path`, every matched file must lack the text, and
      the stale detail names the file that still has it.

      `at:` is the anchored form. With a YAML target it parses the file and walks a deliberately
      minimal grammar - `key`, `key.key`, `key[i]`, `key[*]` - then judges the leaves with
      `equals`, `in` or `absent: true`. `[*]` is a universal: every leaf must satisfy the test, so
      one live component does not excuse a dead one. Anything richer would be a query language,
      and a doc that needs one is asking the wrong question of an evidence claim.

      And because an existing `contains` claim will not rewrite itself, `yss check` reports `warn`
      on exactly the vacuous case - a `key: value` needle against a YAML file whose every match is
      a top-level line - naming the key and saying `consider at:`.

      `dependentRequired` ties the keys together, so a misspelled combination fails validation
      instead of being silently ignored. The same widening reaches `$defs/option`, so an
      alternative can carry evidence too (gh-35).
    consequences:
      - A cleanup can be proved, which is the class of claim the plan and the audit doc most often want and could not write.
      - A value claim about a doc is checked against the parsed document, so it fails when the value changes rather than when the bytes happen to.
      - "Existing `contains` claims are unchanged but for the one provably-vacuous shape, which drops from ok to warn. Warn and not stale: the claim may still be what the author meant, and a check run must not start failing on a diagnosis."
      - "Every `at:` failure is a stale with a reason - not YAML, will not parse, resolves to nothing. `yss check` walks every doc in the repository, so one malformed claim must never take the run down with it."
      - A third spelling of path evidence is a third thing an author must choose between; the schema states the rule, which is to prefer `at` when the target is YAML and the claim is about a value.
      - "An option's claims are collected and reported but rendered nowhere - no prefab reads `options[].evidence`. Wiring that up needs a decision about whether options get ids, so it is left open."
    alternatives:
      - A general query language such as JSONPath or JMESPath for `at:` (rejected - a dependency and an unbounded surface for a field whose whole job is to stay readable in a diff).
      - Making the envelope self-match stale (rejected - it would fail check runs on claims that may still be correct, and the remedy is to rewrite the claim, not to block the build).
      - "A separate `absent` claim kind rather than a modifier on `at:` (rejected - it is the same walk with the leaf count compared against zero)."
      - "Leaving `contains` alone and documenting the trap in the skill (rejected - the trap was found in a doc that had been green for weeks; documentation checks nothing)."
  - id: adr-043
    handle: ADR.43
    date: 2026-09-07
    title: A reference inside a code span is a warning, never an error
    status: accepted
    context: |
      `_check_inline` validates over `strip_code(text)` and `expand_refs` splits on the same
      pattern, so a reference in backticks is invisible to both. `validate`, `--strict` and
      `check` all pass on a link that a reader sees as literal text - the one failure mode the
      reference system was built to prevent, hiding in the one place nothing looks (gh-38).

      The obvious fix - validate inside code spans too - cannot be taken. Backticks are how the
      syntax gets written about: this repository does it twice on purpose, once in
      `docs/audit.yaml` and once inside an accepted ADR that must never be edited. An error there
      would make the decision log unfixable without breaking the append-only rule.
    decision: |
      `check_code_span_refs(docs, pages)` in `yss/loader.py` reports a warning, printed by
      `validate` and folded into every build report, and never fatal - not under `--strict`
      either. It fires only when the reference would have been a live link: the doc resolves, and
      the item, if one is named, exists. A backticked reference to a doc or item that does not
      exist is exactly what quoting the syntax looks like, and stays silent.

      That discriminator is the whole design. Its false-positive rate equals the number of real
      references someone quotes deliberately, which is small and, being a warning, costs nothing
      but a line of output.
    consequences:
      - This pilot prints two warnings on every validate, both intentional and both correct.
      - "A bare `[[#item]]` inside a page is skipped - `render_page` resolves it against `docs[0]` only, so there is no single owning doc to check against."
      - Nothing changes about how the reference renders; the check reports, it does not rewrite.
    alternatives:
      - Validating inside code spans as an error (rejected - it would fail on the accepted ADR that quotes the syntax, which cannot be edited).
      - An opt-out marker on the string (rejected - a second syntax to learn, for a problem a resolvability test already separates).
      - "Leaving it to review (rejected - the failure is silent by construction; that is why it was filed)."
  - id: adr-044
    handle: ADR.44
    date: 2026-09-07
    title: On-accent contrast is measured at build time, not defaulted or derived
    status: accepted
    context: |
      [[decisions#adr-031]] gave the collection bar four optional tokens and consumed each as
      `var(--token, var(--old-value))`, so stock palettes rendered unchanged. Nothing ever gave
      them values - not `yss.css`, not the stock palettes, not the generated `collections.css` -
      so the fallback was always the branch taken, and the fallback is precisely the broken
      pairing adr-031 was written to fix: `--fg` and `--fg-2` are specified against `--bg`, not
      against `--accent-2`. A saturated secondary accent still rendered a 1.06:1 sub-nav link,
      behind a token system that looked like a fix (gh-31).

      This answers half of the open design item [[design#k-on-accent]], which asked how far the
      on-accent rule reaches. What is settled here is enforcement, not coverage: the rule reaches
      as far as a theme's own stylesheet, and the toolchain's job is to notice when a theme has
      not followed it. Which pairings the gate measures stays open on that item.
    decision: |
      The tokens stay author-declared and undefaulted, and the build measures the result.
      `yss/contrast.py` implements WCAG 2.x relative luminance and contrast ratio plus a tolerant
      regex scanner for `--token: <hex>;` declarations in a stylesheet's `:root` and
      `prefers-color-scheme: dark` blocks. The build resolves three pairings for the site theme and
      each visible collection, in both schemes, through the same `var()` fallback chains `yss.css`
      uses: the title, the resting sub-nav link, and the active pill. Under 4.5:1 is a warning and
      a `--strict` failure, alongside the dead-link and dead-reference gates.

      A value the scanner cannot read as a hex literal is unknown and skipped in silence. A
      declared `color-mix()` shadows its fallback exactly as it does in the cascade, so the pair is
      unresolvable and the gate says nothing. Guessing would be wrong, and failing would block a
      theme for doing something reasonable.
    consequences:
      - A theme that uses --accent-2 as a real secondary accent is told so at build time, by collection, scheme, colour pair and ratio, instead of shipping an unreadable bar in silence.
      - The gate generalises - it catches the next contrast regression in these pairings, not only this one - which is why it was preferred over a one-time fix.
      - "The first thing it caught was this repository's own `examples/demo-musing`, whose accent drew 2.29:1 in dark mode. That collection now declares a dark accent."
      - "A theme computing its on-accent colours is unmeasurable and therefore unchecked; the gate's tolerance is a deliberate false negative, never a false positive."
      - "`yss.css` is unchanged, so the assertion that no on-accent token is declared in `:root` or the dark block still holds."
      - "`m7-on-accent-rest` stays blocked, but on a smaller question: which pairings the gate should measure, rather than how the rule is enforced at all. Adding a pair is now a line of configuration."
    alternatives:
      - "Derive the triple into `assets/collections.css` (rejected, the closest call). That sheet is linked first and its body-class rule outranks a `:root` declaration, so a guess would beat the author's own answer."
      - "Declare the tokens on `:root` with `var()` defaults (rejected on adr-031's substitution rule: a custom property resolves its var() where it is declared, so the site's --fg would freeze over a collection theming its own)."
      - "Derive in CSS with `color-contrast()` or `light-dark()` (rejected on browser support, and it would still be unmeasurable by any checker)."
      - "Documentation only (rejected as insufficient - the failure is silent, which is the whole complaint; the docs ship alongside the gate, not instead of it)."
  - id: adr-045
    handle: ADR.45
    date: 2026-09-07
    title: A worksheet archives itself by deriving its visibility and publishing a projection
    status: accepted
    context: |
      `visibility` was an authored key read literally by `is_visible`, and redaction could only
      remove a whole object or delete `private_notes`. A worksheet is written private because of
      its candid free text, and that reason does not expire when the questions are answered - so
      the sheet worth publishing, the answered one, stayed private forever, and flipping the key by
      hand would have published the candid parts along with the answers (gh-37). Meanwhile the two
      things worth publishing from a finished sheet - the prompt it was built to produce, and which
      option was picked - were already structured data.
    decision: |
      Add one derived visibility value, `on_resolution`, legal only on a `doc.worksheet`: the sheet
      is private while any question that requires an answer lacks a `resolution`, and public once
      the last one lands. The flip is mechanical, so no human decides per sheet whether it is safe.

      What publishes is not the authored document but a projection of it, applied inside
      `filter_for_target` so every consumer - the page render, the `data/docs/<id>.json` export,
      `yss export`, the symbols provider - gets it from one implementation. The rule: structured
      answers publish; prose written to steer or record a human deliberation does not. Elided are
      `private_notes` as before, the doc's `agent_notes`, and every `resolution.summary`; a
      `kind: text` answer publishes only as the two-state marker `resolution.answered`. Everything
      else - `intro`, `warn`, the whole `prompt`, each question's `call`, `lead`, `help`, `blocks`,
      the `options[]` as offered and `chose[]`, `applied`, `by`, `recorded_in[]` - reaches the
      public target unchanged, because a selection is an enum and publishing it costs no
      transcription.

      The unit that flips is the file, not the item: `$defs/visibility`, and so `item_base`, stays
      two-valued. A half-published sheet has holes in its numbering and `blocks[]` links pointing
      at questions the public reader cannot see, and its safety would rest on a per-item judgement
      rather than one predicate.
    consequences:
      - An answered worksheet is publishable by construction rather than by review, so a worksheet index has something to index.
      - "One sheet per deliberation becomes the useful habit: a sheet with a live question in it can never flip, so an accumulating per-project sheet is now a choice with a cost."
      - "`is_visible` is no longer a pure literal read. It fails closed: the keyword on a non-worksheet, or on a sheet with no questions, means private."
      - "`resolution.summary` no longer reaches the public target from such a sheet, so anything an author wants published must be structured - a chosen option or a `recorded_in[]` link."
      - "A resolved `kind: text` question on such a sheet must carry `answered`, or validation fails - the marker is the whole public record of that answer."
      - "The nav's waiting count and the flip share one predicate, so they cannot drift apart."
      - "`chose[]` is now checked against its own question's option values on every worksheet, not only derived ones. The schema had said so in prose since it was written."
    alternatives:
      - "An `archive_visibility: public` key the author sets (rejected - still a human deciding per sheet, which is the thing that never happens)."
      - Whole-object redaction plus a hand-written public copy of the sheet (rejected - two documents that disagree the moment one is edited).
      - "Per-item `on_resolution` (rejected - a document with holes in its numbering, and safety by per-item judgement)."
      - "Publishing `resolution.summary` too (rejected as the default - it is unreviewed prose, and `chose[]` already carries the answer; a sheet that wants prose published can put it in `intro`)."

  - id: adr-046
    handle: ADR.46
    date: 2026-09-07
    title: Handles are a second key on the existing index, not a parallel namespace
    status: accepted
    context: |
      Enumerated items in another repository carry stable handles - `TSG.9`, `MSL.1` - and yss had
      nothing like them. Except that it nearly did: `[[plan#m14-audit]]` is already a stable,
      validated, site-resolvable reference, item ids are unique per doc and never renamed, and
      `yss refs` already answers who points at one. So the honest question was not "add handles"
      but "why is `doc#item` not enough?"

      It is not enough for one reason, and the reason scopes the feature: **a handle has to survive
      outside the yss corpus.** The reference resolver only reaches docs and pages, while a handle
      gets written in a Rust comment, an SVG label, a commit message, a chat. A `[[doc#item]]`
      reference in a `.rs` file is just text. That, plus being short enough to say aloud, is the
      whole case.
    decision: |
      A handle is a **second key on the index that already exists**, never a second system. A doc
      declares a mnemonic in its envelope; each item declares its own handle; a handle citation and
      a `[[doc#item]]` reference enter the same resolver and return the same item, and the in-scope
      form is the existing bare-item form under another spelling. Storage is canonically uppercase
      with case-folding lookup, so the corpus never carries two spellings of one handle. Handles are
      **declared on the item, never derived** - from list position, which breaks the first time a
      list is sorted, or from a slug, which is a coincidence. Only the explicit reference form
      links; a bare handle in prose stays inert text and is the mention sweep's business.
    consequences:
      - One resolver, one error vocabulary, one thing to maintain; a citation and a reference are the same mechanism.
      - Mnemonics are unique across the whole site - a constraint yss did not have, since item ids are only unique per doc.
      - Every existing doc was backfilled, so the numbering is assigned rather than earned; see adr-047.
    alternatives:
      - "Reuse doc-item ids as handles (rejected - they are not append-only, carry no per-doc prefix, and are not swept for outside docs; all three would have had to be added anyway)."
      - "Let the register skill define its own handle convention (rejected - the register would own a rule the whole toolchain needs, and a repo with no register would get no answer)."
      - "Auto-link bare handles in prose (rejected - version numbers, figure labels and a deliberately quoted retired handle all false-positive)."

  - id: adr-047
    handle: ADR.47
    date: 2026-09-07
    title: Every doc mints a mnemonic, and a handle's ordinal identifies an item without dating it
    status: accepted
    context: |
      Making handles first-class meant deciding how much of this repository had to change. Docs
      here already hold items with semantic slugs; numbering them today invents an order that never
      existed, and the danger is that a later agent reads a low number as older than a high one and
      infers a history the backfill never had. Not backfilling was worse: the register's own
      generator treats a gap in a series as a missing row, so a partially numbered series fails by
      design.
    decision: |
      Every doc in the site declares a mnemonic and every item that carries an `id` carries a
      handle, backfilled in **file order** - 352 handles across 18 series. And it is written down,
      here and in [[codemap#cv-handles-append-only]], that **an ordinal identifies an item and dates
      nothing**. What the number does guarantee is the append-only contract: never renumbered, never
      reused, struck in place rather than rewritten, and the mint pointer for a successor is one
      past the highest the series has reached, which `python -m yss handles` prints.
    consequences:
      - Anything is citable without a second migration, and no series starts life with a gap.
      - Backfilled numbers carry no information; a reader who assumes chronology is wrong, so it is stated in the code map and the skills.
      - "A changelog release carries no `id`, so it carries no handle either: the mnemonic exists and the series is empty."
    alternatives:
      - "Only rule-bearing docs (rejected - it needs a judgement per doc, and a doc that later wants handles has to be backfilled anyway)."
      - "Backfill in git-first-appearance order (rejected - an archaeology pass over every doc for a property nothing depends on, and items that moved between files would date wrongly)."
      - "Number only items touched from now on (rejected - it produces exactly the gapped series the generator refuses)."

  - id: adr-048
    handle: ADR.48
    date: 2026-09-07
    title: Bound handles resolve to text; mentions resolve to a location
    status: accepted
    context: |
      A register quotes both sides of every contradiction verbatim, and a citation tooltip shows the
      cited item's own words. Both need a *boundary*: somewhere the quoted text provably stops. A
      doc item has one - it is an object. A handle written in page prose, a Rust comment or a commit
      message does not: is the item the sentence, the list item, the paragraph? Every answer is a
      heuristic, and heuristics fail silently exactly where the quote matters most.

      Page prose is the interesting case, because a page section's `id` is documented as an anchor
      that defaults to `section-N` - positional and disposable, which is the opposite of what
      permanent identity needs.
    decision: |
      Two classes, named differently and promising different things. A **bound handle** lives on a
      doc item, resolves to exact text, and alone powers tooltips, citations and register quotes. A
      **mention** is a handle written anywhere else: the sweep must find it and a register must have
      a row for it, but it resolves to a **location, never a quote**, and can never be a
      contradiction pair subject.

      The register's founding rule then does the enforcement with no new policy: a contradiction
      that cannot be quoted is one an agent invented, and a mention is unquotable by construction.
      Migration is demand-driven - a prose handle becomes a doc item at the moment something needs
      to quote it, not on a schedule.
    consequences:
      - Indexing page items stays available as a strict superset later; nothing here has to be undone to get it.
      - A handle-bearing list in page prose is not first-class - it needs a doc and a binding, which is real friction on the most creative part of the workflow.
      - "A doc that cites rather than mints spells the field `subject:`; `handle:` declares. The two must not be confusable."
    alternatives:
      - "Index page items now (rejected - pages have never had id discipline, a section id is deliberately disposable, and every quote would be a boundary heuristic)."
      - "Doc-only handles with no sweep (rejected - a handle in a Rust comment then exists in prose and nowhere in the instrument, which is the failure the register exists to catch)."

  - id: adr-049
    handle: ADR.49
    date: 2026-09-07
    title: The live-rules list is generated as YAML and a page, with no markdown export
    status: accepted
    context: |
      The instrument's first implementation committed a markdown live-rules file at the collection
      root, precisely because a file you must run a generator to read is a file a fresh agent will
      not read. It is not a violation of rule zero in spirit - it is a generated export of a doc
      that also exists as YAML - but an agent meeting that file while holding rule zero will either
      delete it or copy the pattern for something that is not generated.
    decision: |
      Generate the YAML doc and render it as a page; emit no markdown file. Rule zero keeps no
      exception, and there is one fewer generated artefact to keep in step.
    consequences:
      - "The paste-into-a-prompt form is gone: an agent reads the doc or the built page instead."
      - Rule zero stays absolute, so nothing has to be explained away when the next agent reads it.
      - The origin repository's committed markdown output has no shipped equivalent, which its migration has to account for.
    alternatives:
      - "Keep the markdown at the collection root as a named exception (rejected here - findability was its whole case, and a markdown file at a collection root invites imitation for things that are not generated)."
      - "Emit it into a clearly generated directory (rejected - findability was the point, and a fresh agent looks at the root first)."

  - id: adr-050
    handle: ADR.50
    date: 2026-09-07
    title: A public page may cite a private handle; the citation resolves to nothing
    status: accepted
    context: |
      A citation's tooltip resolves a handle to text at build time, so a public page citing a handle
      from a private doc could inline private wording into the public build - a leak the
      forbidden-string scan cannot catch, because it looks for identity strings and this is ordinary
      prose. Binding a private doc from a public page is already a build error, which argued for
      making this one too.
    decision: |
      Allow it. The handle index is built from each target's **already filtered** docs, so in the
      public build the private doc is simply absent: the citation resolves to nothing and renders as
      inert text carrying the number and no wording. No build fails for a number, and no wording
      crosses the line.
    consequences:
      - A public page can acknowledge that a private decision exists by number, which is often exactly what a correction needs to do.
      - The two builds differ silently at that spot - a reviewer reading the private build sees a live citation where the public one shows plain text.
      - Responsibility moves to the surrounding prose, which is where the recorded near-miss happened - a public page naming private files by name, with the scan silent.
    alternatives:
      - "Make it a build error, matching the private-doc binding rule (rejected - it forbids naming a private decision by number at all)."
      - "Set no policy (rejected - unset means public, and the failure mode is a silent leak)."

  - id: adr-051
    handle: ADR.51
    date: 2026-09-07
    title: The register ships as a doc kind, a built-in prefab and a yss subcommand
    status: accepted
    context: |
      The contradiction register and its live-rules list were invented for one musing, generalised
      to a second, then written up as a skill inside that repository describing that musing as
      though it were the instrument. The shape is general. The question was how much of it yss
      should own: the doc shape alone, or the page and the generator too.

      The generator's value is two properties - rule text verbatim from its source, and failing
      rather than dropping a rule it cannot account for. Neither is a promise a written-down
      algorithm can keep; a copy per repository diverges the first time somebody is in a hurry.
    decision: |
      All of it. `doc.register` is a real kind with the `register_state` vocabulary in site.yaml;
      `contradiction-register` is a built-in prefab, so the instruction builder behaves the same
      everywhere and a site can still override it; `python -m yss live-rules <collection> [--check]`
      is the generator, with its eleven refusals covered by tests. Per-collection particulars -
      series prefixes, per-series strike forms, unminted handles, swept extensions - live in a
      `register:` block in that collection's own collection.yaml (site.yaml for the root collection,
      which is the root's config file). The mention sweep is core rather than the register's,
      because a site can want to know where its handles are mentioned without running a register at
      all.
    consequences:
      - yss now owns an instrument it did not invent, including ten-plus failure modes and a config surface.
      - "The staleness gate stays a `command:` evidence claim shipped on the generated doc: `yss check --run-commands` reports a stale list. Detectable, not prevented - nothing runs the generator for you."
      - "The demo collection carries the worked example the `yss-register` skill points at; the origin repository migrates in a separate pass."
    alternatives:
      - "Keep the register as `kind: generic` with a `shape:` field (rejected - validate would prove nothing about the rows that actually go wrong, and the state vocabulary would stay hard-coded)."
      - "Ship no generator code and describe the algorithm in the skill (rejected - fail-never-drop could then only be asked for, never kept)."
      - "Make the build or validate fail on a stale list (rejected - a mid-edit build would fail, and freshness is not what those commands are for)."

  - id: adr-052
    handle: ADR.52
    date: 2026-09-07
    title: A handle may carry a sub-series tag, and ordinals count within a series
    status: accepted
    supersedes: adr-046
    context: |
      [[decisions#adr-046]] defined a handle as `PREFIX.<n>` with a numeric ordinal. The first repo
      to adopt it rejected 159 of its own handles on that grammar: it mints `MUA.J1`, `VFB.Q5`,
      `GTH.B3`, `PNO.D2`, `SCC.M4` and fifteen more shapes - a letter tag before the number, marking
      the *kind* of item (question, decision, beat, musing) inside one doc's series.

      Two ways out were wrong. Renaming them to separate prefixes (`VFB.Q5` becomes `VFBQ.5`) is
      exactly what append-only forbids: those handles were minted, are cited in prose, and renaming
      a minted handle is the one thing the whole instrument promises never to do. Leaving those docs
      unhandled would strand the docs that had used handles hardest.
    decision: |
      The grammar is `PREFIX.<tag><n>`, where the tag is an optional run of up to three letters.
      Every existing handle survives untouched.

      The distinction the tag introduces is between a **mnemonic** - what a doc declares, and what
      makes a handle unique across the site - and a **series**, which is what an ordinal counts
      within. `VFB.Q` and `VFB.D` are two series of one mnemonic, so `VFB.D4` leaves no gap at 4 in
      `VFB.Q`, each mints its own next number, and the register's gap check runs per series key. A
      register's `series[].prefix` may name a whole mnemonic or one series key. The in-scope form
      takes a tag too: `[[.Q5]]`.
    consequences:
      - The adopting repository's handles validate as they stand; no minted handle is renamed.
      - "`yss handles` reports one row per series rather than per mnemonic, because a single mint pointer for a doc with sub-series would hand out a number another series already used."
      - The tag is capped at three letters so an ordinary word after a dot cannot read as a handle; a longer tag is not a handle and the sweep ignores it.
    alternatives:
      - "Rename the tagged handles to their own prefixes (rejected - renaming a minted handle is precisely what append-only forbids, and they are cited in prose across the repo)."
      - "Leave those docs without mnemonics so their handles stay mentions (rejected - it strands the docs that used handles most, and they are exactly the ones with registers)."
      - "Allow an unbounded tag (rejected - `OS.Design1` would read as a handle, and the sweep would start reporting prose)."

  - id: adr-053
    handle: ADR.53
    date: 2026-09-07
    title: A handle series belongs to the site, not to one doc
    status: accepted
    supersedes: adr-046
    context: |
      Two rules went into the handle layer with no real data behind them: a doc declares **one**
      mnemonic, and every handle in it must use that mnemonic. Both are assumptions, and the first
      repository to adopt handles breaks both. Seven of its docs carry two or three prefixes each -
      one carries `FB`, `FBK` and `VFB` - and two prefixes span two docs apiece. That is not
      disorder: a musing whose questions, decisions and beats grew across a plan file and a spec
      file is the ordinary shape of the work.

      Neither cheap fix was available. Folding a second prefix into a sub-series tag (`AGRP.1`
      becoming `AGR.P1`) renames minted handles, which is precisely what append-only forbids and
      what the whole instrument promises never to do. Splitting seven docs is a large content
      migration in another repository, decided here rather than there, for a constraint yss
      invented.
    decision: |
      `mnemonic:` takes one value or a list; several docs may declare the same series; and the
      invariant that carries the weight is that a **handle** is unique across the site, which is
      enforced independently and unchanged.

      A declaration now buys exactly two things: a scope for the in-scope reference form, which is
      the **first** mnemonic a doc lists, and a prefix the mention sweep will trust. The check that
      a handle uses its own doc's mnemonic is withdrawn; the check that its prefix is declared
      *somewhere* replaces it.
    consequences:
      - The adopting repository's docs can declare their series as they actually are, with no handle renamed.
      - "A handle written into the wrong doc is no longer caught - the trade this makes. A typo'd prefix still is, because it is declared nowhere."
      - "`Mnemonic.doc_id` is now the *first* doc to declare a series, used for the tooltip's series line and nothing else."
      - "adr-046 keeps `status: accepted` and no `superseded_by`: this record and adr-052 each amend one clause of it, and its core - a handle is a second key on the index that already exists - is untouched."
    alternatives:
      - "Split the docs that carry several prefixes (rejected - a large migration in another repository to satisfy a rule yss invented)."
      - "Fold second prefixes into sub-series tags (rejected - it renames minted handles, which append-only forbids)."
      - "One primary mnemonic plus declared guests (rejected - a concept invented for this case alone, and it still fails where one prefix spans two docs)."

  - id: adr-054
    handle: ADR.54
    date: 2026-09-07
    title: A gap in a handle series is checked only where a register covers it
    status: accepted
    context: |
      Append-only makes a gap a missing row rather than a free number, and the live-rules generator
      hard-fails on one. That check runs only for series a register covers; every other series can
      develop a gap in silence. The question was whether `validate` should report gaps everywhere.
    decision: |
      Leave it where it is. A gap outside a register is usually a deleted item rather than a lost
      one - deleting an item outright is still legal, and only *renumbering* is forbidden - so a
      site-wide error would make an ordinary edit illegal, and a site-wide warning would be one more
      line agents learn to scroll past. `python -m yss handles` prints gaps for anyone who wants
      them; where the discipline was actually agreed, the generator enforces it.
    consequences:
      - Most series are unchecked for gaps, and that is the intended state rather than an omission.
      - A register is the thing that turns append-only from a convention into an enforced rule for the series it covers.
      - "`cv-handles-append-only` stays `enforced_by: none`, with the nuance written into its rationale."
    alternatives:
      - "A validate warning everywhere (rejected - a warning nobody acts on, for a case that is usually a legal deletion)."
      - "A validate error everywhere (rejected - it makes deleting an item illegal repo-wide, which nobody asked for)."

  - id: adr-055
    handle: ADR.55
    date: 2026-09-07
    title: An item with no id carries no handle
    status: accepted
    context: |
      Handles were backfilled onto every item carrying an `id`, because an id is what an anchor and
      a reference already resolve to. Some items carry identity another way - a changelog release is
      named by its `version` - and now sit under a mnemonic with an empty series, which reads as an
      oversight.
    decision: |
      Leave them. Nothing has ever needed to cite a release by handle, its version already names it,
      and inventing ids so that handles become possible is a migration in search of a reader. A
      handle on an item with no anchor would resolve and quote but never link, which is a second
      class of citation whose difference is invisible until someone clicks.
    consequences:
      - "A doc whose items have no ids keeps a mnemonic with an empty series; `yss handles` shows it as zero."
      - "The rule is `every item that carries an id`, not `every item` - stated that way in the code map and both skills."
    alternatives:
      - "Give those items ids and then handles (rejected - ids invented for items nobody addresses)."
      - "Allow a handle with no id, quoting but never linking (rejected - a citation that never links looks broken)."

  - id: adr-056
    handle: ADR.56
    date: 2026-09-07
    title: A register's bootstrap stays a documented two-step
    status: accepted
    context: |
      A register that points a reader at its generated list - which the skill says it should - cannot
      validate until that list exists, because the reference is checked and the file has not been
      generated yet. The way through is to write the register without the forward link, generate,
      add the link, regenerate.
    decision: |
      Leave it a documented two-step; do not scaffold a placeholder output doc. A placeholder is a
      file that claims to be generated while being a projection of nothing, and someone would commit
      it. The sequence is four commands and the skill spells them out.
    consequences:
      - An agent setting up its first register meets a validation error before it meets the instruction, which the skill's setup section pre-empts.
      - No generated file ever exists that is not a real projection of a register.
    alternatives:
      - "Scaffold an empty generated doc (rejected - a file that is not yet a projection of anything, and someone commits it)."
      - "Drop the register's forward link entirely (rejected - the redirect belongs on the page an agent opens by mistake)."

  - id: adr-057
    handle: ADR.57
    date: 2026-09-07
    title: The demo collection's register is public, as the one worked example
    status: accepted
    context: |
      Register docs default to `visibility: private`, which is right: a register quotes internal
      disagreement and half-formed rules, and the public tree is uploaded wholesale. That left the
      only rendered example of the instrument invisible to anyone who has not cloned the repository
      - including anyone deciding whether to adopt yss at all.
    decision: |
      The demo collection's register, its generated live-rules list and both pages are public, with
      the reason written on each. The default is unchanged; this is one collection opting out of it
      deliberately, which the skill already documents as possible. Its content is invented material
      about a demo playable.
    consequences:
      - The register prefab and the live-rules tables now render in the public build, where the skill's reader can see them.
      - "A public register is an example of the exception rather than the rule, so each file says so in as many words; the `yss-register` skill repeats the warning."
      - Copying the demo collection inherits public visibility, which is the risk this accepts.
    alternatives:
      - "Keep it private like every other register (rejected - the worked example the skill spends two thousand words on would be invisible)."
      - "A screenshot on a public page (rejected - it goes stale silently, no evidence claim can prove it current, and the controls cannot be tried)."
